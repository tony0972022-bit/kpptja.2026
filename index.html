                            <select value={leaveFilter} onChange={e => setLeaveFilter(e.target.value)} className="border p-2 rounded text-sm bg-white flex-1 md:flex-none">
                                <option value="all">所有假別/出勤</option>
                                {leaveTypes.map(t => <option key={t} value={t}>{t}</option>)}
                            </select>
                            <div className="flex gap-2 w-full md:w-auto">
                                <button onClick={downloadBatchICS} className="bg-indigo-600 text-white px-3 py-2 rounded flex items-center gap-2 text-sm flex-1 justify-center hover:bg-indigo-700 transition">
                                    <CalendarPlus size={16}/> 批次加行事曆 (.ics)
                                </button>
                                <button onClick={exportCSV} className="bg-green-600 text-white px-3 py-2 rounded flex items-center gap-2 text-sm flex-1 justify-center hover:bg-green-700 transition">
                                    <FileSpreadsheet size={16}/> 匯出 Excel
                                </button>
                                <button onClick={exportOfficialDoc} className="bg-blue-800 text-white px-3 py-2 rounded flex items-center gap-2 text-sm flex-1 justify-center hover:bg-blue-900 transition shadow-sm font-bold border border-blue-900">
                                    <FileText size={16}/> 產出簽到表 (Word)
                                </button>
                            </div>
                        </div>
                    </div>

                    <div className="bg-white rounded shadow overflow-hidden">
                        <table className="w-full text-sm text-left">
                            <thead className="bg-gray-50 border-b font-bold text-gray-600">
                                <tr>
                                    <th className="p-3 w-10 text-center">
                                        <input type="checkbox" checked={isAllSelected} onChange={toggleAll} className="w-4 h-4 rounded text-indigo-600 focus:ring-indigo-500 cursor-pointer" />
                                    </th>
                                    <th className="p-3 w-16">姓名</th>
                                    <th className="p-3 w-28">日期</th>
                                    <th className="p-3 w-16">時間</th>
                                    <th className="p-3 w-20">假別</th>
                                    <th className="p-3 w-16">時數</th>
                                    <th className="p-3">排班內容</th>
                                    <th className="p-3 w-32">事由</th>
                                    <th className="p-3 w-28">狀態</th>
                                    <th className="p-3 w-20 text-center">操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                {filteredRows.map((r) => (
                                    <tr key={r.id} className={`border-b last:border-0 hover:bg-gray-50 transition ${selectedIds.includes(r.id) ? 'bg-indigo-50/50' : ''}`}>
                                        <td className="p-3 text-center">
                                            <input type="checkbox" checked={selectedIds.includes(r.id)} onChange={() => toggleOne(r.id)} className="w-4 h-4 rounded text-indigo-600 focus:ring-indigo-500 cursor-pointer" />
                                        </td>
                                        <td className="p-3 font-medium">{r.name}</td>
                                        <td className="p-3">{r.date}</td>
                                        <td className="p-3">{TIME_SLOTS.find(s=>s.id===r.slot)?.label||'整天'}</td>
                                        <td className="p-3">
                                            {r.leaveType !== '-' ? <span className="bg-gray-100 text-gray-700 px-2 py-0.5 rounded text-xs">{r.leaveType}</span> : '-'}
                                        </td>
                                        <td className="p-3">{r.leaveHours}</td>
                                        <td className="p-3">
                                            {r.content ? (
                                                <span className="font-bold text-blue-700">
                                                    {r.content} {r.area && `(${r.area})`}
                                                </span>
                                            ) : <span className="text-gray-400">-</span>}
                                        </td>
                                        <td className="p-3 text-xs text-gray-500">{r.reason}</td>
                                        <td className="p-3">
                                            <span className={`px-2 py-1 rounded text-xs font-bold ${
                                                r.status === '缺公務單' ? 'bg-red-100 text-red-600' :
                                                ['假別不符', '異常公出', '已駁回'].includes(r.status) ? 'bg-orange-100 text-orange-600' :
                                                ['待職代審查中', '組長審查中'].includes(r.status) ? 'bg-blue-100 text-blue-600' :
                                                'bg-green-100 text-green-600'
                                            }`}>
                                                {r.status}
                                            </span>
                                        </td>
                                        <td className="p-3 text-center">
                                            {r.leaveId && (r.name === user.name || user.role === 'admin') && (
                                                <button onClick={() => handleDeleteLeave(r.leaveId)} className="text-red-500 hover:bg-red-50 px-2 py-1 rounded border border-red-200 text-xs flex items-center justify-center gap-1 w-full" title="撤銷這張假單">
                                                    <Trash size={12}/> 撤銷
                                                </button>
                                            )}
                                        </td>
                                    </tr>
                                ))}
                                {filteredRows.length === 0 && <tr><td colSpan="10" className="p-8 text-center text-gray-400">尚無符合條件的出勤資料</td></tr>}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }

        // --- 待送差單小卡 ---
        const PendingLeaveCard = ({ task, leaveTypes, deputies, onSubmit, isSubmitting }) => {
            const [type, setType] = useState('出差'); 
            const [deputyId, setDeputyId] = useState('');

            const handleSend = () => {
                if(!deputyId) { alert("請選擇職務代理人"); return; }
                onSubmit({
                    type,
                    start: task.suggestedStart,
                    end: task.suggestedEnd,
                    reason: task.reason,
                    deputyId,
                    hours: task.slot === 'all_day' ? 8 : 4
                });
            }

            return (
                <div className="bg-white p-4 rounded-xl border border-indigo-100 shadow-sm space-y-3">
                    <div className="flex flex-col md:flex-row justify-between md:items-center border-b border-gray-100 pb-3 gap-2">
                        <div>
                            <div className="font-bold text-gray-800 flex items-center gap-2">
                                <Calendar size={16} className="text-indigo-500"/>
                                {task.date} <span className="text-indigo-600">{task.item}</span> {task.area && `(${task.area})`}
                            </div>
                            <div className="text-xs text-gray-500 mt-1 flex gap-3">
                                <span><span className="font-bold text-gray-600">時段：</span>{task.slot === 'morning' ? '上午' : task.slot === 'afternoon' ? '下午' : '整天'} ({task.suggestedStart.split('T')[1]} ~ {task.suggestedEnd.split('T')[1]})</span>
                                <span><span className="font-bold text-gray-600">自動匯入事由：</span>{task.reason}</span>
                            </div>
                        </div>
                    </div>
                    
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label className="text-xs font-bold text-gray-500 block mb-1">確認假別 (預設出差)</label>
                            <select className="w-full border border-gray-300 p-2 rounded bg-gray-50 focus:bg-white text-sm" value={type} onChange={e=>setType(e.target.value)}>
                                {leaveTypes.map(t=><option key={t} value={t}>{t}</option>)}
                            </select>
                        </div>
                        <div>
                            <label className="text-xs font-bold text-gray-500 block mb-1">請選擇職務代理人 <span className="text-red-500">*</span></label>
                            <select className="w-full border border-indigo-300 p-2 rounded bg-white shadow-inner text-sm focus:ring-2 focus:ring-indigo-200 outline-none" value={deputyId} onChange={e=>setDeputyId(e.target.value)}>
                                <option value="">-- 點此選擇職代 --</option>
                                {deputies.map(u=><option key={u.docId} value={u.docId}>{u.name}</option>)}
                            </select>
                        </div>
                    </div>

                    <div className="pt-2 text-right">
                        <button 
                            onClick={handleSend} 
                            disabled={isSubmitting} 
                            className="w-full md:w-auto bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2.5 rounded-lg text-sm font-bold shadow-md transition disabled:opacity-50 flex justify-center items-center gap-2 ml-auto"
                        >
                            {isSubmitting ? <><Loader2 className="animate-spin" size={16}/> 傳送中...</> : <><Check size={16}/> 確認送出此差單</>}
                        </button>
                    </div>
                </div>
            )
        }

        // --- 差勤表單 ---
        function LeaveForm({ user, users, leaves, events, crud, leaveTypes }) {
          const [form, setForm] = useState({ type: '休假', start:'', end:'', reason:'', deputyId:'' });
          const [hours, setHours] = useState(0);
          const [isSubmitting, setIsSubmitting] = useState(false);
          const [submittingTaskId, setSubmittingTaskId] = useState(null);

          const pendingExternalTasks = useMemo(() => {
              const groups = {};
              events.forEach(e => {
                  if (!groups[e.groupId]) groups[e.groupId] = { tag: null, people: [] };
                  if (e.type === 'tag') groups[e.groupId].tag = e;
                  if (e.type === 'person') groups[e.groupId].people.push(e);
              });

              const pending = [];
              Object.values(groups).forEach(g => {
                  if (!g.tag) return;
                  
                  const isExternal = EXTERNAL_WORK_TAGS.includes(g.tag.item); 
                  if (!isExternal) return;

                  const isMe = g.people.some(p => p.userId === user.uid || p.userId === user.docId || p.userName === user.name);
                  if (!isMe) return;

                  const d = g.tag.date; 
                  let startTime = `${d}T08:00`;
                  let endTime = `${d}T17:00`;
                  if (g.tag.slot === 'morning') { endTime = `${d}T12:00`; }
                  else if (g.tag.slot === 'afternoon') { startTime = `${d}T13:00`; }

                  const hasLeave = leaves.some(l => 
                      (l.requesterId === user.uid || l.requesterId === user.docId || l.requesterName === user.name) && 
                      l.start.startsWith(d) && 
                      l.status !== 'rejected' 
                  );

                  if (!hasLeave) {
                      pending.push({
                          id: g.tag.groupId,
                          date: d,
                          slot: g.tag.slot,
                          item: g.tag.item,
                          area: g.tag.area,
                          suggestedStart: startTime,
                          suggestedEnd: endTime,
                          reason: `[${g.tag.item}] ${g.tag.area ? g.tag.area : ''} ${g.tag.note ? '- ' + g.tag.note : ''}`.trim()
                      });
                  }
              });
              return pending.sort((a,b) => a.date.localeCompare(b.date));
          }, [events, leaves, user]);

          useEffect(() => {
              if(form.start && form.end) {
                  const diff = (new Date(form.end)-new Date(form.start))/36e5;
                  setHours(Math.max(0, Math.round(diff*2)/2));
              }
          }, [form.start, form.end]);

          const handleTaskSubmit = async (taskData, taskId) => {
              setSubmittingTaskId(taskId);
              try {
                  await crud.createLeave({ 
                      ...taskData, 
                      requesterId: user.docId || user.uid, 
                      requesterName: user.name, 
                      status: 'pending', 
                      timestamp: new Date() 
                  });
                  alert("差單已送出，已顯示在日曆上！");
              } catch (e) { alert("送出失敗"); } 
              finally { setSubmittingTaskId(null); }
          }

          const handleManualSubmit = async (e) => {
              e.preventDefault();
              setIsSubmitting(true);
              try {
                  await crud.createLeave({ 
                      ...form, 
                      requesterId: user.docId || user.uid, 
                      requesterName: user.name, 
                      hours, 
                      status: 'pending', 
                      timestamp: new Date() 
                  });
                  alert("請假單已送出，已同步顯示在日曆上！");
                  setForm({ type: '休假', start:'', end:'', reason:'', deputyId:'' });
              } catch (e) { alert("送出失敗，請稍後再試。"); } 
              finally { setIsSubmitting(false); }
          };

          const busyIds = leaves.filter(l=>l.status!=='rejected' && l.start.startsWith(form.start?.split('T')[0])).map(l=>l.requesterName);
          const deputies = users.filter(u=>u.name!==user.name && !busyIds.includes(u.name));

          return (
            <div className="max-w-3xl mx-auto space-y-8">
               {pendingExternalTasks.length > 0 && (
                   <div className="bg-indigo-50 border-2 border-indigo-200 rounded-xl p-6 shadow-md">
                       <h3 className="font-black text-indigo-800 mb-4 flex items-center gap-2 text-lg">
                           <AlertCircle size={22}/> 第一區塊：請補送差勤 (您有排定的外勤任務尚未填單)
                       </h3>
                       <div className="space-y-4">
                           {pendingExternalTasks.map(task => (
                               <PendingLeaveCard key={task.id} task={task} leaveTypes={leaveTypes} deputies={users.filter(u=>u.name!==user.name)} onSubmit={(data) => handleTaskSubmit(data, task.id)} isSubmitting={submittingTaskId === task.id}/>
                           ))}
                       </div>
                   </div>
               )}

               <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                   <div className="flex justify-between items-center mb-6 border-b pb-4">
                       <h2 className="text-xl font-bold flex items-center gap-2 text-gray-800"><CalendarPlus/> 第二區塊：自行請假 (特休/病假/事假)</h2>
                   </div>
                   <form onSubmit={handleManualSubmit} className="space-y-5">
                       <div><label className="text-sm font-bold text-gray-700 block mb-1">選擇假別</label><select className="w-full border p-2.5 rounded-lg bg-gray-50 focus:bg-white focus:ring-2 focus:ring-blue-500 outline-none transition" value={form.type} onChange={e=>setForm({...form, type:e.target.value})}>{leaveTypes.map(t=><option key={t} value={t}>{t}</option>)}</select></div>
                       <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                           <div><label className="text-sm font-bold text-gray-700 block mb-1">開始時間</label><input type="datetime-local" required className="w-full border p-2.5 rounded-lg bg-gray-50 focus:bg-white focus:ring-2 outline-none transition" value={form.start} onChange={e=>setForm({...form, start:e.target.value})}/></div>
                           <div><label className="text-sm font-bold text-gray-700 block mb-1">結束時間</label><input type="datetime-local" required className="w-full border p-2.5 rounded-lg bg-gray-50 focus:bg-white focus:ring-2 outline-none transition" value={form.end} onChange={e=>setForm({...form, end:e.target.value})}/></div>
                       </div>
                       <div className="text-right text-sm text-blue-600 font-bold bg-blue-50 p-2 rounded inline-block float-right">總計時數: {hours} 小時</div>
                       <div className="clear-both"></div>
                       <div><label className="text-sm font-bold text-gray-700 block mb-1">職務代理人</label><select className="w-full border p-2.5 rounded-lg bg-gray-50 focus:bg-white focus:ring-2 outline-none transition" required value={form.deputyId} onChange={e=>setForm({...form, deputyId:e.target.value})}><option value="">請選擇</option>{deputies.map(u=><option key={u.docId} value={u.docId}>{u.name}</option>)}</select></div>
                       <div><label className="text-sm font-bold text-gray-700 block mb-1">事由</label><textarea className="w-full border p-2.5 rounded-lg h-24 bg-gray-50 focus:bg-white focus:ring-2 outline-none transition resize-none" required placeholder="請簡述請假原因..." value={form.reason} onChange={e=>setForm({...form, reason:e.target.value})}/></div>
                       <button disabled={isSubmitting} className={`w-full bg-slate-800 text-white py-3.5 rounded-lg font-bold transition shadow-md flex justify-center items-center gap-2 ${isSubmitting ? 'opacity-50 cursor-not-allowed' : 'hover:bg-slate-900 hover:shadow-lg'}`}>{isSubmitting ? <><Loader2 className="animate-spin" size={20}/> 假單傳送中...</> : '確認送出假單'}</button>
                   </form>
               </div>
            </div>
          );
        }

        // --- 審核模組 ---
        function ApprovalView({ leaves, currentUser, crud, users }) {
          const [processingId, setProcessingId] = useState(null);

          const pendingMyDeputy = leaves.filter(l => (l.deputyId === currentUser.uid || l.deputyId === (currentUser.email || '').toLowerCase() || l.deputyId === currentUser.docId) && l.status === 'pending');
          const pendingLeader = (currentUser.role === 'leader' || currentUser.role === 'admin') ? leaves.filter(l => l.status === 'deputy_signed') : [];

          const handleDeputyAgree = async (leave) => {
              if (processingId) return; setProcessingId(leave.id);
              try { await crud.updateLeave(leave.id, { status: 'deputy_signed' }); } 
              catch(e) { alert("操作失敗"); } finally { setProcessingId(null); }
          };
          const handleLeaderApprove = async (leave) => {
              if (processingId) return; setProcessingId(leave.id);
              try { await crud.updateLeave(leave.id, { status: 'approved', approverId: currentUser.uid }); } 
              catch(e) { alert("操作失敗"); } finally { setProcessingId(null); }
          };
          const handleReject = async (leave) => {
              if (processingId) return; setProcessingId(leave.id);
              try { await crud.updateLeave(leave.id, { status: 'rejected', approverId: currentUser.uid }); } 
              catch(e) { alert("操作失敗"); } finally { setProcessingId(null); }
          }

          const StatusStep = ({ status }) => {
              const step1 = status !== 'pending' ? 'text-green-600 font-bold' : 'text-gray-400';
              const step2 = status === 'approved' ? 'text-green-600 font-bold' : (status === 'deputy_signed' ? 'text-blue-600 animate-pulse font-bold' : 'text-gray-400');
              return (
                  <div className="flex items-center text-xs gap-1 bg-gray-100 px-2 py-1 rounded-full">
                      <span className={`flex items-center ${step1}`}>1. 職代 {status !== 'pending' ? '✅' : '⏳'}</span><span className="text-gray-300">→</span><span className={`flex items-center ${step2}`}>2. 主管 {status === 'approved' ? '✅' : '⏳'}</span>
                  </div>
              );
          }

          return (
            <div className="max-w-4xl mx-auto space-y-8">
               <div className="flex justify-between items-center"><h2 className="text-xl font-bold flex items-center gap-2"><CheckCircle/> 差單審核</h2></div>
               <div className="bg-white rounded shadow overflow-hidden border-t-4 border-blue-500">
                   <div className="bg-blue-50 px-4 py-3 border-b border-blue-100 font-bold text-blue-800 flex items-center gap-2"><User size={18}/> 第一關：待我簽核 (我是職代)</div>
                   {pendingMyDeputy.length===0 ? <div className="p-8 text-center text-gray-400 text-sm">無待辦事項，您目前沒有需要代理的案件。</div> : <table className="w-full text-sm text-left"><thead className="bg-gray-50 border-b text-gray-500"><tr><th className="p-3">申請人</th><th className="p-3">項目</th><th className="p-3">進度狀態</th><th className="p-3">操作</th></tr></thead><tbody>{pendingMyDeputy.map(l => (
                       <tr key={l.id} className="border-b last:border-0 hover:bg-gray-50">
                           <td className="p-3 font-bold text-gray-700">{l.requesterName}</td>
                           <td className="p-3"><span className="font-bold text-blue-600">{l.type}</span><div className="text-xs text-gray-500 mt-1">{l.start.replace('T',' ')} <br/>~ {l.end.replace('T',' ')}</div></td>
                           <td className="p-3"><StatusStep status={l.status}/></td>
                           <td className="p-3 flex gap-2">
                               <button onClick={()=>handleDeputyAgree(l)} disabled={processingId === l.id} className={`text-white font-bold text-xs bg-blue-500 px-3 py-1.5 rounded shadow-sm flex items-center gap-1 ${processingId === l.id ? 'opacity-50 cursor-not-allowed' : 'hover:bg-blue-600'}`}>{processingId === l.id ? <Loader2 className="animate-spin" size={12}/> : <CheckCircle size={12}/>} 簽核同意</button>
                               <button onClick={()=>handleReject(l)} disabled={processingId === l.id} className={`text-red-600 font-bold text-xs bg-red-50 px-3 py-1.5 rounded ${processingId === l.id ? 'opacity-50 cursor-not-allowed' : 'hover:bg-red-100'}`}>{processingId === l.id ? '...' : '退回'}</button>
                           </td>
                       </tr>
                   ))}</tbody></table>}
               </div>

               {(currentUser.role === 'leader' || currentUser.role === 'admin') && 
               <div className="bg-white rounded shadow overflow-hidden border-t-4 border-orange-500">
                   <div className="bg-orange-50 px-4 py-3 border-b border-orange-100 font-bold text-orange-800 flex items-center gap-2"><CheckCircle size={18}/> 第二關：待最終核准 (組長權限)</div>
                   {pendingLeader.length===0 ? <div className="p-8 text-center text-gray-400 text-sm">無待審核項目</div> : <table className="w-full text-sm text-left"><thead className="bg-gray-50 border-b text-gray-500"><tr><th className="p-3">申請人</th><th className="p-3">項目</th><th className="p-3">進度狀態</th><th className="p-3">操作</th></tr></thead><tbody>{pendingLeader.map(l => (
                       <tr key={l.id} className="border-b last:border-0 hover:bg-gray-50">
                           <td className="p-3 font-bold text-gray-700">{l.requesterName}</td>
                           <td className="p-3"><span className="font-bold text-gray-800">{l.type}</span><div className="text-xs text-gray-500 mt-1">{l.start.replace('T',' ')} <br/>~ {l.end.replace('T',' ')}</div></td>
                           <td className="p-3"><StatusStep status={l.status}/></td>
                           <td className="p-3 flex gap-2">
                               <button onClick={()=>handleLeaderApprove(l)} disabled={processingId === l.id} className={`text-white font-bold text-xs bg-green-600 px-3 py-1.5 rounded shadow-sm flex items-center gap-1 ${processingId === l.id ? 'opacity-50 cursor-not-allowed' : 'hover:bg-green-700'}`}>{processingId === l.id ? <Loader2 className="animate-spin" size={12}/> : <CheckCircle size={12}/>} 最終核准</button>
                               <button onClick={()=>handleReject(l)} disabled={processingId === l.id} className={`text-red-600 font-bold text-xs bg-red-50 px-3 py-1.5 rounded ${processingId === l.id ? 'opacity-50 cursor-not-allowed' : 'hover:bg-red-100'}`}>{processingId === l.id ? '...' : '駁回'}</button>
                           </td>
                       </tr>
                   ))}</tbody></table>}
               </div>}
            </div>
          );
        }

        // --- 系統設定相關模組 ---
        function SettingsView({ settings, globalSettings, user, leaveTypes, tags, handleManageLeaveTypes, onSave, crud, roleNames, onUpdateRoleNames }) {
            const [areaC, setAreaC] = useState(settings.areaColors || DEFAULT_AREA_COLORS);
            const [newLeave, setNewLeave] = useState('');
            const [newArea, setNewArea] = useState(''); 
            const [localRoleNames, setLocalRoleNames] = useState(roleNames);
            const [isSettingsSaved, setIsSettingsSaved] = useState(false); 
            
            // 🌟 處理全域自訂假日的狀態
            const [calendarOverrides, setCalendarOverrides] = useState(globalSettings.calendarOverrides || {});
            const [newOverrideDate, setNewOverrideDate] = useState('');
            const [newOverrideType, setNewOverrideType] = useState('holiday');
            const [newOverrideName, setNewOverrideName] = useState('');

            const colors = [{l:'紅',c:"bg-red-100 text-red-800"},{l:'橘',c:"bg-orange-100 text-orange-800"},{l:'黃',c:"bg-yellow-100 text-yellow-800"},{l:'綠',c:"bg-green-100 text-green-800"},{l:'藍',c:"bg-blue-100 text-blue-800"},{l:'紫',c:"bg-purple-100 text-purple-800"},{l:'粉',c:"bg-pink-100 text-pink-800"},{l:'灰',c:"bg-gray-100 text-gray-800"}];

            const handleColorChange = (area, colorClass) => {
                const existingArea = Object.keys(areaC).find(key => areaC[key] === colorClass && key !== area);
                if (existingArea) { alert(`此顏色已被 [${existingArea}] 使用，請選擇其他顏色以免混淆。`); return; }
                setAreaC({...areaC, [area]: colorClass});
            };
            const handleAddAreaWithColor = (area) => { tags.handleAddTag('area', area); setNewArea(''); }

            // 新增自訂假日
            const handleAddOverride = () => {
                if (!newOverrideDate || !newOverrideName) { alert("日期與原因必填"); return; }
                setCalendarOverrides(prev => ({
                    ...prev,
                    [newOverrideDate]: { type: newOverrideType, name: newOverrideName }
                }));
                setNewOverrideDate(''); setNewOverrideName('');
            };
            // 刪除自訂假日
            const handleDeleteOverride = (dateKey) => {
                const updated = { ...calendarOverrides };
                delete updated[dateKey];
                setCalendarOverrides(updated);
            };

            const handleSaveSettings = async () => {
                onUpdateRoleNames(localRoleNames); 
                onSave({...settings, areaColors: areaC});
                // 儲存全域設定到 Firestore
                try {
                    await crud.saveGlobalSettings({ calendarOverrides });
                    setIsSettingsSaved(true); 
                    setTimeout(() => setIsSettingsSaved(false), 2000);
                } catch(e) { alert("設定儲存失敗"); }
            };

            return (
                <div className="max-w-3xl mx-auto space-y-8">
                    {/* 🌟 新增：行事曆特殊日設定區塊 */}
                    <div className="bg-white p-6 rounded shadow-sm border-t-4 border-red-500">
                        <h2 className="text-xl font-bold mb-4 flex items-center gap-2"><Flag className="text-red-500"/> 📅 行事曆特殊日設定 (例假日/補班補休)</h2>
                        <p className="text-sm text-gray-500 mb-4">在此設定的特殊日子，會即時同步到全公司的排班日曆與簽到表。若某天原本是補班日但單位放假，您可以設定為「自訂放假日」。</p>
                        
                        <div className="flex gap-2 mb-6 items-end">
                            <div className="flex-1">
                                <label className="block text-xs font-bold text-gray-600 mb-1">日期</label>
                                <input type="date" className="border rounded px-3 py-2 text-sm w-full" value={newOverrideDate} onChange={e=>setNewOverrideDate(e.target.value)} />
                            </div>
                            <div className="w-32 shrink-0">
                                <label className="block text-xs font-bold text-gray-600 mb-1">類型</label>
                                <select className="border rounded px-3 py-2 text-sm w-full bg-white" value={newOverrideType} onChange={e=>setNewOverrideType(e.target.value)}>
                                    <option value="holiday">放假 (紅字)</option>
                                    <option value="workday">補班/上班</option>
                                </select>
                            </div>
                            <div className="flex-1">
                                <label className="block text-xs font-bold text-gray-600 mb-1">原因 / 說明</label>
                                <input className="border rounded px-3 py-2 text-sm w-full" placeholder="例如: 補假、端午補休" value={newOverrideName} onChange={e=>setNewOverrideName(e.target.value)} />
                            </div>
                            <button onClick={handleAddOverride} className="bg-red-500 text-white px-4 py-2 rounded text-sm font-bold hover:bg-red-600">新增</button>
                        </div>

                        <div className="space-y-2">
                            {Object.entries(calendarOverrides).sort((a,b)=>a[0].localeCompare(b[0])).map(([dateKey, info]) => (
                                <div key={dateKey} className="flex justify-between items-center bg-gray-50 p-3 rounded border">
                                    <div className="flex items-center gap-3">
                                        <span className="font-bold text-gray-700">{dateKey}</span>
                                        <span className={`text-xs px-2 py-1 rounded font-bold ${info.type==='holiday' ? 'bg-red-100 text-red-600' : 'bg-blue-100 text-blue-600'}`}>
                                            {info.type === 'holiday' ? '放假日' : '上班日'}
                                        </span>
                                        <span className="text-sm text-gray-600">{info.name}</span>
                                    </div>
                                    <button onClick={()=>handleDeleteOverride(dateKey)} className="text-gray-400 hover:text-red-500"><X size={16}/></button>
                                </div>
                            ))}
                            {Object.keys(calendarOverrides).length === 0 && <div className="text-center text-sm text-gray-400 p-4">目前沒有任何自訂的特殊假日</div>}
                        </div>
                    </div>

                    <div className="bg-white p-6 rounded shadow-sm">
                        <h2 className="text-xl font-bold mb-4 flex items-center gap-2"><Shield/> 職稱顯示設定</h2>
                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                            <div><label className="block text-xs font-bold text-gray-500 mb-1">職員 顯示名稱</label><input className="border rounded p-2 w-full text-sm" value={localRoleNames.staff} onChange={e=>setLocalRoleNames({...localRoleNames, staff: e.target.value})} /></div>
                            <div><label className="block text-xs font-bold text-gray-500 mb-1">主管 顯示名稱</label><input className="border rounded p-2 w-full text-sm" value={localRoleNames.leader} onChange={e=>setLocalRoleNames({...localRoleNames, leader: e.target.value})} /></div>
                            <div><label className="block text-xs font-bold text-gray-500 mb-1">管理員 顯示名稱</label><input className="border rounded p-2 w-full text-sm" value={localRoleNames.admin} onChange={e=>setLocalRoleNames({...localRoleNames, admin: e.target.value})} /></div>
                        </div>
                    </div>

                    <div className="bg-white p-6 rounded shadow-sm"><h2 className="text-xl font-bold mb-4 flex items-center gap-2"><Palette/> 轄區設定 (新增/顏色)</h2><div className="flex gap-2 mb-6"><input className="border rounded px-3 py-2 text-sm flex-1" placeholder="輸入新轄區..." value={newArea} onChange={e=>setNewArea(e.target.value)} /><button onClick={()=>handleAddAreaWithColor(newArea)} className="bg-green-600 text-white px-4 py-2 rounded text-sm font-bold">新增轄區</button></div><div className="grid grid-cols-2 md:grid-cols-3 gap-4">{tags.areaTags.map(area => (<div key={area} className="relative group"><button className={`w-full text-left px-3 py-2 rounded border flex justify-between items-center ${areaC[area] || "bg-gray-100 text-gray-800"}`}><span className="font-bold">{area}</span><div className="w-4 h-4 rounded-full border border-black/20 bg-current opacity-50"></div></button><div className="absolute top-full left-0 z-10 bg-white shadow-lg border p-2 rounded hidden group-hover:flex gap-1 flex-wrap w-48">{colors.map(co => (<div key={co.c} onClick={()=>handleColorChange(area, co.c)} className={`w-6 h-6 rounded cursor-pointer border ${co.c.split(' ')[0]}`} title={co.l}></div>))}</div></div>))}</div></div>
                    <div className="bg-white p-6 rounded shadow-sm"><h2 className="text-xl font-bold mb-4 flex items-center gap-2"><List/> 假別設定 & 屬性</h2><div className="flex gap-2 mb-4"><input className="border rounded px-3 py-2 text-sm flex-1" placeholder="輸入新假別..." value={newLeave} onChange={e=>setNewLeave(e.target.value)} /><button onClick={()=>{handleManageLeaveTypes('add', newLeave); setNewLeave('')}} className="bg-blue-600 text-white px-4 py-2 rounded text-sm font-bold">新增</button></div><div className="flex flex-wrap gap-3">{leaveTypes.map(t => (<div key={t} className="flex items-center gap-2 bg-gray-50 border px-3 py-2 rounded-lg text-sm"><span className="font-bold text-gray-700">{t}</span><button onClick={()=>handleManageLeaveTypes('delete', t)} className="text-gray-400 hover:text-red-500 ml-1"><X size={14}/></button></div>))}</div>
                    <button onClick={handleSaveSettings} className={`mt-6 px-6 py-3 rounded shadow transition font-bold flex items-center justify-center gap-2 w-full ${isSettingsSaved ? 'bg-green-600 hover:bg-green-700 text-white' : 'bg-slate-800 hover:bg-slate-900 text-white'}`}>{isSettingsSaved ? <><CheckCircle size={18}/> 設定已儲存！</> : '儲存系統設定 (包含特殊節日)'}</button>
                    </div>
                </div>
            );
        }

        // 成員管理與個人設定模組 (略去重複修改，維持先前的姓氏與名字分離)
        function MembersView({ db, users, currentUser, roleNames }) {
            const isAdmin = currentUser && currentUser.role === 'admin';
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [editUser, setEditUser] = useState(null);
            
            const handleImportPredefined = async () => {
                if(!confirm("要將系統內建的預設名單直接匯入資料庫嗎？")) return;
                try {
                    for(const p of PREDEFINED_USERS) {
                        const docId = p.email.toLowerCase();
                        const exists = users.find(u => u.docId === docId);
                        if (!exists) {
                            await setDoc(doc(db, 'artifacts', 'kpptjawork', 'public', 'data', 'user_profiles', docId), {
                                uid: docId, email: p.email, name: p.name, role: p.role, initials: p.initials, color: p.color, borderColor: p.borderColor, usePhoto: false, avatarUrl: ''
                            });
                        }
                    }
                    alert("預設名單匯入完成！");
                } catch (e) { alert("匯入失敗: " + e.message); }
            };

            const handleSave = async (userData) => {
                try {
                    const targetDocId = userData.docId || (userData.email ? userData.email.toLowerCase() : userData.name); 
                    const dataToSave = { ...userData };
                    delete dataToSave.docId; 
                    await setDoc(doc(db, 'artifacts', 'kpptjawork', 'public', 'data', 'user_profiles', targetDocId), dataToSave, { merge: true });
                    setIsModalOpen(false); setEditUser(null);
                } catch (e) { alert("儲存失敗: " + e.message); }
            };

            const handleDelete = async (docId) => {
                if(confirm("確定要刪除此成員嗎？")) {
                    try { await deleteDoc(doc(db, 'artifacts', 'kpptjawork', 'public', 'data', 'user_profiles', docId)); } 
                    catch (e) { alert("刪除失敗: " + e.message); }
                }
            };

            return (
                <div className="max-w-5xl mx-auto space-y-6">
                    <div className="flex flex-col md:flex-row justify-between items-center bg-white p-4 rounded shadow-sm gap-4">
                        <h2 className="text-xl font-bold flex items-center gap-2"><Users/> 成員管理</h2>
                        {isAdmin && (
                            <div className="flex gap-2">
                                <button onClick={handleImportPredefined} className="bg-purple-100 text-purple-700 px-4 py-2 rounded text-sm font-bold flex items-center gap-2 hover:bg-purple-200 transition"><Users size={16}/> 一鍵匯入預設名單</button>
                                <button onClick={()=>{setEditUser(null); setIsModalOpen(true);}} className="bg-blue-600 text-white px-4 py-2 rounded text-sm font-bold flex items-center gap-2 hover:bg-blue-700 transition"><Plus size={16}/> 新增成員</button>
                            </div>
                        )}
                    </div>
                    <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                        {users.map(u => (
                            <div key={u.docId} className="bg-white p-4 rounded-lg shadow-sm border border-gray-100 flex items-center gap-3 relative group">
                                <UserAvatar user={u} size="w-12 h-12" textSize="text-base" />
                                <div className="flex-1 overflow-hidden">
                                    <div className="font-bold text-gray-800 text-lg truncate">{u.name}</div>
                                    <div className="text-xs text-gray-400 truncate mb-1">{u.email || '未綁定 Email'}</div>
                                    <div className="flex gap-2 mt-1">
                                        <span className={`text-xs px-2 py-0.5 rounded-full font-medium ${u.role==='admin'?'bg-purple-100 text-purple-800':(u.role==='leader'?'bg-blue-100 text-blue-800':'bg-gray-100 text-gray-600')}`}>{roleNames[u.role] || u.role}</span>
                                    </div>
                                </div>
                                {isAdmin && (
                                    <div className="absolute top-2 right-2 hidden group-hover:flex gap-1">
                                        <button onClick={()=>{setEditUser(u); setIsModalOpen(true);}} className="p-1.5 bg-gray-100 rounded text-gray-500 hover:bg-blue-100 hover:text-blue-600"><Edit size={14}/></button>
                                        <button onClick={()=>handleDelete(u.docId)} className="p-1.5 bg-gray-100 rounded text-gray-500 hover:bg-red-100 hover:text-red-600"><Trash2 size={14}/></button>
                                    </div>
                                )}
                            </div>
                        ))}
                    </div>
                    {isModalOpen && <MemberEditModal user={editUser} onClose={()=>{setIsModalOpen(false); setEditUser(null);}} onSave={handleSave} roleNames={roleNames}/>}
                </div>
            ); 
        }

        function MemberEditModal({ user, onClose, onSave, roleNames }) {
            const [form, setForm] = useState(user || {
                lastName: '', name: '', email: '', role: 'staff', initials: '', color: 'bg-gray-200', borderColor: '#e5e7eb', usePhoto: false, avatarUrl: ''
            });

            return (
                <div className="fixed inset-0 bg-black/60 z-[70] flex items-center justify-center p-4 animate-in fade-in" onClick={onClose}>
                    <div className="bg-white rounded-xl w-full max-w-md shadow-2xl p-6" onClick={e=>e.stopPropagation()}>
                        <h3 className="font-bold text-lg mb-4 text-gray-800">{user ? '編輯成員' : '新增成員'}</h3>
                        <div className="space-y-4">
                            <div className="grid grid-cols-2 gap-4">
                                <div><label className="block text-xs font-bold text-gray-500 mb-1">姓氏 (留存)</label><input className="w-full border p-2 rounded" value={form.lastName || ''} onChange={e=>setForm({...form, lastName:e.target.value})} placeholder="例如: 蔡"/></div>
                                <div><label className="block text-xs font-bold text-gray-500 mb-1">名字 (顯示)</label><input className="w-full border p-2 rounded" value={form.name} onChange={e=>setForm({...form, name:e.target.value, initials: e.target.value.slice(0,1)})} placeholder="例如: 凱宇"/></div>
                            </div>
                            <div><label className="block text-xs font-bold text-gray-500 mb-1">Email (登入綁定用)</label><input className="w-full border p-2 rounded" value={form.email} onChange={e=>setForm({...form, email:e.target.value})} placeholder="example@gmail.com"/></div>
                            <div><label className="block text-xs font-bold text-gray-500 mb-1">職稱 (角色權限)</label><select className="w-full border p-2 rounded bg-white" value={form.role} onChange={e=>setForm({...form, role:e.target.value})}><option value="staff">{roleNames['staff']} (一般權限)</option><option value="leader">{roleNames['leader']} (可審核)</option><option value="admin">{roleNames['admin']} (完全控制)</option></select></div>
                            <div className="grid grid-cols-2 gap-4">
                                <div><label className="block text-xs font-bold text-gray-500 mb-1">顯示單字</label><input className="w-full border p-2 rounded" value={form.initials} onChange={e=>setForm({...form, initials:e.target.value})} maxLength={1}/></div>
                                <div><label className="block text-xs font-bold text-gray-500 mb-1">預設底色</label><div className="flex gap-1 h-9 items-center">{['bg-red-200','bg-blue-200','bg-green-200','bg-yellow-200','bg-purple-200'].map(c=>(<div key={c} onClick={()=>setForm({...form, color:c})} className={`w-6 h-6 rounded-full cursor-pointer border ${c} ${form.color===c?'ring-2 ring-black':''}`}></div>))}</div></div>
                            </div>
                            <div className="pt-2 flex gap-3">
                                <button onClick={onClose} className="flex-1 py-2 text-gray-500 hover:bg-gray-100 rounded">取消</button><button onClick={()=>onSave(form)} className="flex-1 py-2 bg-blue-600 text-white font-bold rounded hover:bg-blue-700">儲存</button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function ManagementView({ tags }) {
            const [newWork, setNewWork] = useState('');
            const [newArea, setNewArea] = useState('');
            return (
                <div className="max-w-4xl mx-auto space-y-6">
                    <h2 className="text-xl font-bold flex items-center gap-2"><List/> 項目管理</h2>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div className="bg-white p-6 rounded-lg shadow-sm border"><h3 className="font-bold text-lg mb-4 text-blue-700">工作項目</h3><div className="flex gap-2 mb-4"><input className="border rounded px-3 py-2 text-sm flex-1" placeholder="新增..." value={newWork} onChange={e=>setNewWork(e.target.value)} /><button onClick={()=>{tags.handleAddTag('work', newWork); setNewWork('')}} className="bg-blue-600 text-white px-4 py-2 rounded text-sm">新增</button></div><div className="flex flex-wrap gap-2">{tags.workTags.map(tag => (<div key={tag} className="bg-blue-50 text-blue-800 px-3 py-1.5 rounded-full text-sm border flex items-center gap-1">{tag}<button onClick={()=>tags.handleDeleteTag('work', tag)} className="text-blue-400 hover:text-red-500"><X size={14}/></button></div>))}</div></div>
                        <div className="bg-white p-6 rounded-lg shadow-sm border"><h3 className="font-bold text-lg mb-4 text-green-700">轄區</h3><div className="flex gap-2 mb-4"><input className="border rounded px-3 py-2 text-sm flex-1" placeholder="新增..." value={newArea} onChange={e=>setNewArea(e.target.value)} /><button onClick={()=>{tags.handleAddTag('area', newArea); setNewArea('')}} className="bg-green-600 text-white px-4 py-2 rounded text-sm">新增</button></div><div className="flex flex-wrap gap-2">{tags.areaTags.map(tag => (<div key={tag} className="bg-green-50 text-green-800 px-3 py-1.5 rounded-full text-sm border flex items-center gap-1">{tag}<button onClick={()=>tags.handleDeleteTag('area', tag)} className="text-green-400 hover:text-red-500"><X size={14}/></button></div>))}</div></div>
                    </div>
                </div>
            );
        }

        function ProfileView({ user, onSave, roleNames }) {
            const [p, setP] = useState({ 
                lastName: user.lastName || '', name: user.name || '', initials: user.initials || '', color: user.color || 'bg-gray-200', 
                email: user.email || '', password: '', borderColor: user.borderColor || '#e5e7eb', usePhoto: user.usePhoto || false, avatarUrl: user.avatarUrl || ''
            });
            const [isSubmitting, setIsSubmitting] = useState(false);

            const handleImageUpload = (e) => {
                const file = e.target.files[0];
                if (file) { const reader = new FileReader(); reader.onloadend = () => { setP({ ...p, avatarUrl: reader.result }); }; reader.readAsDataURL(file); }
            };

            const handleSubmit = async () => { setIsSubmitting(true); await onSave(p); setIsSubmitting(false); };

            return (
                <div className="max-w-xl mx-auto bg-white p-8 rounded-lg shadow-sm">
                    <h2 className="text-xl font-bold mb-6 flex items-center gap-2"><User/> 個人設定</h2>
                    <div className="space-y-6">
                        <div className="flex flex-col items-center gap-4 bg-gray-50 p-4 rounded-lg border border-gray-100">
                            <label className="text-sm font-bold text-gray-700">頭像預覽</label>
                            <UserAvatar user={{ ...user, ...p }} size="w-20 h-20" textSize="text-2xl" />
                            <div className="flex items-center gap-4 w-full justify-center">
                                <label className="flex items-center gap-2 cursor-pointer bg-white px-4 py-2 rounded border shadow-sm hover:bg-gray-50"><Camera size={16} /><span className="text-sm">上傳照片</span><input type="file" accept="image/*" className="hidden" onChange={handleImageUpload} /></label>
                                <label className="flex items-center gap-2 cursor-pointer select-none"><input type="checkbox" className="w-4 h-4 text-blue-600 rounded focus:ring-blue-500" checked={p.usePhoto} onChange={e=>setP({...p, usePhoto:e.target.checked})} /><span className="text-sm font-medium text-gray-700">使用照片</span></label>
                            </div>
                        </div>
                        <div className="grid grid-cols-2 gap-4">
                            <div><label className="block text-sm font-bold text-gray-600 mb-1">姓氏 (個人資料留存用)</label><input className="border p-2 rounded w-full h-9 bg-gray-50 focus:bg-white transition" value={p.lastName} onChange={e=>setP({...p, lastName:e.target.value})} placeholder="例如：蔡" /></div>
                            <div><label className="block text-sm font-bold text-gray-600 mb-1">名字 (系統顯示用)</label><input className="border p-2 rounded w-full h-9 bg-gray-50 focus:bg-white transition" value={p.name} onChange={e=>setP({...p, name:e.target.value})} placeholder="例如：凱宇" /></div>
                        </div>
                        <div className="grid grid-cols-2 gap-4">
                            <div><label className="block text-sm font-bold text-gray-600 mb-1">外框顏色</label><div className="flex gap-2 items-center"><input type="color" className="h-9 w-full rounded border cursor-pointer" value={p.borderColor} onChange={e=>setP({...p, borderColor:e.target.value})} /></div></div>
                            <div><label className="block text-sm font-bold text-gray-600 mb-1">顯示單字</label><input className="border p-2 rounded w-full h-9" maxLength={1} value={p.initials} onChange={e=>setP({...p, initials:e.target.value})} /></div>
                        </div>
                        <div>
                            <label className="block text-sm font-bold text-gray-600 mb-1">Email (登入綁定用)</label>
                            <input className="border p-2 rounded w-full bg-gray-100" type="email" disabled value={p.email} /><p className="text-xs text-gray-400 mt-1">Email 為 Google 帳號綁定，無法在此修改。</p>
                        </div>
                        <div>
                            <label className="block text-sm font-bold text-gray-600 mb-1">頭像背景色 (未用照片時)</label>
                            <div className="flex gap-2 flex-wrap">{['bg-red-200', 'bg-orange-200', 'bg-yellow-200', 'bg-green-200', 'bg-blue-200', 'bg-indigo-200', 'bg-purple-200', 'bg-pink-200', 'bg-gray-200'].map(c => (<div key={c} onClick={()=>setP({...p, color:c})} className={`w-8 h-8 rounded-full cursor-pointer border-2 ${c} ${p.color===c?'border-black':'border-transparent'}`}></div>))}</div>
                        </div>
                        <div className="pt-4"><button onClick={handleSubmit} disabled={isSubmitting} className={`w-full bg-blue-600 text-white py-2 rounded font-bold transition flex items-center justify-center gap-2 ${isSubmitting ? 'opacity-50 cursor-not-allowed' : 'hover:bg-blue-700'}`}>{isSubmitting ? <><Loader2 className="animate-spin" size={18} /> 更新中...</> : '更新個人資料'}</button></div>
                    </div>
                </div>
            );
        }

        // 極簡版登入畫面
        function LoginScreen({ auth }) {
            const [isLoggingIn, setIsLoggingIn] = useState(false);
            const handleGoogleLogin = async () => {
                if (!auth) { alert("Firebase 尚未連線完成，請稍後再試。"); return; }
                setIsLoggingIn(true);
                const provider = new GoogleAuthProvider();
                try { await signInWithPopup(auth, provider); } 
                catch (error) { alert("登入失敗或已取消，請重試。"); setIsLoggingIn(false); }
            };

            return (
                <div className="min-h-screen bg-slate-100 flex items-center justify-center p-4">
                    <div className="bg-white w-full max-w-sm p-8 rounded-xl shadow-lg text-center">
                        <div className="w-16 h-16 bg-blue-600 rounded-xl mx-auto mb-4 flex items-center justify-center text-white"><Calendar size={32}/></div>
                        <h1 className="text-2xl font-bold text-gray-800 mb-1">差勤排班系統</h1>
                        <p className="text-gray-400 text-sm mb-8">高屏澎東職務再設計專案單位</p>
                        <div className="space-y-4">
                            <button onClick={handleGoogleLogin} disabled={isLoggingIn} className="w-full py-3.5 rounded-lg font-bold bg-white border-2 border-gray-200 text-gray-700 transition-all flex items-center justify-center gap-3 hover:bg-gray-50 shadow-sm disabled:opacity-50">
                                {isLoggingIn ? <Loader2 className="animate-spin text-blue-600" size={20}/> : <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" className="w-5 h-5"/>}
                                <span>{isLoggingIn ? '正在驗證帳號...' : '使用 Google 帳號登入'}</span>
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
