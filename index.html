                        <div className="flex flex-wrap gap-4 w-full md:w-auto"><input type="month" className="border p-2 rounded text-sm flex-1 md:flex-none" value={month} onChange={e=>setMonth(e.target.value)} /><select value={leaveFilter} onChange={e => setLeaveFilter(e.target.value)} className="border p-2 rounded text-sm bg-white flex-1 md:flex-none"><option value="all">所有假別/出勤</option><optgroup label="公務與加班">{leaveTypes.filter(t=>t.category==='official').map(t => <option key={t.id} value={t.name}>{t.name}</option>)}</optgroup><optgroup label="私假">{leaveTypes.filter(t=>t.category==='personal').map(t => <option key={t.id} value={t.name}>{t.name}</option>)}</optgroup></select><div className="flex gap-2 w-full md:w-auto"><button onClick={downloadBatchICS} className="bg-indigo-600 text-white px-4 py-2 rounded flex items-center gap-2 text-sm flex-1 justify-center hover:bg-indigo-700 transition"><CalendarPlus size={16}/> 批次加行事曆 (.ics)</button><button onClick={exportCSV} className="bg-green-600 text-white px-4 py-2 rounded flex items-center gap-2 text-sm flex-1 justify-center hover:bg-green-700 transition"><FileSpreadsheet size={16}/> 匯出 Excel</button></div></div>
                    </div>
                    <div className="bg-white rounded shadow overflow-hidden"><table className="w-full text-sm text-left"><thead className="bg-gray-50 border-b font-bold text-gray-600"><tr><th className="p-3 w-10 text-center"><input type="checkbox" checked={isAllSelected} onChange={toggleAll} className="w-4 h-4 rounded text-indigo-600 focus:ring-indigo-500 cursor-pointer" /></th><th className="p-3 w-16">姓名</th><th className="p-3 w-28">日期</th><th className="p-3 w-14">時間</th><th className="p-3 w-20">假別</th><th className="p-3 w-14">時數</th><th className="p-3 w-20">職代</th><th className="p-3">排班內容</th><th className="p-3 w-28">事由</th><th className="p-3 w-28">備註</th><th className="p-3 w-28">狀態</th><th className="p-3 w-16 text-center">操作</th></tr></thead><tbody>{filteredRows.map((r) => { const canRecall = r.rawLeave && (r.rawLeave.status === 'pending' || r.rawLeave.status === 'rejected'); const deputyName = r.rawLeave?.deputyId ? (users.find(u => u.docId === r.rawLeave.deputyId || u.uid === r.rawLeave.deputyId)?.name || '未知') : '-'; return (<tr key={r.id} className={`border-b last:border-0 hover:bg-gray-50 transition ${selectedIds.includes(r.id) ? 'bg-indigo-50/50' : ''}`}><td className="p-3 text-center"><input type="checkbox" checked={selectedIds.includes(r.id)} onChange={() => toggleOne(r.id)} className="w-4 h-4 rounded text-indigo-600 focus:ring-indigo-500 cursor-pointer" /></td><td className="p-3 font-medium">{r.name}</td><td className="p-3 text-xs">{r.date}</td><td className="p-3 text-xs">{TIME_SLOTS.find(s=>s.id===r.slot)?.label||'整天'}</td><td className="p-3">{r.leaveType !== '-' ? <span className="bg-gray-100 text-gray-700 px-2 py-0.5 rounded text-xs">{r.leaveType}</span> : '-'}</td><td className="p-3 text-xs">{r.leaveHours}</td><td className="p-3 text-xs text-blue-700">{deputyName}</td><td className="p-3 text-xs">{r.content ? (<span className="font-bold text-gray-700">{r.content} {r.area && `(${r.area})`}</span>) : <span className="text-gray-400">-</span>}</td><td className="p-3 text-xs text-gray-500">{r.reason}</td><td className="p-3 text-xs text-gray-500">{r.note}</td><td className="p-3"><span className={`px-2 py-1 rounded text-xs font-bold leading-tight inline-block ${r.status === '缺公務單' ? 'bg-red-100 text-red-600' : r.status === '異常公出' || ['假別不符', '已駁回'].includes(r.status) ? 'bg-orange-100 text-orange-600' : ['待職代審查中', '組長審查中'].includes(r.status) ? 'bg-blue-100 text-blue-600' : 'bg-green-100 text-green-600'}`}>{r.status === '異常公出' ? '異常公出 (請確認排班日曆是否已換人員)' : r.status}</span></td><td className="p-3 text-center">{canRecall && (<button onClick={() => handleRecallLeave(r.rawLeave.id)} className="text-red-500 hover:text-red-700 bg-red-50 hover:bg-red-100 px-2 py-1 rounded text-xs font-bold transition flex items-center gap-1 mx-auto" title="撤回未核准的單據"><Undo size={12}/> 撤回</button>)}</td></tr>) })}{filteredRows.length === 0 && <tr><td colSpan="12" className="p-8 text-center text-gray-400">尚無符合條件的出勤資料</td></tr>}</tbody></table></div>
                </div>
            );
        }

        const PendingLeaveCard = ({ task, leaveTypes, deputies, onSubmit, isSubmitting }) => {
            const officialTypes = leaveTypes.filter(t => t.category === 'official');
            const [type, setType] = useState(officialTypes.length > 0 ? officialTypes[0].name : '');
            const [deputyId, setDeputyId] = useState('');
            const selectedTypeDesc = officialTypes.find(t => t.name === type)?.desc || '';
            const handleSend = () => { if(!deputyId) { alert("請選擇職務代理人"); return; } onSubmit({ type, start: task.suggestedStart, end: task.suggestedEnd, reason: task.reason, deputyId, hours: task.slot === 'all_day' ? 8 : 4 }); }
            return (<div className="bg-white p-4 rounded-xl border border-indigo-100 shadow-sm space-y-3"><div className="flex flex-col md:flex-row justify-between md:items-center border-b border-gray-100 pb-3 gap-2"><div><div className="font-bold text-gray-800 flex items-center gap-2"><Calendar size={16} className="text-indigo-500"/>{task.date} <span className="text-indigo-600">{task.item}</span> {task.area && `(${task.area})`}</div><div className="text-xs text-gray-500 mt-1 flex gap-3"><span><span className="font-bold text-gray-600">時段：</span>{task.slot === 'morning' ? '上午' : task.slot === 'afternoon' ? '下午' : '整天'} ({task.suggestedStart.split('T')[1]} ~ {task.suggestedEnd.split('T')[1]})</span><span><span className="font-bold text-gray-600">自動匯入事由：</span>{task.reason}</span></div></div></div><div className="grid grid-cols-1 md:grid-cols-2 gap-4"><div><label className="text-xs font-bold text-gray-500 block mb-1">確認假別 (自動篩選公務假別)</label><select className="w-full border border-gray-300 p-2 rounded bg-gray-50 focus:bg-white text-sm" value={type} onChange={e=>setType(e.target.value)}>{officialTypes.map(t=><option key={t.id} value={t.name}>{t.name}</option>)}</select>{selectedTypeDesc && <div className="text-[10px] text-indigo-600 mt-1 pl-1">{selectedTypeDesc}</div>}</div><div><label className="text-xs font-bold text-gray-500 block mb-1">請選擇職務代理人 <span className="text-red-500">*</span></label><select className="w-full border border-indigo-300 p-2 rounded bg-white shadow-inner text-sm focus:ring-2 focus:ring-indigo-200 outline-none" value={deputyId} onChange={e=>setDeputyId(e.target.value)}><option value="">-- 點此選擇職代 --</option>{deputies.map(u=><option key={u.docId} value={u.docId}>{u.name}</option>)}</select></div></div><div className="pt-2 text-right"><button onClick={handleSend} disabled={isSubmitting} className="w-full md:w-auto bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2.5 rounded-lg text-sm font-bold shadow-md transition disabled:opacity-50 flex justify-center items-center gap-2 ml-auto">{isSubmitting ? <><Loader2 className="animate-spin" size={16}/> 傳送中...</> : <><Check size={16}/> 確認送出此差單</>}</button></div></div>)
        }

        function LeaveForm({ user, users, leaves, events, crud, leaveTypes }) {
          const defaultPersonalType = leaveTypes.find(t => t.category === 'personal')?.name || '';
          const [form, setForm] = useState({ type: defaultPersonalType, start:'', end:'', reason:'', deputyId:'' });
          const [hours, setHours] = useState(0);
          const [isSubmitting, setIsSubmitting] = useState(false);
          const [submittingTaskId, setSubmittingTaskId] = useState(null);
          const officialTypes = leaveTypes.filter(t => t.category === 'official');
          const personalTypes = leaveTypes.filter(t => t.category === 'personal');
          const currentTypeDesc = leaveTypes.find(t => t.name === form.type)?.desc || '';
          const pendingExternalTasks = useMemo(() => {
              const today = new Date();
              const tzOffset = today.getTimezoneOffset() * 60000;
              const todayStr = (new Date(today - tzOffset)).toISOString().slice(0, 10);
              const groups = {};
              events.forEach(e => {
                  if (!groups[e.groupId]) groups[e.groupId] = { tag: null, people: [] };
                  if (e.type === 'tag') groups[e.groupId].tag = e;
                  if (e.type === 'person') groups[e.groupId].people.push(e);
              });
              const pending = [];
              Object.values(groups).forEach(g => {
                  if (!g.tag) return;
                  const isExternal = EXTERNAL_WORK_TAGS.includes(g.tag.item); 
                  if (!isExternal) return;
                  const isMe = g.people.some(p => p.userId === user.uid || p.userId === user.docId || p.userName === user.name);
                  if (!isMe) return;
                  const d = g.tag.date; 
                  let startTime = `${d}T08:00`;
                  let endTime = `${d}T17:00`;
                  if (g.tag.slot === 'morning') { endTime = `${d}T12:00`; }
                  else if (g.tag.slot === 'afternoon') { startTime = `${d}T13:00`; }
                  const hasLeave = leaves.some(l => 
                      (l.requesterId === user.uid || l.requesterId === user.docId || l.requesterName === user.name) && 
                      l.start.startsWith(d) && l.status !== 'rejected'
                  );
                  if (!hasLeave) {
                      pending.push({ id: g.tag.groupId, date: d, slot: g.tag.slot, item: g.tag.item, area: g.tag.area, suggestedStart: startTime, suggestedEnd: endTime, reason: `[${g.tag.item}] ${g.tag.area ? g.tag.area : ''} ${g.tag.note ? '- ' + g.tag.note : ''}`.trim() });
                  }
              });
              return pending.sort((a,b) => a.date.localeCompare(b.date));
          }, [events, leaves, user]);
          useEffect(() => {
              if(form.start && form.end) { const diff = (new Date(form.end)-new Date(form.start))/36e5; setHours(Math.max(0, Math.round(diff*2)/2)); }
          }, [form.start, form.end]);
          const handleTaskSubmit = async (taskData, taskId) => { setSubmittingTaskId(taskId); try { await crud.createLeave({ ...taskData, requesterId: user.docId || user.uid, requesterName: user.name, status: 'pending', timestamp: new Date() }); alert("差單已送出，已顯示在日曆上！"); } catch (e) { alert("送出失敗"); } finally { setSubmittingTaskId(null); } }
          const handleManualSubmit = async (e) => {
              e.preventDefault();
              if (form.type === '補休') {
                  let totalOvertime = 0;
                  leaves.forEach(l => { if ((l.requesterId === user.uid || l.requesterId === user.docId) && l.status === 'approved' && l.type === '加班申請(列計)') { totalOvertime += Number(l.hours); } });
                  let usedCompensatory = 0;
                  leaves.forEach(l => { if ((l.requesterId === user.uid || l.requesterId === user.docId) && l.status === 'approved' && l.type === '補休') { usedCompensatory += Number(l.hours); } });
                  const balance = totalOvertime - usedCompensatory;
                  if (hours > balance) { alert(`補休時數不足！\n目前可用餘額: ${balance} 小時\n您申請時數: ${hours} 小時`); return; }
              }
              setIsSubmitting(true);
              try { await crud.createLeave({ ...form, requesterId: user.docId || user.uid, requesterName: user.name, hours, status: 'pending', timestamp: new Date() }); alert("請假單已送出，已同步顯示在日曆上！"); setForm({ type: defaultPersonalType, start:'', end:'', reason:'', deputyId:'' }); } catch (e) { alert("送出失敗，請稍後再試。"); } finally { setIsSubmitting(false); }
          };
          const busyIds = leaves.filter(l=>l.status!=='rejected' && l.start.startsWith(form.start?.split('T')[0])).map(l=>l.requesterName);
          const deputies = users.filter(u=>u.name!==user.name && !busyIds.includes(u.name));
          return (<div className="max-w-3xl mx-auto space-y-8">{pendingExternalTasks.length > 0 && (<div className="bg-indigo-50 border-2 border-indigo-200 rounded-xl p-6 shadow-md"><h3 className="font-black text-indigo-800 mb-4 flex items-center gap-2 text-lg"><AlertCircle size={22}/> 第一區塊：請送差勤 (您有排定的外勤任務)</h3><div className="space-y-4">{pendingExternalTasks.map(task => (<PendingLeaveCard key={task.id} task={task} leaveTypes={leaveTypes} deputies={users.filter(u=>u.name!==user.name)} onSubmit={(data) => handleTaskSubmit(data, task.id)} isSubmitting={submittingTaskId === task.id}/>))}</div></div>)}<div className="bg-white p-6 rounded-xl shadow-sm border border-gray-200"><div className="flex justify-between items-center mb-6 border-b pb-4"><h2 className="text-xl font-bold flex items-center gap-2 text-gray-800"><CalendarPlus/> 第二區塊：私假申請 / 其他假別</h2></div><form onSubmit={handleManualSubmit} className="space-y-5"><div><label className="text-sm font-bold text-gray-700 block mb-1">選擇假別</label><select className="w-full border p-2.5 rounded-lg bg-gray-50 focus:bg-white focus:ring-2 focus:ring-blue-500 outline-none transition" value={form.type} onChange={e=>setForm({...form, type:e.target.value})}><optgroup label="區段二：私假 (依法令給假)">{personalTypes.map(t=><option key={t.id} value={t.name}>{t.name}</option>)}</optgroup><optgroup label="區段一：公務與加班">{officialTypes.map(t=><option key={t.id} value={t.name}>{t.name}</option>)}</optgroup></select>{currentTypeDesc && (<div className="mt-2 text-xs text-blue-700 bg-blue-50 p-2 rounded border border-blue-100 flex items-start gap-2"><Info size={14} className="mt-0.5 shrink-0"/> {currentTypeDesc}</div>)}</div><div className="grid grid-cols-1 md:grid-cols-2 gap-4"><div><label className="text-sm font-bold text-gray-700 block mb-1">開始時間</label><input type="datetime-local" required className="w-full border p-2.5 rounded-lg bg-gray-50 focus:bg-white focus:ring-2 outline-none transition" value={form.start} onChange={e=>setForm({...form, start:e.target.value})}/></div><div><label className="text-sm font-bold text-gray-700 block mb-1">結束時間</label><input type="datetime-local" required className="w-full border p-2.5 rounded-lg bg-gray-50 focus:bg-white focus:ring-2 outline-none transition" value={form.end} onChange={e=>setForm({...form, end:e.target.value})}/></div></div><div className="text-right text-sm text-blue-600 font-bold bg-blue-50 p-2 rounded inline-block float-right">總計時數: {hours} 小時</div><div className="clear-both"></div><div><label className="text-sm font-bold text-gray-700 block mb-1">職務代理人</label><select className="w-full border p-2.5 rounded-lg bg-gray-50 focus:bg-white focus:ring-2 outline-none transition" required value={form.deputyId} onChange={e=>setForm({...form, deputyId:e.target.value})}><option value="">請選擇</option>{deputies.map(u=><option key={u.docId} value={u.docId}>{u.name}</option>)}</select></div><div><label className="text-sm font-bold text-gray-700 block mb-1">事由</label><textarea className="w-full border p-2.5 rounded-lg h-24 bg-gray-50 focus:bg-white focus:ring-2 outline-none transition resize-none" required placeholder="請簡述請假原因..." value={form.reason} onChange={e=>setForm({...form, reason:e.target.value})}/></div><button disabled={isSubmitting} className={`w-full bg-slate-800 text-white py-3.5 rounded-lg font-bold transition shadow-md flex justify-center items-center gap-2 ${isSubmitting ? 'opacity-50 cursor-not-allowed' : 'hover:bg-slate-900 hover:shadow-lg'}`}>{isSubmitting ? <><Loader2 className="animate-spin" size={20}/> 假單傳送中...</> : '確認送出假單'}</button></form></div></div>);
        }

        function ApprovalView({ leaves, currentUser, crud, users }) {
          const [processingId, setProcessingId] = useState(null);
          const [showAllLeaves, setShowAllLeaves] = useState(false);
          const exportCSV = () => { let csv = "\uFEFF申請人,假別,開始,結束,時數,狀態\n"; leaves.forEach(l => csv += `${l.requesterName},${l.type},${l.start},${l.end},${l.hours},${l.status}\n`); const link = document.createElement("a"); link.href = encodeURI("data:text/csv;charset=utf-8,"+csv); link.download = "leave_report.csv"; link.click(); };
          const pendingMyDeputy = leaves.filter(l => (l.deputyId === currentUser.uid || l.deputyId === (currentUser.email || '').toLowerCase() || l.deputyId === currentUser.docId) && l.status === 'pending');
          const pendingLeader = (currentUser.role === 'leader' || currentUser.role === 'admin') ? leaves.filter(l => l.status === 'deputy_signed') : [];
          const handleDeputyAgree = async (leave) => { if (processingId) return; setProcessingId(leave.id); try { await crud.updateLeave(leave.id, { status: 'deputy_signed' }); } catch(e) { alert("操作失敗"); } finally { setProcessingId(null); } };
          const handleLeaderApprove = async (leave) => { if (processingId) return; setProcessingId(leave.id); try { await crud.updateLeave(leave.id, { status: 'approved', approverId: currentUser.uid }); } catch(e) { alert("操作失敗"); } finally { setProcessingId(null); } };
          const handleReject = async (leave) => { if (processingId) return; setProcessingId(leave.id); try { await crud.updateLeave(leave.id, { status: 'rejected', approverId: currentUser.uid }); } catch(e) { alert("操作失敗"); } finally { setProcessingId(null); } }
          const StatusStep = ({ status }) => {
              const step1 = status !== 'pending' ? 'text-green-600 font-bold' : 'text-gray-400';
              const step2 = status === 'approved' ? 'text-green-600 font-bold' : (status === 'deputy_signed' ? 'text-blue-600 animate-pulse font-bold' : 'text-gray-400');
              return (<div className="flex items-center text-xs gap-1 bg-gray-100 px-2 py-1 rounded-full"><span className={`flex items-center ${step1}`}>1. 職代 {status !== 'pending' ? '✅' : '⏳'}</span><span className="text-gray-300">→</span><span className={`flex items-center ${step2}`}>2. 主管 {status === 'approved' ? '✅' : '⏳'}</span></div>);
          }
          return (<div className="max-w-4xl mx-auto space-y-8"><div className="flex justify-between items-center"><h2 className="text-xl font-bold flex items-center gap-2"><CheckCircle/> 差單審核</h2><button onClick={exportCSV} className="bg-green-600 text-white px-3 py-1.5 rounded text-sm flex items-center gap-1"><FileSpreadsheet size={16}/> 匯出報表</button></div><div className="bg-white rounded shadow overflow-hidden border-t-4 border-blue-500"><div className="bg-blue-50 px-4 py-3 border-b border-blue-100 font-bold text-blue-800 flex items-center gap-2"><User size={18}/> 第一關：待我簽核 (我是職代)</div>{pendingMyDeputy.length===0 ? <div className="p-8 text-center text-gray-400 text-sm">無待辦事項，您目前沒有需要代理的案件。</div> : <table className="w-full text-sm text-left"><thead className="bg-gray-50 border-b text-gray-500"><tr><th className="p-3">申請人</th><th className="p-3">項目</th><th className="p-3">進度狀態</th><th className="p-3">操作</th></tr></thead><tbody>{pendingMyDeputy.map(l => (<tr key={l.id} className="border-b last:border-0 hover:bg-gray-50"><td className="p-3 font-bold text-gray-700">{l.requesterName}</td><td className="p-3"><span className="font-bold text-blue-600">{l.type}</span><div className="text-xs text-gray-500 mt-1">{l.start.replace('T',' ')} <br/>~ {l.end.replace('T',' ')}</div></td><td className="p-3"><StatusStep status={l.status}/></td><td className="p-3 flex gap-2"><button onClick={()=>handleDeputyAgree(l)} disabled={processingId === l.id} className={`text-white font-bold text-xs bg-blue-500 px-3 py-1.5 rounded shadow-sm flex items-center gap-1 ${processingId === l.id ? 'opacity-50 cursor-not-allowed' : 'hover:bg-blue-600'}`}>{processingId === l.id ? <Loader2 className="animate-spin" size={12}/> : <CheckCircle size={12}/>} 簽核同意</button><button onClick={()=>handleReject(l)} disabled={processingId === l.id} className={`text-red-600 font-bold text-xs bg-red-50 px-3 py-1.5 rounded ${processingId === l.id ? 'opacity-50 cursor-not-allowed' : 'hover:bg-red-100'}`}>{processingId === l.id ? '...' : '退回'}</button></td></tr>))}</tbody></table>}</div>{(currentUser.role === 'leader' || currentUser.role === 'admin') && <div className="bg-white rounded shadow overflow-hidden border-t-4 border-orange-500"><div className="bg-orange-50 px-4 py-3 border-b border-orange-100 font-bold text-orange-800 flex items-center gap-2"><CheckCircle size={18}/> 第二關：待最終核准 (組長權限)</div>{pendingLeader.length===0 ? <div className="p-8 text-center text-gray-400 text-sm">無待審核項目</div> : <table className="w-full text-sm text-left"><thead className="bg-gray-50 border-b text-gray-500"><tr><th className="p-3">申請人</th><th className="p-3">項目</th><th className="p-3">進度狀態</th><th className="p-3">操作</th></tr></thead><tbody>{pendingLeader.map(l => (<tr key={l.id} className="border-b last:border-0 hover:bg-gray-50"><td className="p-3 font-bold text-gray-700">{l.requesterName}</td><td className="p-3"><span className="font-bold text-gray-800">{l.type}</span><div className="text-xs text-gray-500 mt-1">{l.start.replace('T',' ')} <br/>~ {l.end.replace('T',' ')}</div></td><td className="p-3"><StatusStep status={l.status}/></td><td className="p-3 flex gap-2"><button onClick={()=>handleLeaderApprove(l)} disabled={processingId === l.id} className={`text-white font-bold text-xs bg-green-600 px-3 py-1.5 rounded shadow-sm flex items-center gap-1 ${processingId === l.id ? 'opacity-50 cursor-not-allowed' : 'hover:bg-green-700'}`}>{processingId === l.id ? <Loader2 className="animate-spin" size={12}/> : <CheckCircle size={12}/>} 最終核准</button><button onClick={()=>handleReject(l)} disabled={processingId === l.id} className={`text-red-600 font-bold text-xs bg-red-50 px-3 py-1.5 rounded ${processingId === l.id ? 'opacity-50 cursor-not-allowed' : 'hover:bg-red-100'}`}>{processingId === l.id ? '...' : '駁回'}</button></td></tr>))}</tbody></table>}</div>}<div className="bg-white rounded shadow overflow-hidden border border-gray-200 mt-8"><button onClick={() => setShowAllLeaves(!showAllLeaves)} className="w-full px-4 py-3 bg-gray-50 hover:bg-gray-100 flex justify-between items-center transition font-bold text-gray-700"><span className="flex items-center gap-2"><List size={18}/> 檢視全團隊請假紀錄總覽</span>{showAllLeaves ? <ChevronRight className="rotate-90 transition-transform" /> : <ChevronRight className="transition-transform"/>}</button>{showAllLeaves && (<div className="p-0 border-t">{leaves.length === 0 ? (<div className="p-8 text-center text-gray-400 text-sm">系統中尚無任何假單紀錄。</div>) : (<table className="w-full text-sm text-left"><thead className="bg-gray-100 border-b text-gray-600"><tr><th className="p-3">申請人</th><th className="p-3">假別</th><th className="p-3">時間區間</th><th className="p-3">時數</th><th className="p-3">狀態</th></tr></thead><tbody>{[...leaves].sort((a,b) => new Date(b.timestamp || b.start) - new Date(a.timestamp || a.start)).map(l => (<tr key={`all-${l.id}`} className="border-b last:border-0 hover:bg-gray-50"><td className="p-3 font-medium text-gray-800">{l.requesterName}</td><td className="p-3 text-blue-600 font-bold">{l.type}</td><td className="p-3 text-xs text-gray-500">{l.start.replace('T', ' ')} <br/>~ {l.end.replace('T', ' ')}</td><td className="p-3">{l.hours} 小時</td><td className="p-3"><span className={`px-2 py-1 rounded text-xs font-bold ${l.status === 'approved' ? 'bg-green-100 text-green-700' : l.status === 'rejected' ? 'bg-red-100 text-red-700' : 'bg-orange-100 text-orange-700'}`}>{l.status === 'approved' ? '已核准' : l.status === 'rejected' ? '已退回' : '審核中'}</span></td></tr>))}</tbody></table>)}</div>)}</div></div>);
        }

        function StatisticsView({ users, leaves, currentUser, onUpdateAnyProfile }) {
            const [selectedYear, setSelectedYear] = useState(new Date().getFullYear());
            const [selectedMonth, setSelectedMonth] = useState('all');
            const [selectedUserId, setSelectedUserId] = useState(currentUser.docId);
            const isAdminOrLeader = currentUser.role === 'admin' || currentUser.role === 'leader';
            const viewableUsers = isAdminOrLeader ? users : users.filter(u => u.docId === currentUser.docId);
            const targetUser = users.find(u => u.docId === selectedUserId) || currentUser;
            const getSeniorityStats = () => {
                if (!targetUser.joinDate) return { days: 0, text: '未設定到職日', warning: true };
                const joinDate = new Date(targetUser.joinDate);
                const today = new Date();
                let checkDate = today.getFullYear() === selectedYear ? today : new Date(selectedYear, 11, 31);
                let years = checkDate.getFullYear() - joinDate.getFullYear();
                let months = checkDate.getMonth() - joinDate.getMonth();
                if (months < 0 || (months === 0 && checkDate.getDate() < joinDate.getDate())) { years--; months += 12; }
                if (checkDate.getDate() < joinDate.getDate()) { months--; }
                let totalMonths = (years * 12) + months;
                if (totalMonths < 0) totalMonths = 0;
                let days = 0;
                if (totalMonths >= 6 && totalMonths < 12) days = 3;
                else if (totalMonths >= 12 && totalMonths < 24) days = 7;
                else if (totalMonths >= 24 && totalMonths < 36) days = 10;
                else if (totalMonths >= 36 && totalMonths < 60) days = 14;
                else if (totalMonths >= 60 && totalMonths < 120) days = 15;
                else if (totalMonths >= 120) days = Math.min(30, 15 + (Math.floor(totalMonths/12) - 9));
                return { days, text: `${years >= 0 ? years : 0} 年 ${months >= 0 ? months : 0} 個月` };
            };
            const seniority = getSeniorityStats();
            const extraLeaveDays = Number(targetUser.extraLeaveDays || 0);
            const filteredLeaves = leaves.filter(l => 
                (l.requesterId === targetUser.uid || l.requesterId === targetUser.docId) && 
                l.status === 'approved' &&
                l.start.startsWith(String(selectedYear)) &&
                (selectedMonth === 'all' ? true : l.start.startsWith(`${selectedYear}-${selectedMonth}`))
            ).sort((a,b) => new Date(a.start) - new Date(b.start));
            let usedAnnual = 0;
            let usedSick = 0;
            let usedPersonal = 0;
            let totalCompensatoryEarned = 0;
            let totalCompensatoryUsed = 0;
            filteredLeaves.forEach(l => {
                const days = l.hours / 8;
                const hours = Number(l.hours);
                if (l.type.includes('特休')) usedAnnual += days;
                if (l.type.includes('病假')) usedSick += days;
                if (l.type.includes('事假') && !l.type.includes('公假')) usedPersonal += days;
                if (l.type === '加班申請(列計)') totalCompensatoryEarned += hours;
                if (l.type === '補休') totalCompensatoryUsed += hours;
            });
            let allTimeCompensatoryEarned = 0;
            let allTimeCompensatoryUsed = 0;
            leaves.forEach(l => {
                if ((l.requesterId === targetUser.uid || l.requesterId === targetUser.docId) && l.status === 'approved') {
                    if (l.type === '加班申請(列計)') allTimeCompensatoryEarned += Number(l.hours);
                    if (l.type === '補休') allTimeCompensatoryUsed += Number(l.hours);
                }
            });
            const compensatoryBalance = allTimeCompensatoryEarned - allTimeCompensatoryUsed;
            const totalAnnualEntitled = seniority.days + extraLeaveDays;
            const handleEditExtraLeave = () => {
                if (!isAdminOrLeader) return;
                const newDays = prompt(`請輸入 ${targetUser.name} 的「單位額外特休」天數 (目前為 ${extraLeaveDays} 天)：\n此為手動加給，不會被系統覆蓋。`, extraLeaveDays);
                if (newDays !== null && !isNaN(newDays) && newDays.trim() !== '') {
                    onUpdateAnyProfile(targetUser.docId, { extraLeaveDays: Number(newDays) });
                }
            };
            return (
                <div className="max-w-5xl mx-auto space-y-6">
                    <div className="bg-white p-4 rounded shadow-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-4"><h2 className="text-xl font-bold flex items-center gap-2"><PieChart/> 假別統計與明細</h2><div className="flex gap-3 flex-wrap">{isAdminOrLeader && (<select className="border p-2 rounded text-sm bg-gray-50 outline-none focus:bg-white" value={selectedUserId} onChange={e=>setSelectedUserId(e.target.value)}>{viewableUsers.map(u => <option key={u.docId} value={u.docId}>{u.name}</option>)}</select>)}<select className="border p-2 rounded text-sm bg-gray-50 outline-none focus:bg-white" value={selectedYear} onChange={e=>setSelectedYear(Number(e.target.value))}>{[...Array(5)].map((_, i) => { const y = new Date().getFullYear() - 2 + i; return <option key={y} value={y}>{y} 年度</option> })}</select><select className="border p-2 rounded text-sm bg-gray-50 outline-none focus:bg-white" value={selectedMonth} onChange={e=>setSelectedMonth(e.target.value)}><option value="all">全年總計</option>{[...Array(12)].map((_, i) => { const m = String(i + 1).padStart(2, '0'); return <option key={m} value={m}>{i + 1} 月</option> })}</select></div></div>
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                        <div className="bg-white rounded-xl shadow-sm border-t-4 border-indigo-500 p-5"><div className="flex justify-between items-start border-b pb-3 mb-3"><div><h3 className="font-bold text-gray-800 text-lg">特休假</h3><p className="text-xs text-gray-500 mt-1">{seniority.text}</p></div><div className="text-right"><span className="text-2xl font-black text-indigo-600">{totalAnnualEntitled - usedAnnual}</span><span className="text-xs text-gray-500 ml-1">天餘</span></div></div><div className="text-xs space-y-1"><div className="flex justify-between"><span>法定:</span><span className="font-bold">{seniority.days}</span></div><div className="flex justify-between"><span className="flex items-center gap-1">額外: {isAdminOrLeader && <button onClick={handleEditExtraLeave}><Edit2 size={10}/></button>}</span><span className="font-bold">{extraLeaveDays}</span></div><div className="flex justify-between text-red-600"><span>已用:</span><span className="font-bold">{usedAnnual}</span></div></div></div>
                        <div className="bg-white rounded-xl shadow-sm border-t-4 border-purple-500 p-5"><div className="flex justify-between items-start border-b pb-3 mb-3"><div><h3 className="font-bold text-gray-800 text-lg">補休時數</h3><p className="text-xs text-gray-500 mt-1">加班累積</p></div><div className="text-right"><span className="text-2xl font-black text-purple-600">{compensatoryBalance}</span><span className="text-xs text-gray-500 ml-1">時餘</span></div></div><div className="text-xs space-y-1"><div className="flex justify-between"><span>總累積:</span><span className="font-bold">{allTimeCompensatoryEarned}</span></div><div className="flex justify-between text-red-600"><span>總已用:</span><span className="font-bold">{allTimeCompensatoryUsed}</span></div></div></div>
                        <div className="bg-white rounded-xl shadow-sm border-t-4 border-emerald-500 p-5"><div className="flex justify-between items-start border-b pb-3 mb-3"><div><h3 className="font-bold text-gray-800 text-lg">病假</h3><p className="text-xs text-gray-500 mt-1">含生理假</p></div><div className="text-right"><span className="text-2xl font-black text-emerald-600">{30 - usedSick}</span><span className="text-xs text-gray-500 ml-1">天餘</span></div></div><div className="text-xs space-y-1"><div className="flex justify-between"><span>額度:</span><span className="font-bold">30</span></div><div className="flex justify-between text-red-600"><span>已用:</span><span className="font-bold">{usedSick}</span></div></div></div>
                        <div className="bg-white rounded-xl shadow-sm border-t-4 border-amber-500 p-5"><div className="flex justify-between items-start border-b pb-3 mb-3"><div><h3 className="font-bold text-gray-800 text-lg">事假</h3><p className="text-xs text-gray-500 mt-1">無薪</p></div><div className="text-right"><span className="text-2xl font-black text-amber-600">{14 - usedPersonal}</span><span className="text-xs text-gray-500 ml-1">天餘</span></div></div><div className="text-xs space-y-1"><div className="flex justify-between"><span>額度:</span><span className="font-bold">14</span></div><div className="flex justify-between text-red-600"><span>已用:</span><span className="font-bold">{usedPersonal}</span></div></div></div>
                    </div>
                    <div className="bg-white rounded shadow overflow-hidden border border-gray-100"><div className="p-4 border-b bg-gray-50"><h3 className="font-bold text-gray-700 flex items-center gap-2"><List size={18}/> 請假使用紀錄 ({selectedMonth === 'all' ? '全年' : `${selectedMonth} 月`})</h3></div><table className="w-full text-sm text-left"><thead className="bg-white border-b text-gray-500"><tr><th className="p-3 w-32">日期區間</th><th className="p-3 w-32">假別</th><th className="p-3 w-20">扣除</th><th className="p-3">事由</th></tr></thead><tbody>{filteredLeaves.map(l => (<tr key={l.id} className="border-b last:border-0 hover:bg-gray-50 transition"><td className="p-3 text-xs text-gray-600">{l.start.replace('T', ' ')}<br/>~ {l.end.replace('T', ' ')}</td><td className="p-3 font-bold text-blue-700">{l.type}</td><td className="p-3"><span className="bg-gray-100 px-2 py-0.5 rounded font-bold text-xs">{l.type.includes('加班') || l.type === '補休' ? `${l.hours} 時` : `${l.hours/8} 天`}</span></td><td className="p-3 text-gray-600">{l.reason}</td></tr>))}{filteredLeaves.length === 0 && <tr><td colSpan="4" className="p-8 text-center text-gray-400">尚無使用紀錄</td></tr>}</tbody></table></div>
                </div>
            );
        }

        function AttendanceView({ user, db, attendanceRecords }) {
            const [selectedMonth, setSelectedMonth] = useState(new Date().toISOString().slice(0, 7));
            const [localRecords, setLocalRecords] = useState({});
            const daysInMonth = new Date(selectedMonth.split('-')[0], selectedMonth.split('-')[1], 0).getDate();
            useEffect(() => {
                const currentMonthRecords = attendanceRecords.filter(r => r.userId === user.uid && r.month === selectedMonth);
                const recordsMap = {};
                currentMonthRecords.forEach(r => { recordsMap[r.date] = r; });
                setLocalRecords(recordsMap);
            }, [attendanceRecords, selectedMonth, user.uid]);
            const handleTimeChange = (date, field, value) => { setLocalRecords(prev => ({ ...prev, [date]: { ...prev[date], [field]: value } })); };
            const batchFill = () => {
                const newRecords = { ...localRecords };
                for (let i = 1; i <= daysInMonth; i++) {
                    const dateStr = `${selectedMonth}-${String(i).padStart(2, '0')}`;
                    const dayOfWeek = new Date(dateStr).getDay();
                    if (dayOfWeek !== 0 && dayOfWeek !== 6) { if (!newRecords[dateStr]) { newRecords[dateStr] = { start: '08:00', end: '17:00' }; } }
                }
                setLocalRecords(newRecords);
            };
            const saveAttendance = async () => {
                const batch = writeBatch(db);
                Object.keys(localRecords).forEach(date => {
                    const record = localRecords[date];
                    if (record.start || record.end) {
                        const docId = `${user.uid}_${date}`;
                        const ref = doc(db, 'artifacts', APP_ID, 'public', 'data', 'attendance', docId);
                        batch.set(ref, { userId: user.uid, month: selectedMonth, date: date, start: record.start || '', end: record.end || '' }, { merge: true });
                    }
                });
                try { await batch.commit(); alert("打卡紀錄已儲存！"); } catch (e) { alert("儲存失敗: " + e.message); }
            };
            const downloadExcel = () => {
                let csvContent = "\uFEFF日期,星期,上午上班,上午下班,下午上班,下午下班\n";
                const weekDays = ['日', '一', '二', '三', '四', '五', '六'];
                for (let i = 1; i <= daysInMonth; i++) {
                    const dateStr = `${selectedMonth}-${String(i).padStart(2, '0')}`;
                    const d = new Date(dateStr);
                    const dayName = weekDays[d.getDay()];
                    const rec = localRecords[dateStr] || { start: '', end: '' };
                    const morningEnd = rec.start ? '12:00' : '';
                    const afternoonStart = rec.end ? '13:00' : '';
                    csvContent += `${dateStr},${dayName},${rec.start || ''},${morningEnd},${afternoonStart},${rec.end || ''}\n`;
                }
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.download = `${user.name}_${selectedMonth}_出勤紀錄.csv`;
                link.click();
            };
            return (
                <div className="max-w-4xl mx-auto space-y-6">
                    <div className="bg-white p-4 rounded shadow-sm flex flex-col md:flex-row justify-between items-center gap-4"><h2 className="text-xl font-bold flex items-center gap-2"><Clock/> 個人打卡紀錄</h2><div className="flex gap-2"><input type="month" className="border p-2 rounded text-sm" value={selectedMonth} onChange={e => setSelectedMonth(e.target.value)} /><button onClick={batchFill} className="bg-blue-100 text-blue-700 px-3 py-2 rounded text-sm font-bold flex items-center gap-1 hover:bg-blue-200"><CheckSquare size={16}/> 批量預設</button><button onClick={downloadExcel} className="bg-green-100 text-green-700 px-3 py-2 rounded text-sm font-bold flex items-center gap-1 hover:bg-green-200"><Download size={16}/> 下載 Excel</button></div></div>
                    <div className="bg-white rounded shadow overflow-hidden border"><div className="max-h-[600px] overflow-y-auto"><table className="w-full text-sm text-left"><thead className="bg-gray-100 sticky top-0 z-10 font-bold text-gray-600"><tr><th className="p-3">日期</th><th className="p-3">星期</th><th className="p-3">上午上班</th><th className="p-3 text-gray-400">上午下班 (隱藏)</th><th className="p-3 text-gray-400">下午上班 (隱藏)</th><th className="p-3">下午下班</th></tr></thead><tbody>{[...Array(daysInMonth)].map((_, i) => { const dateStr = `${selectedMonth}-${String(i + 1).padStart(2, '0')}`; const d = new Date(dateStr); const dayOfWeek = d.getDay(); const isWeekend = dayOfWeek === 0 || dayOfWeek === 6; const rec = localRecords[dateStr] || {}; return (<tr key={dateStr} className={`border-b ${isWeekend ? 'bg-gray-50' : 'hover:bg-blue-50'}`}><td className="p-3 font-medium">{dateStr}</td><td className={`p-3 font-bold ${isWeekend ? 'text-red-500' : 'text-gray-600'}`}>{['日', '一', '二', '三', '四', '五', '六'][dayOfWeek]}</td><td className="p-2"><input type="time" className="border rounded p-1 w-full bg-white focus:ring-2 focus:ring-blue-300 outline-none" value={rec.start || ''} onChange={(e) => handleTimeChange(dateStr, 'start', e.target.value)} /></td><td className="p-3 text-gray-400 text-xs">12:00</td><td className="p-3 text-gray-400 text-xs">13:00</td><td className="p-2"><input type="time" className="border rounded p-1 w-full bg-white focus:ring-2 focus:ring-blue-300 outline-none" value={rec.end || ''} onChange={(e) => handleTimeChange(dateStr, 'end', e.target.value)} /></td></tr>); })}</tbody></table></div><div className="p-4 border-t bg-gray-50 flex justify-end"><button onClick={saveAttendance} className="bg-slate-800 text-white px-6 py-3 rounded-lg font-bold shadow hover:bg-slate-900 transition flex items-center gap-2"><CheckCircle size={18}/> 儲存打卡紀錄</button></div></div>
                </div>
            );
        }

        function MembersView({ db, users, currentUser, roleNames }) {
            const isAdmin = currentUser && currentUser.role === 'admin';
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [editUser, setEditUser] = useState(null);
            const handleImportPredefined = async () => { if(!confirm("要將系統內建的預設名單(國裕, 湘怡等...)直接匯入資料庫嗎？\n這樣您馬上就能幫他們排班，不用等他們登入！")) return; try { for(const p of PREDEFINED_USERS) { const docId = p.email.toLowerCase(); const exists = users.find(u => u.docId === docId); if (!exists) { await setDoc(doc(db, 'artifacts', 'kpptjawork', 'public', 'data', 'user_profiles', docId), { uid: docId, email: p.email, name: p.name, role: p.role, initials: p.initials, color: p.color, borderColor: p.borderColor, usePhoto: false, avatarUrl: '', joinDate: '', extraLeaveDays: 0 }); } } alert("預設名單匯入完成！您可以去排班日曆了。"); } catch (e) { alert("匯入失敗: " + e.message); } };
            const handleSave = async (userData) => { try { const targetDocId = userData.docId || (userData.email ? userData.email.toLowerCase() : userData.name); const dataToSave = { ...userData }; delete dataToSave.docId; await setDoc(doc(db, 'artifacts', 'kpptjawork', 'public', 'data', 'user_profiles', targetDocId), dataToSave, { merge: true }); setIsModalOpen(false); setEditUser(null); } catch (e) { alert("儲存失敗: " + e.message); } };
            const handleDelete = async (docId) => { if(confirm("確定要刪除此成員嗎？")) { try { await deleteDoc(doc(db, 'artifacts', 'kpptjawork', 'public', 'data', 'user_profiles', docId)); } catch (e) { alert("刪除失敗: " + e.message); } } };

ames} />)}</div>);

                    <div className="bg-white p-6 rounded shadow-sm"><h2 className="text-xl font-bold mb-4 flex items-center gap-2"><Palette/> 轄區設定 (新增/顏色)</h2><div className="flex gap-2 mb-6"><input className="border rounded px-3 py-2 text-sm flex-1" placeholder="輸入新轄區..." value={newArea} onChange={e=>setNewArea(e.target.value)} /><button onClick={()=>handleAddAreaWithColor(newArea)} className="bg-green-600 text-white px-4 py-2 rounded text-sm font-bold">新增轄區</button></div><div className="grid grid-cols-2 md:grid-cols-3 gap-4">{tags.areaTags.map(area => (<div key={area} className="relative group"><button className={`w-full text-left px-3 py-2 rounded border flex justify-between items-center ${areaC[area] || "bg-gray-100 text-gray-800"}`}><span className="font-bold">{area}</span><div className="w-4 h-4 rounded-full border border-black/20 bg-current opacity-50"></div></button><div className="absolute top-full left-0 z-10 bg-white shadow-lg border p-2 rounded hidden group-hover:flex gap-1 flex-wrap w-48">{colors.map(co => (<div key={co.c} onClick={()=>handleColorChange(area, co.c)} className={`w-6 h-6 rounded cursor-pointer border ${co.c.split(' ')[0]}`} title={co.l}></div>))}</div></div>))}</div></div>

r:border-indigo-300 ${editLeaveId === t.id ? 'ring-2 ring-yellow-400' : ''}`}><div><span className="font-bold text-gray-800 inline-block w-24">{t.name}</span><span className="text-gray-500 text-xs">{t.desc}</span></div><div className="flex gap-1 opacity-100 md:opacity-0 md:group-hover:opacity-100 transition-opacity"><button onClick={()=>startEditLeave(t)} className="text-gray-400 hover:text-blue-600 p-1.5 bg-gray-50 rounded"><Edit size={14}/></button><button onClick={()=>handleManageLeaveTypes('delete', t.id)} className="text-gray-400 hover:text-red-600 p-1.5 bg-red-50 rounded"><Trash2 size={14}/></button></div></div>))}</div></div><div><h3 className="text-sm font-bold text-orange-700 mb-2 border-b pb-1 mt-4">區段二：私假 (依法令給假)</h3><div className="flex flex-col gap-2">{leaveTypes.filter(t=>t.category==='personal').map(t => (<div key={t.id} className={`flex justify-between items-center bg-white border px-3 py-2 rounded-lg text-sm group hover:border-orange-300 ${editLeaveId === t.id ? 'ring-2 ring-yellow-400' : ''}`}><div><span className="font-bold text-gray-800 inline-block w-24">{t.name}</span><span className="text-gray-500 text-xs">{t.desc}</span></div><div className="flex gap-1 opacity-100 md:opacity-0 md:group-hover:opacity-100 transition-opacity"><button onClick={()=>startEditLeave(t)} className="text-gray-400 hover:text-blue-600 p-1.5 bg-gray-50 rounded"><Edit size={14}/></button><button onClick={()=>handleManageLeaveTypes('delete', t.id)} className="text-gray-400 hover:text-red-600 p-1.5 bg-red-50 rounded"><Trash2 size={14}/></button></div></div>))}</div></div></div></div>

        function DatabaseAdminView({ events, leaves, crud, db }) {
            const [activeTab, setActiveTab] = useState('events');
            const [selectedEvents, setSelectedEvents] = useState([]);
            const [selectedLeaves, setSelectedLeaves] = useState([]);
            const [isProcessing, setIsProcessing] = useState(false);
            const eventGroups = useMemo(() => {
                const groups = {};
                events.forEach(e => {
                    if (!groups[e.groupId]) groups[e.groupId] = { id: e.groupId, date: e.date, type: '', items: [] };
                    if (e.type === 'tag') { groups[e.groupId].type = e.item; groups[e.groupId].date = e.date; } else if (e.type === 'person') { groups[e.groupId].items.push(e.userName); }
                });
                return Object.values(groups).sort((a, b) => new Date(b.date) - new Date(a.date));
            }, [events]);
            const sortedLeaves = [...leaves].sort((a,b) => new Date(b.timestamp || b.start) - new Date(a.timestamp || a.start));
            const handleToggleEvent = (id) => { setSelectedEvents(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]); };
            const handleToggleLeave = (id) => { setSelectedLeaves(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]); };
            const toggleAllEvents = () => { if (selectedEvents.length === eventGroups.length) setSelectedEvents([]); else setSelectedEvents(eventGroups.map(g => g.id)); };
            const toggleAllLeaves = () => { if (selectedLeaves.length === leaves.length) setSelectedLeaves([]); else setSelectedLeaves(leaves.map(l => l.id)); };
            const handleDeleteSelected = async () => {
                const targetIds = activeTab === 'events' ? selectedEvents : selectedLeaves;
                if (targetIds.length === 0) return alert("請先勾選要刪除的資料！");
                if (!confirm(`警告！您即將刪除 ${targetIds.length} 筆資料。\n刪除後無法復原，確定要繼續嗎？`)) return;
                setIsProcessing(true);
                try {
                    if (activeTab === 'events') { for (const gid of targetIds) { await crud.deleteEventsByGroup(gid); } setSelectedEvents([]); } else { for (const lid of targetIds) { await crud.deleteLeave(lid); } setSelectedLeaves([]); }
                    alert("選擇的資料已成功刪除！");
                } catch (e) { alert("刪除過程中發生錯誤：" + e.message); } finally { setIsProcessing(false); }
            };
            return (
                <div className="max-w-5xl mx-auto space-y-6">
                    <div className="bg-white p-4 rounded shadow-sm flex flex-col md:flex-row justify-between items-center gap-4"><h2 className="text-xl font-bold flex items-center gap-2 text-red-600"><Database /> 資料庫清理與管理</h2><div className="bg-gray-100 p-1 rounded-lg flex text-sm"><button onClick={() => {setActiveTab('events'); setSelectedEvents([]);}} className={`px-4 py-2 rounded font-bold transition ${activeTab === 'events' ? 'bg-white shadow text-blue-600' : 'text-gray-500'}`}>📅 排班紀錄 ({eventGroups.length})</button><button onClick={() => {setActiveTab('leaves'); setSelectedLeaves([]);}} className={`px-4 py-2 rounded font-bold transition ${activeTab === 'leaves' ? 'bg-white shadow text-blue-600' : 'text-gray-500'}`}>📋 假單紀錄 ({leaves.length})</button></div></div>
                    <div className="bg-red-50 border border-red-200 text-red-700 p-4 rounded-lg flex items-start gap-3"><AlertTriangle className="shrink-0 mt-0.5" size={20} /><div className="text-sm"><strong>管理員專用功能：</strong> 在此刪除的資料將會從雲端資料庫永久抹除，請謹慎使用。建議僅用於清理測試資料或無效的歷史紀錄。</div></div>
                    <div className="bg-white rounded shadow-sm border overflow-hidden"><div className="p-3 bg-gray-50 border-b flex justify-between items-center"><span className="text-sm font-bold text-gray-600">已選取 {activeTab === 'events' ? selectedEvents.length : selectedLeaves.length} 項目</span><button onClick={handleDeleteSelected} disabled={isProcessing || (activeTab === 'events' ? selectedEvents.length === 0 : selectedLeaves.length === 0)} className={`bg-red-600 text-white px-4 py-2 rounded text-sm font-bold flex items-center gap-2 transition ${isProcessing || (activeTab === 'events' ? selectedEvents.length === 0 : selectedLeaves.length === 0) ? 'opacity-50 cursor-not-allowed' : 'hover:bg-red-700'}`}>{isProcessing ? <><Loader2 size={16} className="animate-spin" /> 刪除中...</> : <><Trash2 size={16} /> 批次刪除勾選項目</>}</button></div><div className="overflow-x-auto max-h-[60vh]">{activeTab === 'events' ? (<table className="w-full text-sm text-left"><thead className="bg-gray-100 text-gray-600 sticky top-0 z-10 shadow-sm"><tr><th className="p-3 w-12 text-center"><input type="checkbox" onChange={toggleAllEvents} checked={eventGroups.length > 0 && selectedEvents.length === eventGroups.length} className="w-4 h-4 text-red-600 rounded cursor-pointer" /></th><th className="p-3 w-32">日期</th><th className="p-3 w-40">工作項目</th><th className="p-3">排班人員</th><th className="p-3 w-40 text-xs text-gray-400">群組 ID</th></tr></thead><tbody>{eventGroups.map(g => (<tr key={g.id} className={`border-b hover:bg-red-50 transition cursor-pointer ${selectedEvents.includes(g.id) ? 'bg-red-50/50' : ''}`} onClick={() => handleToggleEvent(g.id)}><td className="p-3 text-center" onClick={e=>e.stopPropagation()}><input type="checkbox" checked={selectedEvents.includes(g.id)} onChange={() => handleToggleEvent(g.id)} className="w-4 h-4 text-red-600 rounded cursor-pointer" /></td><td className="p-3 font-medium">{g.date}</td><td className="p-3 text-blue-700 font-bold">{g.type || '無標籤'}</td><td className="p-3 flex gap-1 flex-wrap">{g.items.length > 0 ? g.items.map((n, i) => <span key={i} className="bg-gray-200 px-2 py-0.5 rounded-full text-xs">{n}</span>) : '-'}</td><td className="p-3 text-xs text-gray-400 truncate max-w-[120px]" title={g.id}>{g.id}</td></tr>))}</tbody></table>) : (<table className="w-full text-sm text-left"><thead className="bg-gray-100 text-gray-600 sticky top-0 z-10 shadow-sm"><tr><th className="p-3 w-12 text-center"><input type="checkbox" onChange={toggleAllLeaves} checked={leaves.length > 0 && selectedLeaves.length === leaves.length} className="w-4 h-4 text-red-600 rounded cursor-pointer" /></th><th className="p-3 w-24">申請人</th><th className="p-3 w-24">假別</th><th className="p-3">時間區間</th><th className="p-3 w-20">狀態</th><th className="p-3 w-40 text-xs text-gray-400">紀錄 ID</th></tr></thead><tbody>{sortedLeaves.map(l => (<tr key={l.id} className={`border-b hover:bg-red-50 transition cursor-pointer ${selectedLeaves.includes(l.id) ? 'bg-red-50/50' : ''}`} onClick={() => handleToggleLeave(l.id)}><td className="p-3 text-center" onClick={e=>e.stopPropagation()}><input type="checkbox" checked={selectedLeaves.includes(l.id)} onChange={() => handleToggleLeave(l.id)} className="w-4 h-4 text-red-600 rounded cursor-pointer" /></td><td className="p-3 font-medium text-gray-800">{l.requesterName}</td><td className="p-3 font-bold text-indigo-600">{l.type}</td><td className="p-3 text-xs text-gray-600">{l.start.replace('T', ' ')} ~ {l.end.replace('T', ' ')} <br/>({l.hours} 小時)</td><td className="p-3"><span className={`px-2 py-1 rounded text-xs font-bold ${l.status === 'approved' ? 'bg-green-100 text-green-700' : l.status === 'rejected' ? 'bg-red-100 text-red-700' : 'bg-orange-100 text-orange-700'}`}>{l.status}</span></td><td className="p-3 text-xs text-gray-400 truncate max-w-[120px]" title={l.id}>{l.id}</td></tr>))}</tbody></table>)}</div></div></div>
            );
        }

        function LoginScreen({ auth }) {
            const [isLoggingIn, setIsLoggingIn] = useState(false);
            const handleGoogleLogin = async () => { if (!auth) { alert("Firebase 尚未連線完成，請稍後再試。"); return; } setIsLoggingIn(true); const provider = new GoogleAuthProvider(); try { await signInWithPopup(auth, provider); } catch (error) { console.error("Google Sign-In Error", error); alert("登入被中斷或發生錯誤，請重試。\n詳細訊息: " + error.message); setIsLoggingIn(false); } };
            return (<div className="min-h-screen bg-slate-100 flex items-center justify-center p-4"><div className="bg-white w-full max-w-sm p-8 rounded-xl shadow-lg text-center"><div className="w-16 h-16 bg-blue-600 rounded-xl mx-auto mb-4 flex items-center justify-center text-white"><Calendar size={32}/></div><h1 className="text-2xl font-bold text-gray-800 mb-1">差勤排班系統</h1><p className="text-gray-400 text-sm mb-8">高屏澎東職務再設計專案單位</p><div className="space-y-4"><button onClick={handleGoogleLogin} disabled={isLoggingIn} className="w-full py-3.5 rounded-lg font-bold bg-white border-2 border-gray-200 text-gray-700 transition-all flex items-center justify-center gap-3 hover:bg-gray-50 shadow-sm disabled:opacity-50">{isLoggingIn ? (<Loader2 className="animate-spin text-blue-600" size={20}/>) : (<img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" className="w-5 h-5"/>)}<span>{isLoggingIn ? '正在驗證帳號...' : '使用 Google 帳號登入'}</span></button></div></div></div>);
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
