        function PersonalScheduleView({ user, events, leaves, settings }) {
            const [month, setMonth] = useState(new Date().toISOString().slice(0, 7)); 

            const scheduleData = useMemo(() => {
                const daysInMonth = new Date(month.split('-')[0], month.split('-')[1], 0).getDate();
                const data = [];
                
                for(let i=1; i<=daysInMonth; i++) {
                    const dateStr = `${month}-${String(i).padStart(2,'0')}`;
                    
                    const myWork = events.filter(e => e.date === dateStr && e.type === 'person' && e.userName === user.name).map(p => {
                        const tag = events.find(t => t.groupId === p.groupId && t.type === 'tag');
                        return { ...p, tag };
                    });

                    const myLeave = leaves.find(l => l.start.startsWith(dateStr) && l.status === 'approved');

                    let status = '正常';
                    const isExternal = myWork.some(w => w.tag && EXTERNAL_WORK_TAGS.includes(w.tag.item));
                    
                    const officialLeaves = settings.officialLeaveTypes || ["公出", "公假", "出差"];
                    const isOfficialLeave = myLeave && officialLeaves.includes(myLeave.type);
                    const isPersonalLeave = myLeave && !officialLeaves.includes(myLeave.type);

                    if (isExternal && !myLeave) status = '缺公務單';
                    else if (isExternal && isPersonalLeave) status = '假別不符';
                    else if (!myWork.length && isOfficialLeave) status = '異常公出';
                    else if (myLeave) status = myLeave.type;
                    else if (myWork.length > 0) status = '內勤';
                    else status = '無行程';

                    if (myWork.length > 0 || myLeave) {
                        data.push({ name: user.name, date: dateStr, work: myWork, leave: myLeave, status });
                    }
                }
                return data;
            }, [events, leaves, month, user.name, settings.officialLeaveTypes]);

            const exportCSV = () => {
                let csv = "\uFEFF姓名,日期,時間,假別,時數(日時),排班內容,事由,備註,狀態(同意)\n";
                scheduleData.forEach(d => {
                    if(d.work.length > 0) {
                        d.work.forEach(w => {
                             const time = TIME_SLOTS.find(s=>s.id===w.slot)?.label||'整天';
                             const leaveType = d.leave?.type || '';
                             const hours = d.leave?.hours || '';
                             const content = `${w.tag?.item||''}${w.tag?.area ? `(${w.tag.area})` : ''}`;
                             const reason = d.leave?.reason || '';
                             const note = w.tag?.note || '';
                             const status = (d.status === '正常' || d.status === '內勤' || d.leave) ? '同意' : d.status;

                             csv += `${d.name},${d.date},${time},${leaveType},${hours},${content},${reason},${note},${status}\n`;
                        });
                    } else {
                        const time = '整天'; 
                        const leaveType = d.leave?.type || '';
                        const hours = d.leave?.hours || '';
                        const reason = d.leave?.reason || '';
                        const status = d.status === '正常' || d.status === '內勤' || d.leave ? '同意' : d.status;
                        
                        csv += `${d.name},${d.date},${time},${leaveType},${hours},,,${reason},,${status}\n`;
                    }
                });
                const link = document.createElement("a");
                link.href = encodeURI("data:text/csv;charset=utf-8,"+csv);
                link.download = `${user.name}_${month}_排班表.csv`;
                link.click();
            };

            const addToGoogleCalendar = (dateStr, slot, title, area, note) => {
                const d = dateStr.replace(/-/g, '');
                let start = '';
                let end = '';
                
                if (slot === 'morning') {
                    start = `${d}T090000`;
                    end = `${d}T120000`;
                } else if (slot === 'afternoon') {
                    start = `${d}T133000`;
                    end = `${d}T173000`;
                } else {
                    start = d;
                    const nextDay = new Date(dateStr);
                    nextDay.setDate(nextDay.getDate() + 1);
                    end = nextDay.toISOString().split('T')[0].replace(/-/g, '');
                }

                const url = new URL('https://calendar.google.com/calendar/render');
                url.searchParams.append('action', 'TEMPLATE');
                url.searchParams.append('text', `[外勤] ${title}`);
                
                if (slot === 'all_day') {
                     url.searchParams.append('dates', `${start}/${end}`);
                } else {
                     url.searchParams.append('dates', `${start}/${end}`);
                     url.searchParams.append('ctz', 'Asia/Taipei'); 
                }
                
                if (note) url.searchParams.append('details', note);
                if (area) url.searchParams.append('location', area);

                window.open(url.toString(), '_blank');
            };

            return (
                <div className="max-w-6xl mx-auto space-y-6">
                    <div className="flex justify-between items-center bg-white p-4 rounded shadow-sm">
                        <h2 className="text-xl font-bold flex items-center gap-2"><FileText/> 個人月報表 (勾稽)</h2>
                        <div className="flex gap-4">
                            <input type="month" className="border p-2 rounded" value={month} onChange={e=>setMonth(e.target.value)} />
                            <button onClick={exportCSV} className="bg-green-600 text-white px-4 py-2 rounded flex items-center gap-2 text-sm"><FileSpreadsheet size={16}/> 匯出 Excel</button>
                        </div>
                    </div>

                    <div className="bg-white rounded shadow overflow-hidden">
                        <table className="w-full text-sm text-left">
                            <thead className="bg-gray-50 border-b font-bold text-gray-600">
                                <tr>
                                    <th className="p-3 w-20">姓名</th>
                                    <th className="p-3 w-28">日期</th>
                                    <th className="p-3 w-16">時間</th>
                                    <th className="p-3 w-20">假別</th>
                                    <th className="p-3 w-16">時數</th>
                                    <th className="p-3">排班內容</th>
                                    <th className="p-3 w-32">事由</th>
                                    <th className="p-3 w-32">備註</th>
                                    <th className="p-3 w-24">狀態</th>
                                </tr>
                            </thead>
                            <tbody>
                                {scheduleData.map((d, idx) => {
                                     const rowsToRender = d.work.length > 0 ? d.work : [{ isLeaveOnly: true }];
                                     
                                     return rowsToRender.map((w, subIdx) => (
                                         <tr key={`${idx}-${subIdx}`} className="border-b last:border-0 hover:bg-gray-50">
                                             <td className="p-3 font-medium">{d.name}</td>
                                             <td className="p-3">{d.date}</td>
                                             <td className="p-3">{w.isLeaveOnly ? '整天' : (TIME_SLOTS.find(s=>s.id===w.slot)?.label)}</td>
                                             <td className="p-3">{d.leave?.type || '-'}</td>
                                             <td className="p-3">{d.leave?.hours || '-'}</td>
                                             <td className="p-3">
                                                 {!w.isLeaveOnly && (
                                                     <span className="font-bold text-blue-700">
                                                         {w.tag?.item} {w.tag?.area && `(${w.tag.area})`}
                                                     </span>
                                                 )}
                                             </td>
                                             <td className="p-3 text-xs text-gray-500">{d.leave?.reason || '-'}</td>
                                             <td className="p-3 text-xs text-gray-500">{!w.isLeaveOnly ? (w.tag?.note || '-') : '-'}</td>
                                             <td className="p-3">
                                                 <div className="flex items-center gap-2">
                                                     <span className={`px-2 py-1 rounded text-xs font-bold ${d.status==='缺公務單'?'bg-red-100 text-red-600':(d.status==='假別不符' || d.status==='異常公出' ? 'bg-orange-100 text-orange-600' : 'bg-green-100 text-green-600')}`}>
                                                         {(d.status === '正常' || d.status === '內勤' || (d.leave && !['缺公務單','假別不符','異常公出'].includes(d.status))) ? '同意' : d.status}
                                                     </span>
                                                     {!w.isLeaveOnly && w.tag && (
                                                         <button 
                                                            onClick={() => addToGoogleCalendar(d.date, w.slot, w.tag.item, w.tag.area, w.tag.note)}
                                                            className="text-[10px] bg-blue-50 text-blue-600 hover:bg-blue-100 border border-blue-200 px-2 py-1 rounded shadow-sm flex items-center gap-1 transition-colors"
                                                            title="將此行程加到我的 Google 行事曆"
                                                         >
                                                             <Calendar size={12}/> 加行事曆
                                                         </button>
                                                     )}
                                                 </div>
                                             </td>
                                         </tr>
                                     ));
                                })}
                                {scheduleData.length === 0 && <tr><td colSpan="9" className="p-8 text-center text-gray-400">本月無資料</td></tr>}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }

        function LeaveForm({ user, users, leaves, events, crud, settings, leaveTypes }) {
          const [form, setForm] = useState({ type: leaveTypes[0] || DEFAULT_LEAVE_TYPES[0], start:'', end:'', reason:'', deputyId:'' });
          const [hours, setHours] = useState(0);
          const [alerts, setAlerts] = useState([]);
          const [preciseTime, setPreciseTime] = useState(false); 
          const [isSubmitting, setIsSubmitting] = useState(false);

          // 🌟 核心新增：智慧尋找尚未填寫差單的排班任務
          const pendingExternalTasks = useMemo(() => {
              const todayStr = new Date().toISOString().split('T')[0];
              const groups = {};
              
              // 將所有事件依據群組(groupId)打包
              events.forEach(e => {
                  if (!groups[e.groupId]) groups[e.groupId] = { tag: null, people: [] };
                  if (e.type === 'tag') groups[e.groupId].tag = e;
                  if (e.type === 'person') groups[e.groupId].people.push(e);
              });

              const pending = [];
              Object.values(groups).forEach(g => {
                  if (!g.tag) return;
                  if (g.tag.date < todayStr) return; // 忽略過去的排班
                  
                  // 檢查是否為外勤 (使用全域變數 EXTERNAL_WORK_TAGS)
                  const isExternal = EXTERNAL_WORK_TAGS.includes(g.tag.item); 
                  if (!isExternal) return;

                  // 檢查這筆排班有沒有包含「目前的登入者」
                  const isMe = g.people.some(p => p.userId === user.uid || p.userId === user.docId || p.userName === user.name);
                  if (!isMe) return;

                  const d = g.tag.date; 
                  // 根據上下午設定建議的時間區間 (可根據實際上下班時間微調)
                  let startTime = `${d}T08:30`;
                  let endTime = `${d}T17:30`;
                  if (g.tag.slot === 'morning') { endTime = `${d}T12:30`; }
                  else if (g.tag.slot === 'afternoon') { startTime = `${d}T13:30`; }

                  // 檢查此人這一天是否已經有送出任何假單了 (排除被退回的)
                  const hasLeave = leaves.some(l => 
                      (l.requesterId === user.uid || l.requesterId === user.docId || l.requesterName === user.name) && 
                      l.start.startsWith(d) && 
                      l.status !== 'rejected'
                  );

                  // 如果排了班卻沒有假單，就加入待辦清單
                  if (!hasLeave) {
                      pending.push({
                          id: g.tag.groupId,
                          date: d,
                          slot: g.tag.slot,
                          item: g.tag.item,
                          area: g.tag.area,
                          suggestedStart: startTime,
                          suggestedEnd: endTime,
                          reason: `[${g.tag.item}] ${g.tag.area ? g.tag.area : ''} ${g.tag.note ? '- ' + g.tag.note : ''}`.trim()
                      });
                  }
              });
              // 依日期排序，最近的排在最上面
              return pending.sort((a,b) => a.date.localeCompare(b.date));
          }, [events, leaves, user]);

          useEffect(() => {
              if(form.start && form.end) {
                  const diff = (new Date(form.end)-new Date(form.start))/36e5;
                  setHours(Math.max(0, Math.round(diff*2)/2));
                  const startDate = form.start.split('T')[0];
                  const myEvents = events.filter(e => e.date === startDate && e.type === 'person' && e.userName === user.name);
                  const needsLeave = myEvents.some(e => {
                      const tagEv = events.find(t => t.groupId === e.groupId && t.type === 'tag');
                      return tagEv && EXTERNAL_WORK_TAGS.includes(tagEv.item);
                  });
                  const newAlerts = [];
                  if (needsLeave && !EXTERNAL_WORK_TAGS.some(t => form.type.includes(t)) && form.type !== '公假' && form.type !== '出差') {
                      newAlerts.push("⚠️ 注意：排班表顯示您當日有外勤行程，請確認假別是否正確。");
                  }
                  if (!needsLeave && (form.type === '出差' || form.type === '公假' || form.type === '公出')) {
                      newAlerts.push("⚠️ 提醒：排班表中當日似乎沒有您的外勤行程，請確認是否遺漏排班。");
                  }
                  setAlerts(newAlerts);
              }
          }, [form.start, form.end, form.type, events, user.name, settings.officialLeaveTypes]);

          const handleSubmit = async (e) => {
              e.preventDefault();
              setIsSubmitting(true);
              try {
                  await crud.createLeave({ ...form, requesterId: user.uid, requesterName: user.name, hours, status: 'pending', timestamp: new Date() });
                  
                  const deputy = users.find(u => (u.uid === form.deputyId || u.docId === form.deputyId));
                  if (deputy && deputy.email) {
                      openMailClient(
                          deputy.email, 
                          `[差勤通知] ${user.name} 申請職務代理`, 
                          `您好，\n\n${user.name} 申請了 ${form.type} (共 ${hours} 小時)。\n期間：${form.start.replace('T', ' ')} ~ ${form.end.replace('T', ' ')}\n事由：${form.reason}\n\n請登入系統確認代理。`
                      );
                  }

                  alert("申請已送出，並已嘗試開啟郵件軟體通知職務代理人。");
                  setForm({ type: leaveTypes[0] || DEFAULT_LEAVE_TYPES[0], start:'', end:'', reason:'', deputyId:'' });
                  setAlerts([]);
              } catch (e) {
                  alert("送出失敗，請稍後再試。");
              } finally {
                  setIsSubmitting(false);
              }
          };

          const busyIds = leaves.filter(l=>l.status==='approved' && l.start.startsWith(form.start?.split('T')[0])).map(l=>l.requesterName);
          const deputies = users.filter(u=>u.name!==user.name && !busyIds.includes(u.name));

          return (
            <div className="max-w-2xl mx-auto space-y-6">
               {/* 🌟 待辦外勤提示區塊 */}
               {pendingExternalTasks.length > 0 && (
                   <div className="bg-indigo-50 border border-indigo-200 rounded-lg p-5 shadow-sm">
                       <h3 className="font-bold text-indigo-800 mb-3 flex items-center gap-2">
                           <Briefcase size={18}/> 系統建議：您有未填寫的外勤排班
                       </h3>
                       <div className="space-y-3">
                           {pendingExternalTasks.map(task => (
                               <div key={task.id} className="bg-white p-3 rounded-lg border border-indigo-100 flex justify-between items-center shadow-sm">
                                   <div>
                                       <div className="font-bold text-gray-800 text-sm">
                                           {task.date} - <span className="text-indigo-600">{task.item}</span> {task.area && `(${task.area})`}
                                       </div>
                                       <div className="text-xs text-gray-500 mt-1">
                                           時間：{task.slot === 'morning' ? '上午 (預設 08:30-12:30)' : task.slot === 'afternoon' ? '下午 (預設 13:30-17:30)' : '整天 (預設 08:30-17:30)'}
                                       </div>
                                   </div>
                                   <button 
                                       onClick={(e) => {
                                           e.preventDefault();
                                           setForm(prev => ({
                                               ...prev, 
                                               type: '公出', 
                                               start: task.suggestedStart, 
                                               end: task.suggestedEnd, 
                                               reason: task.reason
                                           }));
                                           window.scrollTo({ top: 0, behavior: 'smooth' });
                                       }}
                                       className="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1.5 rounded text-xs font-bold transition shadow-sm flex items-center gap-1 shrink-0"
                                   >
                                       <ArrowRight size={14}/> 一鍵帶入
                                   </button>
                               </div>
                           ))}
                       </div>
                   </div>
               )}

               <div className="bg-white p-6 rounded-lg shadow-sm">
                   <div className="flex justify-between items-center mb-6">
                       <h2 className="text-xl font-bold flex items-center gap-2"><ClipboardList/> 差勤填寫</h2>
                       <div className="flex gap-2">
                            <span className="text-xs bg-yellow-100 text-yellow-800 px-2 py-1 rounded flex items-center gap-1"><Mail size={12}/> 自動開信</span>
                            <button onClick={()=>setPreciseTime(!preciseTime)} className="text-xs text-blue-600 border border-blue-200 px-2 py-1 rounded hover:bg-blue-50">
                                {preciseTime ? "切換為 30分 級距" : "切換為精確時間"}
                            </button>
                       </div>
                   </div>
                   {alerts.length > 0 && <div className="bg-orange-50 border border-orange-200 text-orange-800 p-3 rounded mb-4 text-sm font-bold">{alerts.map((a,i) => <div key={i} className="flex items-center gap-2"><AlertTriangle size={16}/> {a}</div>)}</div>}
                   <form onSubmit={handleSubmit} className="space-y-4">
                       <div>
                           <label className="text-xs font-bold text-gray-500 block mb-1">假別</label>
                           <select className="w-full border p-2 rounded" value={form.type} onChange={e=>setForm({...form, type:e.target.value})}>{leaveTypes.map(t=><option key={t} value={t}>{t}</option>)}</select>
                       </div>
                       <div className="grid grid-cols-2 gap-4">
                           <div><label className="text-xs font-bold text-gray-500 block mb-1">開始</label><input type="datetime-local" step={preciseTime ? "60" : "1800"} required className="w-full border p-2 rounded bg-gray-50 focus:bg-white" value={form.start} onChange={e=>setForm({...form, start:e.target.value})}/></div>
                           <div><label className="text-xs font-bold text-gray-500 block mb-1">結束</label><input type="datetime-local" step={preciseTime ? "60" : "1800"} required className="w-full border p-2 rounded bg-gray-50 focus:bg-white" value={form.end} onChange={e=>setForm({...form, end:e.target.value})}/></div>
                       </div>
                       <div className="text-right text-sm text-blue-600 font-bold">時數: {hours} hr</div>
                       <div><label className="text-xs font-bold text-gray-500 block mb-1">職務代理人</label><select className="w-full border p-2 rounded" required value={form.deputyId} onChange={e=>setForm({...form, deputyId:e.target.value})}><option value="">請選擇</option>{deputies.map(u=><option key={u.docId} value={u.docId}>{u.name}</option>)}</select></div>
                       <div><label className="text-xs font-bold text-gray-500 block mb-1">事由 (將自動帶入地點與備註)</label><textarea className="w-full border p-2 rounded h-20 bg-gray-50 focus:bg-white" required value={form.reason} onChange={e=>setForm({...form, reason:e.target.value})}/></div>
                       <button disabled={isSubmitting} className={`w-full bg-blue-600 text-white py-3 rounded font-bold transition shadow flex justify-center items-center gap-2 ${isSubmitting ? 'opacity-50 cursor-not-allowed' : 'hover:bg-blue-700'}`}>
                            {isSubmitting ? <><Loader2 className="animate-spin" size={20}/> 資料傳送中...</> : '送出申請 (自動通知)'}
                       </button>
                   </form>
               </div>
            </div>
          );
        }

        function ApprovalView({ leaves, currentUser, crud, users }) {
          const [processingId, setProcessingId] = useState(null);

          const exportCSV = () => {
              let csv = "\uFEFF申請人,假別,開始,結束,時數,狀態\n";
              leaves.forEach(l => csv += `${l.requesterName},${l.type},${l.start},${l.end},${l.hours},${l.status}\n`);
              const link = document.createElement("a");
              link.href = encodeURI("data:text/csv;charset=utf-8,"+csv);
              link.download = "leave_report.csv";
              link.click();
          };
          
          const pendingMyDeputy = leaves.filter(l => (l.deputyId === currentUser.uid || l.deputyId === (currentUser.email || '').toLowerCase()) && l.status === 'pending');
          const pendingLeader = (currentUser.role === 'leader' || currentUser.role === 'admin') ? leaves.filter(l => l.status === 'deputy_signed') : [];

          const handleDeputyAgree = async (leave) => {
              if (processingId) return;
              setProcessingId(leave.id);
              try {
                  await crud.updateLeave(leave.id, { status: 'deputy_signed' });
                  
                  const leaders = users.filter(u => u.role === 'leader' || u.role === 'admin');
                  const leaderEmails = leaders.map(u => u.email).filter(e => e).join(',');
                  
                  if (leaderEmails) {
                      openMailClient(
                          leaderEmails, 
                          `[差勤待審] ${leave.requesterName} 的假單等待核准`, 
                          `組長您好，\n\n職務代理人 (${currentUser.name}) 已確認代理 ${leave.requesterName} 的工作。\n\n假別：${leave.type}\n時間：${leave.start} ~ ${leave.end}\n\n請登入系統進行最終核准。`
                      );
                  }
              } catch(e) {
                  alert("操作失敗");
              } finally {
                  setProcessingId(null);
              }
          };

          const handleLeaderApprove = async (leave) => {
              if (processingId) return;
              setProcessingId(leave.id);
              try {
                  await crud.updateLeave(leave.id, { status: 'approved', approverId: currentUser.uid });
                  
                  const requester = users.find(u => u.uid === leave.requesterId || u.docId === leave.requesterId || u.name === leave.requesterName); 
                  if (requester && requester.email) {
                      openMailClient(
                          requester.email, 
                          `[核准通知] 您的假單已通過`, 
                          `恭喜，您的 ${leave.type} 申請 (${leave.start} ~ ${leave.end}) 已由組長核准完成。`
                      );
                  }
              } catch(e) {
                  alert("操作失敗");
              } finally {
                  setProcessingId(null);
              }
          };

          const handleReject = async (leave) => {
              if (processingId) return;
              setProcessingId(leave.id);
              try {
                  await crud.updateLeave(leave.id, { status: 'rejected', approverId: currentUser.uid });
              } catch(e) {
                  alert("操作失敗");
              } finally {
                  setProcessingId(null);
              }
          }

          const StatusStep = ({ status }) => {
              const step1 = status !== 'pending' ? 'text-green-600 font-bold' : 'text-gray-400';
              const step2 = status === 'approved' ? 'text-green-600 font-bold' : (status === 'deputy_signed' ? 'text-blue-600 animate-pulse font-bold' : 'text-gray-400');
              
              return (
                  <div className="flex items-center text-xs gap-1 bg-gray-100 px-2 py-1 rounded-full">
                      <span className={`flex items-center ${step1}`}>1. 職代 {status !== 'pending' ? '✅' : '⏳'}</span>
                      <span className="text-gray-300">→</span>
                      <span className={`flex items-center ${step2}`}>2. 主管 {status === 'approved' ? '✅' : '⏳'}</span>
                  </div>
              );
          }

          return (
            <div className="max-w-4xl mx-auto space-y-8">
               <div className="flex justify-between items-center"><h2 className="text-xl font-bold flex items-center gap-2"><CheckCircle/> 差單審核</h2><button onClick={exportCSV} className="bg-green-600 text-white px-3 py-1.5 rounded text-sm flex items-center gap-1"><FileSpreadsheet size={16}/> 匯出報表</button></div>
               
               <div className="bg-white rounded shadow overflow-hidden border-t-4 border-blue-500">
                   <div className="bg-blue-50 px-4 py-3 border-b border-blue-100 font-bold text-blue-800 flex items-center gap-2">
                       <User size={18}/> 第一關：待我簽核 (我是職代)
                   </div>
                   {pendingMyDeputy.length===0 ? <div className="p-8 text-center text-gray-400 text-sm">無待辦事項，您目前沒有需要代理的案件。</div> : <table className="w-full text-sm text-left"><thead className="bg-gray-50 border-b text-gray-500"><tr><th className="p-3">申請人</th><th className="p-3">項目</th><th className="p-3">進度狀態</th><th className="p-3">操作</th></tr></thead><tbody>{pendingMyDeputy.map(l => (
                       <tr key={l.id} className="border-b last:border-0 hover:bg-gray-50">
                           <td className="p-3 font-bold text-gray-700">{l.requesterName}</td>
                           <td className="p-3"><span className="font-bold text-blue-600">{l.type}</span><div className="text-xs text-gray-500 mt-1">{l.start.replace('T',' ')} <br/>~ {l.end.replace('T',' ')}</div></td>
                           <td className="p-3"><StatusStep status={l.status}/></td>
                           <td className="p-3 flex gap-2">
                               <button 
                                   onClick={()=>handleDeputyAgree(l)} 
                                   disabled={processingId === l.id}
                                   className={`text-white font-bold text-xs bg-blue-500 px-3 py-1.5 rounded shadow-sm flex items-center gap-1 ${processingId === l.id ? 'opacity-50 cursor-not-allowed' : 'hover:bg-blue-600'}`}
                               >
                                   {processingId === l.id ? <Loader2 className="animate-spin" size={12}/> : <Mail size={12}/>} 同意並通知
                               </button>
                               <button 
                                   onClick={()=>handleReject(l)} 
                                   disabled={processingId === l.id}
                                   className={`text-red-600 font-bold text-xs bg-red-50 px-3 py-1.5 rounded ${processingId === l.id ? 'opacity-50 cursor-not-allowed' : 'hover:bg-red-100'}`}
                               >
                                   {processingId === l.id ? '...' : '退回'}
                               </button>
                           </td>
                       </tr>
                   ))}</tbody></table>}
               </div>

               {(currentUser.role === 'leader' || currentUser.role === 'admin') && 
               <div className="bg-white rounded shadow overflow-hidden border-t-4 border-orange-500">
                   <div className="bg-orange-50 px-4 py-3 border-b border-orange-100 font-bold text-orange-800 flex items-center gap-2">
                       <CheckCircle size={18}/> 第二關：待最終核准 (組長權限)
                   </div>
                   {pendingLeader.length===0 ? <div className="p-8 text-center text-gray-400 text-sm">無待審核項目</div> : <table className="w-full text-sm text-left"><thead className="bg-gray-50 border-b text-gray-500"><tr><th className="p-3">申請人</th><th className="p-3">項目</th><th className="p-3">進度狀態</th><th className="p-3">操作</th></tr></thead><tbody>{pendingLeader.map(l => (
                       <tr key={l.id} className="border-b last:border-0 hover:bg-gray-50">
                           <td className="p-3 font-bold text-gray-700">{l.requesterName}</td>
                           <td className="p-3"><span className="font-bold text-gray-800">{l.type}</span><div className="text-xs text-gray-500 mt-1">{l.start.replace('T',' ')} <br/>~ {l.end.replace('T',' ')}</div></td>
                           <td className="p-3"><StatusStep status={l.status}/></td>
                           <td className="p-3 flex gap-2">
                               <button 
                                   onClick={()=>handleLeaderApprove(l)} 
                                   disabled={processingId === l.id}
                                   className={`text-white font-bold text-xs bg-green-600 px-3 py-1.5 rounded shadow-sm flex items-center gap-1 ${processingId === l.id ? 'opacity-50 cursor-not-allowed' : 'hover:bg-green-700'}`}
                               >
                                   {processingId === l.id ? <Loader2 className="animate-spin" size={12}/> : <Mail size={12}/>} 核准並通知
                               </button>
                               <button 
                                   onClick={()=>handleReject(l)} 
                                   disabled={processingId === l.id}
                                   className={`text-red-600 font-bold text-xs bg-red-50 px-3 py-1.5 rounded ${processingId === l.id ? 'opacity-50 cursor-not-allowed' : 'hover:bg-red-100'}`}
                               >
                                   {processingId === l.id ? '...' : '駁回'}
                               </button>
                           </td>
                       </tr>
                   ))}</tbody></table>}
               </div>}
            </div>
          );
        }

        function MembersView({ db, users, currentUser, roleNames }) {
            const isAdmin = currentUser && currentUser.role === 'admin';
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [editUser, setEditUser] = useState(null);
            
            // 🌟 新增：一鍵匯入預設名單功能
            const handleImportPredefined = async () => {
                if(!confirm("要將系統內建的預設名單(國裕, 湘怡等...)直接匯入資料庫嗎？\n這樣您馬上就能幫他們排班，不用等他們登入！")) return;
                try {
                    for(const p of PREDEFINED_USERS) {
                        const docId = p.email.toLowerCase();
                        const exists = users.find(u => u.docId === docId);
                        if (!exists) {
                            await setDoc(doc(db, 'artifacts', 'kpptjawork', 'public', 'data', 'user_profiles', docId), {
                                uid: docId, 
                                email: p.email,
                                name: p.name,
                                role: p.role,
                                initials: p.initials,
                                color: p.color,
                                borderColor: p.borderColor,
                                usePhoto: false,
                                avatarUrl: ''
                            });
                        }
                    }
                    alert("預設名單匯入完成！您可以去排班日曆了。");
                } catch (e) {
                    alert("匯入失敗: " + e.message);
                }
            };

            const handleSave = async (userData) => {
                try {
                    const targetDocId = userData.docId || (userData.email ? userData.email.toLowerCase() : userData.name); 
                    const dataToSave = { ...userData };
                    delete dataToSave.docId; // 移除內部屬性
                    await setDoc(doc(db, 'artifacts', 'kpptjawork', 'public', 'data', 'user_profiles', targetDocId), dataToSave, { merge: true });
                    setIsModalOpen(false);
                    setEditUser(null);
                } catch (e) {
                    alert("儲存失敗: " + e.message);
                }
            };

            const handleDelete = async (docId) => {
                if(confirm("確定要刪除此成員嗎？")) {
                    try {
                        await deleteDoc(doc(db, 'artifacts', 'kpptjawork', 'public', 'data', 'user_profiles', docId));
                    } catch (e) {
                        alert("刪除失敗: " + e.message);
                    }
                }
            };

            const openAdd = () => {
                setEditUser(null);
                setIsModalOpen(true);
            };

            const openEdit = (u) => {
                setEditUser(u);
                setIsModalOpen(true);
            };

            return (
                <div className="max-w-5xl mx-auto space-y-6">
                    <div className="flex flex-col md:flex-row justify-between items-center bg-white p-4 rounded shadow-sm gap-4">
                        <h2 className="text-xl font-bold flex items-center gap-2"><Users/> 成員管理</h2>
                        {isAdmin && (
                            <div className="flex gap-2">
                                <button onClick={handleImportPredefined} className="bg-purple-100 text-purple-700 px-4 py-2 rounded text-sm font-bold flex items-center gap-2 hover:bg-purple-200 transition">
                                    <Users size={16}/> 一鍵匯入預設名單
                                </button>
                                <button onClick={openAdd} className="bg-blue-600 text-white px-4 py-2 rounded text-sm font-bold flex items-center gap-2 hover:bg-blue-700 transition">
                                    <Plus size={16}/> 新增成員
                                </button>
                            </div>
                        )}
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                        {users.map(u => (
                            <div key={u.docId} className="bg-white p-4 rounded-lg shadow-sm border border-gray-100 flex items-center gap-3 relative group">
                                <UserAvatar user={u} size="w-12 h-12" textSize="text-base" />
                                <div className="flex-1 overflow-hidden">
                                    <div className="font-bold text-gray-800 text-lg truncate">{u.name}</div>
                                    <div className="text-xs text-gray-400 truncate mb-1">{u.email || '未綁定 Email'}</div>
                                    <div className="flex gap-2 mt-1">
                                        <span className={`text-xs px-2 py-0.5 rounded-full font-medium ${u.role==='admin'?'bg-purple-100 text-purple-800':(u.role==='leader'?'bg-blue-100 text-blue-800':'bg-gray-100 text-gray-600')}`}>
                                            {roleNames[u.role] || u.role}
                                        </span>
                                    </div>
                                </div>
                                {isAdmin && (
                                    <div className="absolute top-2 right-2 hidden group-hover:flex gap-1">
                                        <button onClick={()=>openEdit(u)} className="p-1.5 bg-gray-100 rounded text-gray-500 hover:bg-blue-100 hover:text-blue-600"><Edit size={14}/></button>
                                        <button onClick={()=>handleDelete(u.docId)} className="p-1.5 bg-gray-100 rounded text-gray-500 hover:bg-red-100 hover:text-red-600"><Trash2 size={14}/></button>
                                    </div>
                                )}
                            </div>
                        ))}
                    </div>

                    {isModalOpen && (
                        <MemberEditModal 
                            user={editUser} 
                            onClose={()=>{setIsModalOpen(false); setEditUser(null);}} 
                            onSave={handleSave} 
                            roleNames={roleNames}
                        />
                    )}
                </div>
            ); 
        }

        function MemberEditModal({ user, onClose, onSave, roleNames }) {
            const [form, setForm] = useState(user || {
                name: '', email: '', role: 'staff', initials: '', color: 'bg-gray-200', borderColor: '#e5e7eb', usePhoto: false, avatarUrl: ''
            });

            return (
                <div className="fixed inset-0 bg-black/60 z-[70] flex items-center justify-center p-4 animate-in fade-in" onClick={onClose}>
                    <div className="bg-white rounded-xl w-full max-w-md shadow-2xl p-6" onClick={e=>e.stopPropagation()}>
                        <h3 className="font-bold text-lg mb-4 text-gray-800">{user ? '編輯成員' : '新增成員'}</h3>
                        <div className="space-y-4">
                            <div>
                                <label className="block text-xs font-bold text-gray-500 mb-1">姓名</label>
                                <input 
                                    className="w-full border p-2 rounded" 
                                    value={form.name} 
                                    onChange={e=>setForm({...form, name:e.target.value, initials: e.target.value.slice(0,1)})} 
                                    placeholder="輸入姓名"
                                />
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-gray-500 mb-1">Email (通知用)</label>
                                <input 
                                    className="w-full border p-2 rounded" 
                                    value={form.email} 
                                    onChange={e=>setForm({...form, email:e.target.value})} 
                                    placeholder="example@mail.com"
                                />
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-gray-500 mb-1">職稱 (角色權限)</label>
                                <select className="w-full border p-2 rounded bg-white" value={form.role} onChange={e=>setForm({...form, role:e.target.value})}>
                                    <option value="staff">{roleNames['staff']} (一般權限)</option>
                                    <option value="leader">{roleNames['leader']} (可審核)</option>
                                    <option value="admin">{roleNames['admin']} (完全控制)</option>
                                </select>
                            </div>
                            <div className="grid grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-xs font-bold text-gray-500 mb-1">顯示單字</label>
                                    <input className="w-full border p-2 rounded" value={form.initials} onChange={e=>setForm({...form, initials:e.target.value})} maxLength={1}/>
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-gray-500 mb-1">預設底色</label>
                                    <div className="flex gap-1 h-9 items-center">
                                        {['bg-red-200','bg-blue-200','bg-green-200','bg-yellow-200','bg-purple-200'].map(c=>(
                                            <div key={c} onClick={()=>setForm({...form, color:c})} className={`w-6 h-6 rounded-full cursor-pointer border ${c} ${form.color===c?'ring-2 ring-black':''}`}></div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                            <div className="pt-2 flex gap-3">
                                <button onClick={onClose} className="flex-1 py-2 text-gray-500 hover:bg-gray-100 rounded">取消</button>
                                <button onClick={()=>onSave(form)} className="flex-1 py-2 bg-blue-600 text-white font-bold rounded hover:bg-blue-700">儲存</button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function ManagementView({ tags }) {
            const [newWork, setNewWork] = useState('');
            const [newArea, setNewArea] = useState('');
            return (
                <div className="max-w-4xl mx-auto space-y-6">
                    <h2 className="text-xl font-bold flex items-center gap-2"><List/> 項目管理</h2>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div className="bg-white p-6 rounded-lg shadow-sm border"><h3 className="font-bold text-lg mb-4 text-blue-700">工作項目</h3><div className="flex gap-2 mb-4"><input className="border rounded px-3 py-2 text-sm flex-1" placeholder="新增..." value={newWork} onChange={e=>setNewWork(e.target.value)} /><button onClick={()=>{tags.handleAddTag('work', newWork); setNewWork('')}} className="bg-blue-600 text-white px-4 py-2 rounded text-sm">新增</button></div><div className="flex flex-wrap gap-2">{tags.workTags.map(tag => (<div key={tag} className="bg-blue-50 text-blue-800 px-3 py-1.5 rounded-full text-sm border flex items-center gap-1">{tag}<button onClick={()=>tags.handleDeleteTag('work', tag)} className="text-blue-400 hover:text-red-500"><X size={14}/></button></div>))}</div></div>
                        <div className="bg-white p-6 rounded-lg shadow-sm border"><h3 className="font-bold text-lg mb-4 text-green-700">轄區</h3><div className="flex gap-2 mb-4"><input className="border rounded px-3 py-2 text-sm flex-1" placeholder="新增..." value={newArea} onChange={e=>setNewArea(e.target.value)} /><button onClick={()=>{tags.handleAddTag('area', newArea); setNewArea('')}} className="bg-green-600 text-white px-4 py-2 rounded text-sm">新增</button></div><div className="flex flex-wrap gap-2">{tags.areaTags.map(tag => (<div key={tag} className="bg-green-50 text-green-800 px-3 py-1.5 rounded-full text-sm border flex items-center gap-1">{tag}<button onClick={()=>tags.handleDeleteTag('area', tag)} className="text-green-400 hover:text-red-500"><X size={14}/></button></div>))}</div></div>
                    </div>
                </div>
            );
        }

        function ProfileView({ user, onSave, roleNames }) {
            const [p, setP] = useState({ 
                initials: user.initials || '', 
                color: user.color || 'bg-gray-200', 
                email: user.email || '',
                password: '',
                borderColor: user.borderColor || '#e5e7eb',
                usePhoto: user.usePhoto || false,
                avatarUrl: user.avatarUrl || ''
            });
            const [isSubmitting, setIsSubmitting] = useState(false);

            const handleImageUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        setP({ ...p, avatarUrl: reader.result });
                    };
                    reader.readAsDataURL(file);
                }
            };

            const handleSubmit = async () => {
                setIsSubmitting(true);
                await onSave(p);
                setIsSubmitting(false);
            };

            return (
                <div className="max-w-xl mx-auto bg-white p-8 rounded-lg shadow-sm">
                    <h2 className="text-xl font-bold mb-6 flex items-center gap-2"><User/> 個人設定</h2>
                    <div className="space-y-6">
                        <div className="flex flex-col items-center gap-4 bg-gray-50 p-4 rounded-lg border border-gray-100">
                            <label className="text-sm font-bold text-gray-700">頭像預覽</label>
                            <UserAvatar user={{ ...user, ...p }} size="w-20 h-20" textSize="text-2xl" />
                            
                            <div className="flex items-center gap-4 w-full justify-center">
                                <label className="flex items-center gap-2 cursor-pointer bg-white px-4 py-2 rounded border shadow-sm hover:bg-gray-50">
                                    <Camera size={16} />
                                    <span className="text-sm">上傳照片</span>
                                    <input type="file" accept="image/*" className="hidden" onChange={handleImageUpload} />
                                </label>
                                <label className="flex items-center gap-2 cursor-pointer select-none">
                                    <input 
                                        type="checkbox" 
                                        className="w-4 h-4 text-blue-600 rounded focus:ring-blue-500"
                                        checked={p.usePhoto} 
                                        onChange={e=>setP({...p, usePhoto:e.target.checked})} 
                                    />
                                    <span className="text-sm font-medium text-gray-700">使用照片</span>
                                </label>
                            </div>
                        </div>

                        <div className="grid grid-cols-2 gap-4">
                            <div>
                                <label className="block text-sm font-bold text-gray-600 mb-1">外框顏色</label>
                                <div className="flex gap-2 items-center">
                                    <input 
                                        type="color" 
                                        className="h-9 w-full rounded border cursor-pointer"
                                        value={p.borderColor} 
                                        onChange={e=>setP({...p, borderColor:e.target.value})} 
                                    />
                                </div>
                            </div>
                            <div>
                                <label className="block text-sm font-bold text-gray-600 mb-1">顯示單字</label>
                                <input className="border p-2 rounded w-full h-9" maxLength={1} value={p.initials} onChange={e=>setP({...p, initials:e.target.value})} />
                            </div>
                        </div>

                        <div>
                            <label className="block text-sm font-bold text-gray-600 mb-1">Email (用於接收通知)</label>
                            <input className="border p-2 rounded w-full" type="email" placeholder="輸入您的 Email" value={p.email} onChange={e=>setP({...p, email:e.target.value})} />
                        </div>

                        <div>
                            <label className="block text-sm font-bold text-gray-600 mb-1">頭像背景色 (未用照片時)</label>
                            <div className="flex gap-2 flex-wrap">
                                {['bg-red-200', 'bg-orange-200', 'bg-yellow-200', 'bg-green-200', 'bg-blue-200', 'bg-indigo-200', 'bg-purple-200', 'bg-pink-200', 'bg-gray-200'].map(c => (
                                    <div key={c} onClick={()=>setP({...p, color:c})} className={`w-8 h-8 rounded-full cursor-pointer border-2 ${c} ${p.color===c?'border-black':'border-transparent'}`}></div>
                                ))}
                            </div>
                        </div>

                        <div>
                            <label className="block text-sm font-bold text-gray-600 mb-1">更改密碼</label>
                            <input className="border p-2 rounded w-full" type="password" placeholder="若不更改請留空" value={p.password} onChange={e=>setP({...p, password:e.target.value})} />
                        </div>
                        
                        <div className="pt-4">
                            <button 
                                onClick={handleSubmit} 
                                disabled={isSubmitting}
                                className={`w-full bg-blue-600 text-white py-2 rounded font-bold transition flex items-center justify-center gap-2 ${isSubmitting ? 'opacity-50 cursor-not-allowed' : 'hover:bg-blue-700'}`}
                            >
                                {isSubmitting ? <><Loader2 className="animate-spin" size={18} /> 更新中...</> : '更新個人資料'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        function SettingsView({ settings, user, leaveTypes, tags, handleManageLeaveTypes, onSave, roleNames, onUpdateRoleNames }) {
            const [areaC, setAreaC] = useState(settings.areaColors || DEFAULT_AREA_COLORS);
            const [officialLeaves, setOfficialLeaves] = useState(settings.officialLeaveTypes || DEFAULT_LEAVE_TYPES);
            const [newLeave, setNewLeave] = useState('');
            const [newArea, setNewArea] = useState(''); 
            const [localRoleNames, setLocalRoleNames] = useState(roleNames);
            const [isSettingsSaved, setIsSettingsSaved] = useState(false); 

            const colors = [{l:'紅',c:"bg-red-100 text-red-800"},{l:'橘',c:"bg-orange-100 text-orange-800"},{l:'黃',c:"bg-yellow-100 text-yellow-800"},{l:'綠',c:"bg-green-100 text-green-800"},{l:'藍',c:"bg-blue-100 text-blue-800"},{l:'紫',c:"bg-purple-100 text-purple-800"},{l:'粉',c:"bg-pink-100 text-pink-800"},{l:'灰',c:"bg-gray-100 text-gray-800"}];

            const handleColorChange = (area, colorClass) => {
                const existingArea = Object.keys(areaC).find(key => areaC[key] === colorClass && key !== area);
                if (existingArea) {
                    alert(`此顏色已被 [${existingArea}] 使用，請選擇其他顏色以免混淆。`);
                    return;
                }
                setAreaC({...areaC, [area]: colorClass});
            };
            
            const toggleOfficialLeave = (type) => {
                if(officialLeaves.includes(type)) setOfficialLeaves(prev => prev.filter(t => t !== type));
                else setOfficialLeaves(prev => [...prev, type]);
            };
            
            const handleAddAreaWithColor = (area) => {
                tags.handleAddTag('area', area);
                setNewArea('');
            }

            const handleSaveSettings = () => {
                onUpdateRoleNames(localRoleNames);
                onSave({...settings, areaColors: areaC, officialLeaveTypes: officialLeaves});
                setIsSettingsSaved(true);
                setTimeout(() => setIsSettingsSaved(false), 2000);
            };

            return (
                <div className="max-w-3xl mx-auto space-y-8">
                    <div className="bg-white p-6 rounded shadow-sm">
                        <h2 className="text-xl font-bold mb-4 flex items-center gap-2"><Shield/> 職稱顯示設定</h2>
                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                            <div>
                                <label className="block text-xs font-bold text-gray-500 mb-1">職員 顯示名稱</label>
                                <input className="border rounded p-2 w-full text-sm" value={localRoleNames.staff} onChange={e=>setLocalRoleNames({...localRoleNames, staff: e.target.value})} />
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-gray-500 mb-1">主管 顯示名稱</label>
                                <input className="border rounded p-2 w-full text-sm" value={localRoleNames.leader} onChange={e=>setLocalRoleNames({...localRoleNames, leader: e.target.value})} />
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-gray-500 mb-1">管理員 顯示名稱</label>
                                <input className="border rounded p-2 w-full text-sm" value={localRoleNames.admin} onChange={e=>setLocalRoleNames({...localRoleNames, admin: e.target.value})} />
                            </div>
                        </div>
                        <p className="text-xs text-gray-400 mt-2">* 這裡修改的名稱將套用至全系統顯示。</p>
                    </div>

                    <div className="bg-white p-6 rounded shadow-sm"><h2 className="text-xl font-bold mb-4 flex items-center gap-2"><Palette/> 轄區設定 (新增/顏色)</h2><div className="flex gap-2 mb-6"><input className="border rounded px-3 py-2 text-sm flex-1" placeholder="輸入新轄區..." value={newArea} onChange={e=>setNewArea(e.target.value)} /><button onClick={()=>handleAddAreaWithColor(newArea)} className="bg-green-600 text-white px-4 py-2 rounded text-sm font-bold">新增轄區</button></div><div className="grid grid-cols-2 md:grid-cols-3 gap-4">{tags.areaTags.map(area => (<div key={area} className="relative group"><button className={`w-full text-left px-3 py-2 rounded border flex justify-between items-center ${areaC[area] || "bg-gray-100 text-gray-800"}`}><span className="font-bold">{area}</span><div className="w-4 h-4 rounded-full border border-black/20 bg-current opacity-50"></div></button><div className="absolute top-full left-0 z-10 bg-white shadow-lg border p-2 rounded hidden group-hover:flex gap-1 flex-wrap w-48">{colors.map(co => (<div key={co.c} onClick={()=>handleColorChange(area, co.c)} className={`w-6 h-6 rounded cursor-pointer border ${co.c.split(' ')[0]}`} title={co.l}></div>))}</div></div>))}</div></div>
                    <div className="bg-white p-6 rounded shadow-sm"><h2 className="text-xl font-bold mb-4 flex items-center gap-2"><List/> 假別設定 & 屬性</h2><div className="flex gap-2 mb-4"><input className="border rounded px-3 py-2 text-sm flex-1" placeholder="輸入新假別..." value={newLeave} onChange={e=>setNewLeave(e.target.value)} /><button onClick={()=>{handleManageLeaveTypes('add', newLeave); setNewLeave('')}} className="bg-blue-600 text-white px-4 py-2 rounded text-sm font-bold">新增</button></div><div className="flex flex-wrap gap-3">{leaveTypes.map(t => (<div key={t} className="flex items-center gap-2 bg-gray-50 border px-3 py-2 rounded-lg text-sm"><span className="font-bold text-gray-700">{t}</span><label className="flex items-center gap-1 text-xs text-gray-500 cursor-pointer"><input type="checkbox" checked={officialLeaves.includes(t)} onChange={()=>toggleOfficialLeave(t)}/> 公務</label><button onClick={()=>handleManageLeaveTypes('delete', t)} className="text-gray-400 hover:text-red-500 ml-1"><X size={14}/></button></div>))}</div>
                    <button 
                        onClick={handleSaveSettings} 
                        className={`mt-6 px-6 py-3 rounded shadow transition font-bold flex items-center justify-center gap-2 w-full ${isSettingsSaved ? 'bg-green-600 hover:bg-green-700 text-white' : 'bg-slate-800 hover:bg-slate-900 text-white'}`}
                    >
                        {isSettingsSaved ? <><CheckCircle size={18}/> 設定已儲存！</> : '儲存系統設定'}
                    </button>
                    </div>
                </div>
            );
        }

        // 極簡版登入畫面
        function LoginScreen({ auth }) {
            const [isLoggingIn, setIsLoggingIn] = useState(false);

            const handleGoogleLogin = async () => {
                if (!auth) {
                    alert("Firebase 尚未連線完成，請稍後再試。");
                    return;
                }
                setIsLoggingIn(true);
                const provider = new GoogleAuthProvider();
                try {
                    await signInWithPopup(auth, provider);
                } catch (error) {
                    console.error("Google Sign-In Error", error);
                    alert("登入被中斷或發生錯誤，請重試。\n詳細訊息: " + error.message);
                    setIsLoggingIn(false);
                }
            };

            return (
                <div className="min-h-screen bg-slate-100 flex items-center justify-center p-4">
                    <div className="bg-white w-full max-w-sm p-8 rounded-xl shadow-lg text-center">
                        <div className="w-16 h-16 bg-blue-600 rounded-xl mx-auto mb-4 flex items-center justify-center text-white"><Calendar size={32}/></div>
                        <h1 className="text-2xl font-bold text-gray-800 mb-1">差勤排班系統</h1>
                        <p className="text-gray-400 text-sm mb-8">企業內部專用版本</p>
                        
                        <div className="space-y-4">
                            <button 
                                onClick={handleGoogleLogin}
                                disabled={isLoggingIn}
                                className="w-full py-3.5 rounded-lg font-bold bg-white border-2 border-gray-200 text-gray-700 transition-all flex items-center justify-center gap-3 hover:bg-gray-50 shadow-sm disabled:opacity-50"
                            >
                                {isLoggingIn ? (
                                    <Loader2 className="animate-spin text-blue-600" size={20}/>
                                ) : (
                                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" className="w-5 h-5"/>
                                )}
                                <span>{isLoggingIn ? '正在驗證帳號...' : '使用 Google 帳號登入'}</span>
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // --- Render Main Application ---
        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
