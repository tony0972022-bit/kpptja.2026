<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>差勤排班系統</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Babel for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Import Map for ES Modules -->
    <script type="importmap">
        {
            "imports": {
                "react": "https://esm.sh/react@18.2.0",
                "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
                "lucide-react": "https://esm.sh/lucide-react@0.292.0?deps=react@18.2.0",
                "firebase/app": "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js",
                "firebase/analytics": "https://www.gstatic.com/firebasejs/11.6.1/firebase-analytics.js"
            }
        }
    </script>
</head>
<body class="bg-gray-50">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useMemo, useRef } from 'react';
        import { createRoot } from 'react-dom/client';
        import { initializeApp } from 'firebase/app';
        import { getAnalytics } from 'firebase/analytics';
        import { 
          getFirestore, collection, addDoc, query, where, onSnapshot, 
          updateDoc, doc, deleteDoc, orderBy, setDoc, getDoc 
        } from 'firebase/firestore';
        import { 
          getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, signInAnonymously, signInWithCustomToken, GoogleAuthProvider, signInWithPopup
        } from 'firebase/auth';
        import { 
          Calendar, User, Users, ClipboardList, LogOut, Plus, CheckCircle, XCircle, AlertCircle,
          Menu, Settings, Sun, CloudRain, Briefcase, LayoutDashboard,
          Sparkles, MapPin, Tag, WifiOff, FileSpreadsheet, Calculator, X, ChevronLeft, ChevronRight,
          Clock, RefreshCw, Trash2, List, AlertTriangle, ArrowRight, Lock, Palette, Edit, FileText, Info, Edit2, Play, Square,
          Image as ImageIcon, Camera, Moon, SidebarClose, SidebarOpen, Shield, UserCog, Loader2, CalendarPlus, Check, Clock4, PieChart, Trash, Megaphone, Flag
        } from 'lucide-react';

        // --- Firebase 綁定設定 ---
        const MANUAL_CONFIG = {
            apiKey: "AIzaSyBQ6ttl2QlbQbM4lO_faSEyIK1EVZy5jH4",
            authDomain: "kpptjawork.firebaseapp.com",
            projectId: "kpptjawork",
            storageBucket: "kpptjawork.firebasestorage.app",
            messagingSenderId: "1082378001168",
            appId: "1:1082378001168:web:fc12acdeed9ebece762395",
            measurementId: "G-48TSVTHBDM"
        };
        const APP_ID = 'kpptjawork';
        // -----------------------------------------------------------

        // --- Global Constants ---
        const WEATHER_LOCATIONS = [
          { location: '高雄', icon: <Sun className="text-orange-500" />, temp: '29°C' },
          { location: '屏東', icon: <Sun className="text-yellow-500" />, temp: '30°C' },
          { location: '台東', icon: <CloudRain className="text-blue-400" />, temp: '26°C' },
          { location: '澎湖', icon: <Sun className="text-orange-400" />, temp: '27°C' },
        ];

        const TAIWAN_HOLIDAYS_2026 = {
            "2026-01-01": "元旦", "2026-02-17": "除夕", "2026-02-18": "春節",
            "2026-02-19": "春節", "2026-02-20": "春節", "2026-02-28": "二二八",
            "2026-04-04": "兒童節", "2026-04-05": "清明節", "2026-06-19": "端午節",
            "2026-09-26": "中秋節", "2026-10-10": "國慶日"
        };

        const DEFAULT_LEAVE_TYPES = [
          "出差", "公出", "事假", "公假", "病假", "休假", "補休", 
          "加班申請", "喪假", "生理假", "家庭照顧假", "婚假", "產假", "產前假", "陪產假", "榮譽假"
        ];

        const DEFAULT_ROLE_NAMES = {
            staff: '專員',
            leader: '組長',
            admin: '管理員'
        };

        const EXTERNAL_WORK_TAGS = ["訪視", "出差", "受訓", "開會", "公出", "專案報告", "大宗"];
        const DEFAULT_WORK_TAGS = ["審查", "訪視", "成效", "試用", "OFF", "專案報告", "大宗", "月報"];
        const DEFAULT_AREA_TAGS = ["高雄", "澎湖", "台東", "屏東", "就業通", "訓就", "分署"];

        const DEFAULT_ROTATION_RULES = [
          { id: 'visit', name: '澎東訪視', matchTag: '訪視', order: ['湘怡', '國裕', '姿云', '秋媚', '凱宇', '怡倫'] },
          { id: 'project', name: '專案報告', matchTag: '專案報告', order: ['怡倫', '湘怡', '國裕', '姿云', '凱宇', '秋媚'] },
          { id: 'large', name: '大宗', matchTag: '大宗', order: ['湘怡', '國裕', '怡倫', '秋媚', '凱宇', '姿云'] },
          { id: 'monthly', name: '月報', matchTag: '月報', order: ['秋媚', '凱宇', '姿云', '怡倫', '湘怡'] },
        ];

        const TIME_SLOTS = [
            { id: 'morning', label: '上午', color: 'bg-sky-100 text-sky-900 border-sky-200' },
            { id: 'afternoon', label: '下午', color: 'bg-sky-200 text-sky-950 border-sky-300' },
            { id: 'all_day', label: '整天', color: 'bg-sky-600 text-white border-sky-700' },
        ];

        const DEFAULT_AREA_COLORS = {
            "高雄": "bg-red-100 text-red-800",
            "澎湖": "bg-orange-100 text-orange-800",
            "台東": "bg-green-100 text-green-800",
            "屏東": "bg-yellow-100 text-yellow-800",
            "就業通": "bg-purple-100 text-purple-800",
            "訓就": "bg-pink-100 text-pink-800",
            "分署": "bg-gray-100 text-gray-800"
        };

        const PREDEFINED_USERS = [
            { email: 'kaiyu097@gmail.com', name: '凱宇', role: 'admin', initials: '宇', color: 'bg-purple-200', borderColor: '#a855f7' },
            { email: 'n85551@gmail.com', name: '國裕', role: 'leader', initials: '裕', color: 'bg-blue-200', borderColor: '#3b82f6' },
            { email: 'hkkwork@gmail.com', name: '湘怡', role: 'staff', initials: '湘', color: 'bg-red-200', borderColor: '#ef4444' },
            { email: 'judyfang1226@gmail.com', name: '姿云', role: 'staff', initials: '姿', color: 'bg-green-200', borderColor: '#22c55e' },
            { email: 'kppt1110601@gmail.com', name: '秋媚', role: 'staff', initials: '媚', color: 'bg-yellow-200', borderColor: '#eab308' },
            { email: 'yilun1208@gmail.com', name: '怡倫', role: 'staff', initials: '倫', color: 'bg-pink-200', borderColor: '#ec4899' },
            { email: 'tony0972022@gmail.com', name: 'Tony測試', role: 'staff', initials: '測', color: 'bg-gray-200', borderColor: '#9ca3af' }
        ];

        // --- Helper Component: User Avatar ---
        const UserAvatar = ({ user, size = "w-8 h-8", textSize = "text-xs", className = "" }) => {
            if (!user) return <div className={`${size} rounded-full bg-gray-200 ${className}`}></div>;
            
            const showPhoto = user.usePhoto && user.avatarUrl;
            const borderColor = user.borderColor || 'transparent';
            
            if (showPhoto) {
                return (
                    <div 
                        className={`${size} rounded-full border-2 p-[1px] bg-white overflow-hidden relative flex-shrink-0 ${className}`} 
                        style={{ borderColor: borderColor }}
                    >
                        <img src={user.avatarUrl} alt={user.name} className="w-full h-full rounded-full object-cover" />
                    </div>
                );
            }
            return (
                <div 
                    className={`${size} rounded-full flex items-center justify-center font-bold border-2 flex-shrink-0 ${user.color || 'bg-gray-200'} ${textSize} text-gray-800 ${className}`}
                    style={{ borderColor: borderColor }}
                >
                    {user.initials || '?'}
                </div>
            );
        };

        // --- Main App Component ---
        function App() {
          const [user, setUser] = useState(null); 
          const [userData, setUserData] = useState(null);
          const [view, setView] = useState('dashboard');
          const [usersList, setUsersList] = useState([]);
          const [leaves, setLeaves] = useState([]);
          const [calendarEvents, setCalendarEvents] = useState([]);
          const [clockIns, setClockIns] = useState([]);
          const [leaveQuotas, setLeaveQuotas] = useState([]);
          const [announcements, setAnnouncements] = useState([]); // 🌟 新增：公告事項
          const [workTags, setWorkTags] = useState(DEFAULT_WORK_TAGS);
          const [areaTags, setAreaTags] = useState(DEFAULT_AREA_TAGS);
          const [leaveTypes, setLeaveTypes] = useState(DEFAULT_LEAVE_TYPES);
          const [rotationRules, setRotationRules] = useState(DEFAULT_ROTATION_RULES);
          const [roleNames, setRoleNames] = useState(DEFAULT_ROLE_NAMES);
          
          const [isSidebarOpen, setIsSidebarOpen] = useState(false); 
          const [isDesktopCollapsed, setIsDesktopCollapsed] = useState(false); 
          const [sidebarTheme, setSidebarTheme] = useState('light'); 

          const [settings, setSettings] = useState({ areaColors: DEFAULT_AREA_COLORS });
          const [globalSettings, setGlobalSettings] = useState({ calendarOverrides: {} }); // 🌟 新增：全域設定(如自訂假日)
          
          const [loading, setLoading] = useState(true);
          const [db, setDb] = useState(null);
          const [auth, setAuth] = useState(null);

          const handleUpdateRoleNames = (newNames) => {
              setRoleNames(newNames);
              localStorage.setItem('roleNames', JSON.stringify(newNames));
          };

          useEffect(() => {
            const savedTheme = localStorage.getItem('sidebarTheme');
            if (savedTheme) setSidebarTheme(savedTheme);
            const savedCollapsed = localStorage.getItem('isDesktopCollapsed');
            if (savedCollapsed) setIsDesktopCollapsed(JSON.parse(savedCollapsed));
            const savedRoleNames = localStorage.getItem('roleNames');
            if (savedRoleNames) setRoleNames(JSON.parse(savedRoleNames));
            const savedAreaColors = localStorage.getItem('areaColors');
            if(savedAreaColors) setSettings(prev => ({...prev, areaColors: JSON.parse(savedAreaColors)}));
            const savedLeaveTypes = localStorage.getItem('leaveTypes');
            if(savedLeaveTypes) setLeaveTypes(JSON.parse(savedLeaveTypes));
            const savedRotationRules = localStorage.getItem('rotationRules');
            if(savedRotationRules) setRotationRules(JSON.parse(savedRotationRules));
            const savedWT = localStorage.getItem('workTags');
            if (savedWT) setWorkTags(JSON.parse(savedWT));
            const savedAT = localStorage.getItem('areaTags');
            if (savedAT) setAreaTags(JSON.parse(savedAT));

            const init = async () => {
                try {
                    const app = initializeApp(MANUAL_CONFIG);
                    try { getAnalytics(app); } catch(err) {}

                    const authInstance = getAuth(app);
                    const dbInstance = getFirestore(app);
                    setAuth(authInstance);
                    setDb(dbInstance);

                    onAuthStateChanged(authInstance, async (u) => {
                        if (u) {
                            setUser(u);
                            try {
                                const docId = u.email ? u.email.toLowerCase() : u.uid;
                                const userRef = doc(dbInstance, 'artifacts', APP_ID, 'public', 'data', 'user_profiles', docId);
                                const snap = await getDoc(userRef);
                                
                                const matchedUser = PREDEFINED_USERS.find(p => p.email.toLowerCase() === (u.email || '').toLowerCase());

                                if (snap.exists()) {
                                    let currentData = snap.data();
                                    let needsUpdate = false;

                                    if (currentData.uid !== u.uid) { currentData.uid = u.uid; needsUpdate = true; }

                                    if (matchedUser && (currentData.role !== matchedUser.role || currentData.name !== matchedUser.name)) {
                                        currentData = { ...currentData, role: matchedUser.role, name: matchedUser.name, initials: matchedUser.initials, color: matchedUser.color, borderColor: matchedUser.borderColor };
                                        needsUpdate = true;
                                    }

                                    if (needsUpdate) await updateDoc(userRef, currentData);
                                    setUserData({ ...currentData, docId });
                                } else {
                                    const newP = { 
                                        uid: u.uid, 
                                        email: u.email || '', 
                                        name: matchedUser ? matchedUser.name : (u.displayName || '新成員'), 
                                        role: matchedUser ? matchedUser.role : 'staff', 
                                        initials: matchedUser ? matchedUser.initials : (u.displayName ? u.displayName.slice(0, 1) : '新'), 
                                        color: matchedUser ? matchedUser.color : 'bg-blue-200',
                                        usePhoto: !!u.photoURL,
                                        avatarUrl: u.photoURL || '',
                                        borderColor: matchedUser ? matchedUser.borderColor : '#3b82f6'
                                    };
                                    await setDoc(userRef, newP);
                                    setUserData({ ...newP, docId });
                                }
                            } catch(e) { 
                                alert("資料庫連線或權限設定錯誤！請檢查 Firestore Rules。\n錯誤訊息: " + e.message);
                                await signOut(authInstance); 
                            }
                        } else {
                            setUser(null);
                            setUserData(null);
                        }
                        setLoading(false);
                    });
                } catch (e) {
                    setLoading(false);
                }
            };
            init();
          }, []);

          // Data Synchronization
          useEffect(() => {
            if (!db || !user) return;
            const unsubLeaves = onSnapshot(query(collection(db, 'artifacts', APP_ID, 'public', 'data', 'leaves')), 
              (s) => setLeaves(s.docs.map(d => ({id:d.id, ...d.data()}))));
            const unsubEvents = onSnapshot(query(collection(db, 'artifacts', APP_ID, 'public', 'data', 'calendar_events')), 
              (s) => setCalendarEvents(s.docs.map(d => ({id:d.id, ...d.data()}))));
            const unsubUsers = onSnapshot(query(collection(db, 'artifacts', APP_ID, 'public', 'data', 'user_profiles')),
              (s) => setUsersList(s.docs.map(d => ({ docId: d.id, ...d.data() }))));
            const unsubClockIns = onSnapshot(query(collection(db, 'artifacts', APP_ID, 'public', 'data', 'attendance')),
              (s) => setClockIns(s.docs.map(d => ({ id: d.id, ...d.data() }))));
            const unsubQuotas = onSnapshot(query(collection(db, 'artifacts', APP_ID, 'public', 'data', 'leave_quotas')),
              (s) => setLeaveQuotas(s.docs.map(d => ({ id: d.id, ...d.data() }))));
              
            // 🌟 監聽公告事項
            const unsubAnnouncements = onSnapshot(query(collection(db, 'artifacts', APP_ID, 'public', 'data', 'announcements')),
              (s) => setAnnouncements(s.docs.map(d => ({ id: d.id, ...d.data() }))));
              
            // 🌟 監聽全域設定 (包含自訂節假日)
            const unsubGlobal = onSnapshot(doc(db, 'artifacts', APP_ID, 'public', 'data', 'global_settings', 'main'), (docSnap) => {
                if (docSnap.exists()) setGlobalSettings(docSnap.data());
            });

            return () => { unsubLeaves(); unsubEvents(); unsubUsers(); unsubClockIns(); unsubQuotas(); unsubAnnouncements(); unsubGlobal(); };
          }, [db, user]);

          const handleLogout = async () => { if(auth) await signOut(auth); };
          const handleUpdateSettings = (s) => { setSettings(s); if(s.areaColors) localStorage.setItem('areaColors', JSON.stringify(s.areaColors)); };
          const handleUpdateProfile = async (newProfile) => {
              try {
                  const docId = userData.email ? userData.email.toLowerCase() : user.uid;
                  await updateDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'user_profiles', docId), newProfile);
                  setUserData(prev => ({...prev, ...newProfile}));
                  alert("個人設定已更新");
              } catch(e) { alert("更新失敗: " + e.message); }
          };
          const handleUpdateRotationRules = (newRules) => { setRotationRules(newRules); localStorage.setItem('rotationRules', JSON.stringify(newRules)); };

          const handleAddTag = (type, val) => {
              if(!val) return;
              if(type==='work') { const t = [...workTags, val]; setWorkTags(t); localStorage.setItem('workTags', JSON.stringify(t)); } 
              else { const t = [...areaTags, val]; setAreaTags(t); localStorage.setItem('areaTags', JSON.stringify(t)); }
          };

          const handleDeleteTag = (type, val) => {
              if(!confirm("確定要刪除此項目嗎？")) return;
              if(type==='work') { const t = workTags.filter(item => item !== val); setWorkTags(t); localStorage.setItem('workTags', JSON.stringify(t)); } 
              else { const t = areaTags.filter(item => item !== val); setAreaTags(t); localStorage.setItem('areaTags', JSON.stringify(t)); }
          };

          const handleManageLeaveTypes = (action, val) => {
              if(action === 'add' && val) {
                  const newTypes = [...leaveTypes, val];
                  setLeaveTypes(newTypes); localStorage.setItem('leaveTypes', JSON.stringify(newTypes));
              } else if (action === 'delete') {
                  if(!confirm("確定要刪除此假別嗎？")) return;
                  const newTypes = leaveTypes.filter(t => t !== val);
                  setLeaveTypes(newTypes); localStorage.setItem('leaveTypes', JSON.stringify(newTypes));
              }
          }

          const toggleSidebarTheme = () => {
              const newTheme = sidebarTheme === 'light' ? 'dark' : 'light';
              setSidebarTheme(newTheme); localStorage.setItem('sidebarTheme', newTheme);
          }
          const toggleDesktopSidebar = () => {
              const newState = !isDesktopCollapsed;
              setIsDesktopCollapsed(newState); localStorage.setItem('isDesktopCollapsed', JSON.stringify(newState));
          }

          const crud = {
              createEvent: async (d) => addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'calendar_events'), d),
              deleteEvent: async (id) => deleteDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'calendar_events', id)),
              deleteEventsByGroup: async (gid) => {
                  const toDel = calendarEvents.filter(e=>e.groupId===gid);
                  toDel.forEach(e => deleteDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'calendar_events', e.id)));
              },
              createLeave: async (d) => addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'leaves'), d),
              updateLeave: async (id, data) => updateDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'leaves', id), { ...data, approvalDate: new Date() }),
              deleteLeave: async (id) => deleteDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'leaves', id)),
              saveClockIn: async (d) => {
                  const existing = clockIns.find(c => c.date === d.date && c.userId === d.userId);
                  if (existing) await updateDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'attendance', existing.id), d);
                  else await addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'attendance'), d);
              },
              saveQuota: async (d) => {
                  const existing = leaveQuotas.find(q => q.year === d.year && q.userId === d.userId);
                  if (existing) await updateDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'leave_quotas', existing.id), d);
                  else await addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'leave_quotas'), d);
              },
              // 🌟 新增公告與全域設定 CRUD
              createAnnouncement: async (d) => addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'announcements'), d),
              deleteAnnouncement: async (id) => deleteDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'announcements', id)),
              saveGlobalSettings: async (d) => await setDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'global_settings', 'main'), d, { merge: true })
          };

          if (loading) return (
              <div className="h-screen flex flex-col items-center justify-center bg-gray-50 text-gray-600 gap-4">
                  <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
                  <div className="text-lg font-medium">連線至雲端資料庫...</div>
              </div>
          );

          if (!user || !userData) return <LoginScreen auth={auth} />;

          const pendingApprovalCount = (userData.role === 'leader' || userData.role === 'admin') 
            ? leaves.filter(l => l.status === 'deputy_signed').length : 0;
          const myPendingDeputy = leaves.filter(l => (l.deputyId === userData.uid || l.deputyId === (userData.email || '').toLowerCase()) && l.status === 'pending').length;
          const totalAlert = pendingApprovalCount + myPendingDeputy;

          const isLight = sidebarTheme === 'light';
          const sidebarBg = isLight ? 'bg-white border-r border-gray-200 text-gray-800' : 'bg-slate-800 text-gray-100 border-r border-slate-700';
          const sidebarHover = isLight ? 'hover:bg-gray-100' : 'hover:bg-slate-700';
          const sidebarActive = isLight ? 'bg-blue-600 text-white shadow-md' : 'bg-blue-600 text-white shadow-lg';
          const sidebarTextSec = isLight ? 'text-gray-500' : 'text-slate-400';
          const sidebarProfileBg = isLight ? 'bg-gray-50' : 'bg-slate-900/50';
          const iconColor = isLight ? 'text-blue-600' : 'text-blue-400';
          const userDisplayRole = userData.role === 'admin' ? roleNames['staff'] : roleNames[userData.role];

          return (
            <div className="flex h-screen bg-gray-50 overflow-hidden font-sans text-gray-800 relative">
              {isSidebarOpen && <div className="fixed inset-0 bg-black/50 z-40 md:hidden" onClick={() => setIsSidebarOpen(false)}></div>}

              <div className={`fixed md:relative inset-y-0 left-0 z-50 flex flex-col shadow-lg transition-all duration-300 ${sidebarBg} ${isSidebarOpen ? 'translate-x-0 w-64' : '-translate-x-full md:translate-x-0'} ${isDesktopCollapsed ? 'md:w-20' : 'md:w-64'}`}>
                <div className={`p-4 border-b flex items-center ${isLight ? 'border-gray-200' : 'border-slate-700'} ${isDesktopCollapsed ? 'justify-center' : 'justify-between'}`}>
                  {!isDesktopCollapsed && (
                      <div className="flex items-center gap-2"><Calendar className={iconColor}/> <span className="font-bold text-lg">差勤排班</span></div>
                  )}
                  {isDesktopCollapsed && <Calendar className={iconColor}/>}
                  <button className="md:hidden" onClick={()=>setIsSidebarOpen(false)}><X size={20}/></button>
                  <button className={`hidden md:flex p-1 rounded hover:bg-opacity-20 ${isLight?'hover:bg-gray-300':'hover:bg-slate-600'}`} onClick={toggleDesktopSidebar}>
                    {isDesktopCollapsed ? <ChevronRight size={18}/> : <ChevronLeft size={18}/>}
                  </button>
                </div>
                
                <div className={`p-4 flex items-center gap-3 border-b cursor-pointer transition ${sidebarProfileBg} ${isLight ? 'border-gray-200' : 'border-slate-700'} ${sidebarHover} ${isDesktopCollapsed ? 'justify-center' : ''}`} onClick={()=>setView('profile')}>
                  <UserAvatar user={userData} size="w-10 h-10" textSize="text-sm" />
                  {!isDesktopCollapsed && (
                      <div className="overflow-hidden">
                        <p className="font-medium truncate">{userData.name}</p>
                        <span className={`text-xs px-2 py-0.5 rounded-full font-medium ${isLight ? 'bg-gray-200 text-gray-700' : 'bg-slate-700 text-gray-300'}`}>{userDisplayRole}</span>
                      </div>
                  )}
                </div>

                <nav className="flex-1 overflow-y-auto py-2 overflow-x-hidden">
                  {[
                    {id:'dashboard', icon:<LayoutDashboard size={20}/>, label:'儀表板'},

        // --- 模組：線上打卡 ---
        function ClockInView({ user, clockIns, crud }) {
            const [currentTime, setCurrentTime] = useState(new Date());

            useEffect(() => {
                const timer = setInterval(() => setCurrentTime(new Date()), 1000);
                return () => clearInterval(timer);
            }, []);

            const tzOffset = currentTime.getTimezoneOffset() * 60000;
            const todayStr = (new Date(currentTime - tzOffset)).toISOString().slice(0, 10);
            
            const myTodayRecord = clockIns.find(c => c.date === todayStr && c.userId === (user.docId || user.uid));

            const handleClock = async (type) => {
                const timeStr = currentTime.toTimeString().slice(0, 5); 
                const record = myTodayRecord || { userId: user.docId || user.uid, userName: user.name, date: todayStr };
                
                if (type === 'in') record.clockIn = timeStr;
                if (type === 'out') record.clockOut = timeStr;

                try {
                    await crud.saveClockIn(record);
                    alert(`${type === 'in' ? '上班' : '下班'}打卡成功：${timeStr}`);
                } catch(e) {
                    alert('打卡失敗：' + e.message);
                }
            };

            return (
                <div className="max-w-md mx-auto bg-white rounded-2xl shadow-lg p-8 text-center mt-10">
                    <h2 className="text-2xl font-bold text-gray-800 mb-2">線上打卡</h2>
                    <p className="text-gray-500 mb-8">{todayStr.replace(/-/g, ' / ')}</p>
                    
                    <div className="text-6xl font-black text-blue-600 tracking-wider mb-10 font-mono">
                        {currentTime.toTimeString().slice(0, 8)}
                    </div>

                    <div className="grid grid-cols-2 gap-4">
                        <button 
                            onClick={() => handleClock('in')}
                            disabled={myTodayRecord?.clockIn}
                            className={`py-4 rounded-xl font-bold text-lg transition flex flex-col items-center justify-center gap-2 ${myTodayRecord?.clockIn ? 'bg-gray-100 text-gray-400 cursor-not-allowed' : 'bg-green-100 text-green-700 hover:bg-green-200 hover:shadow'}`}
                        >
                            <span className="text-sm">{myTodayRecord?.clockIn ? `已打卡 ${myTodayRecord.clockIn}` : '上班打卡'}</span>
                        </button>
                        <button 
                            onClick={() => handleClock('out')}
                            className={`py-4 rounded-xl font-bold text-lg transition flex flex-col items-center justify-center gap-2 bg-blue-100 text-blue-700 hover:bg-blue-200 hover:shadow`}
                        >
                            <span className="text-sm">{myTodayRecord?.clockOut ? `已下班 ${myTodayRecord.clockOut} (可覆蓋)` : '下班打卡'}</span>
                        </button>
                    </div>
                </div>
            );
        }

        // --- 模組：特休與額度查詢 ---

                const userLeaves = leaves.filter(l => 
                    (l.requesterId === uid || l.requesterName === users.find(u=>u.docId===uid)?.name) && 
                    l.status === 'approved' && 
                    l.start.startsWith(String(currentYear)) && 
                    l.type === type
                );
                return userLeaves.reduce((sum, l) => sum + (Number(l.hours) || 0), 0);
            };

            const userListToRender = isAdmin ? users : [user];

            const handleUpdateQuota = async (uid, type, currentVal) => {
                const input = prompt(`請輸入新的【${type}】總時數額度 (小時):`, currentVal || 0);

                const val = Number(input);
                const qData = quotas.find(q => q.userId === uid && q.year === currentYear) || { userId: uid, year: currentYear };
                qData[type] = val;

                                    <th className="p-2 border-l text-center">總額度</th><th className="p-2 text-center text-red-500">已休</th><th className="p-2 text-center text-green-600">剩餘</th>

                                    const tTotal = q['特休'] || 0; const tUsed = getUsedLeave(uid, '特休');
                                    const bTotal = q['病假'] || 0; const bUsed = getUsedLeave(uid, '病假');
                                    const sTotal = q['事假'] || 0; const sUsed = getUsedLeave(uid, '事假');

                                    return (

                    <h3 className="text-gray-500 text-sm font-medium">今日外勤人員</h3>
                    <div className="text-blue-700 mt-2 font-bold flex flex-wrap gap-1">

                  <div

        function CalendarView({ user, users, events, leaves, crud, tags, settings, globalSettings, rotationRules, onUpdateRotationRules, announcements }) {
          const [date, setDate] = useState(new Date());
          const [viewMode, setViewMode] = useState('month');
          const [modalOpen, setModalOpen] = useState(false);
          const [rotationModalOpen, setRotationModalOpen] = useState(false);
          const [announceModalOpen, setAnnouncementModalOpen] = useState(false);
          const [modalData, setModalData] = useState({ date: '', workItem: '', note: '' });
          const [announceData, setAnnounceData] = useState({ title: '', date: '', assignee: user.name, description: '' });
          const [selSlot, setSelSlot] = useState('morning'); 
          const [selArea, setSelArea] = useState('');
          const [selUsers, setSelUsers] = useState([]);
          const [editGroupId, setEditGroupId] = useState(null);
          const [isSubmitting, setIsSubmitting] = useState(false);

          const getDaysInMonth = (d) => new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
          const getFirstDayOfMonth = (d) => new Date(d.getFullYear(), d.getMonth(), 1).getDay();
          const todayObj = new Date();
          const tzOffsetToday = todayObj.getTimezoneOffset() * 60000;
          const todayStr = (new Date(todayObj - tzOffsetToday)).toISOString().slice(0, 10);
          
          // 🌟 公告過濾與排序 (顯示今天以後的)
          const upcomingAnnouncements = announcements
              .filter(a => a.date >= todayStr)
              .sort((a,b) => a.date.localeCompare(b.date));

          const rotationStats = useMemo(() => {
              const currentYear = new Date().getFullYear();
              const stats = {}; 
              rotationRules.forEach(rule => {
                  stats[rule.id] = {};
                  rule.order.forEach(name => stats[rule.id][name] = 0);
              });
              events.forEach(e => {
                  if (e.type === 'person' && new Date(e.date).getFullYear() === currentYear) {
                      const tagEv = events.find(t => t.groupId === e.groupId && t.type === 'tag');
                      if (tagEv) {
                          const rule = rotationRules.find(r => r.matchTag === tagEv.item);
                          if (rule && stats[rule.id][e.userName] !== undefined) {
                              stats[rule.id][e.userName]++;
                          }
                      }
                  }
              });
              return stats;
          }, [events, rotationRules]);

          const getNextRotationPerson = (matchTag) => {
              const rule = rotationRules.find(r => r.matchTag === matchTag);
              if (!rule) return null;
              const sortedEvents = [...events]
                .filter(e => e.type === 'tag' && e.item === matchTag)
                .sort((a,b) => new Date(b.date) - new Date(a.date));

              let next = rule.order[0];
              let lastDate = null;
              
              if (sortedEvents.length > 0) {
                  lastDate = sortedEvents[0].date;
                  const lastGroup = sortedEvents[0].groupId;
                  const pplInGroup = events.filter(e => e.groupId === lastGroup && e.type === 'person').map(e=>e.userName);
                  
                  const presentIndexes = pplInGroup.map(p => rule.order.indexOf(p)).filter(i => i !== -1);
                  if (presentIndexes.length > 0) {
                      const maxIndex = Math.max(...presentIndexes);
                      next = rule.order[(maxIndex + 1) % rule.order.length];
                  }
              }
              return { user: users.find(u => u.name === next), lastDate };
          };

          const rotationData = rotationRules.map(rule => {
              const info = getNextRotationPerson(rule.matchTag);
              return { ...rule, nextPerson: info?.user?.name || rule.order[0], lastDate: info?.lastDate };
          });

          const handleDayClick = (dObj) => {
              const dStr = (new Date(dObj - dObj.getTimezoneOffset() * 60000)).toISOString().slice(0, 10);
              setModalData({ date: dStr, workItem: '', note: '' });
              setSelSlot('morning');
              setSelArea('');
              setSelUsers([]);
              setEditGroupId(null);
              setModalOpen(true);
          };

          const handleEventClick = (e, groupEvents) => {
              e.stopPropagation();
              const tagEv = groupEvents.find(ev => ev.type === 'tag');
              const personEvs = groupEvents.filter(ev => ev.type === 'person');
              
              if (tagEv) {
                  setModalData({ date: tagEv.date, workItem: tagEv.item, note: tagEv.note || '' });
                  setSelSlot(tagEv.slot || 'all_day');
                  setSelArea(tagEv.area || '');
                  setSelUsers(personEvs.map(p => p.userId));
                  setEditGroupId(tagEv.groupId);
                  setModalOpen(true);
              }
          };

          const handleRotationClick = (rule) => {
              setModalData(prev => ({...prev, workItem: rule.matchTag}));
              const info = getNextRotationPerson(rule.matchTag);
              if (info?.user) setSelUsers([info.user.uid || info.user.docId]);
              else setSelUsers([]);
          };

          const handleDeleteGroup = async () => {
              if(!editGroupId) return;
              if(confirm('確定要刪除此行程嗎？')) {
                  await crud.deleteEventsByGroup(editGroupId);
                  setModalOpen(false);
              }
          }

          const handleModalSave = async () => {
              if(!modalData.workItem) { alert("請選擇工作項目"); return; }
              
              let conflictMsg = "";
              for(const uid of selUsers) {
                  const userEvents = events.filter(e => e.date === modalData.date && e.type === 'person' && e.userId === uid && e.groupId !== editGroupId);
                  
                  const hasAllDay = userEvents.find(e => e.slot === 'all_day');
                  const hasMorning = userEvents.find(e => e.slot === 'morning');
                  const hasAfternoon = userEvents.find(e => e.slot === 'afternoon');
                  
                  const uName = users.find(u=>u.uid === uid || u.docId === uid)?.name;

                  if (selSlot === 'all_day' && (hasMorning || hasAfternoon || hasAllDay)) {
                      conflictMsg = `衝突警示：\n${uName} 在該日已有「${hasMorning?'上午':(hasAfternoon?'下午':'整天')}」行程，無法再排整天。`;
                  } else if (selSlot === 'morning' && (hasAllDay || hasMorning)) {
                      conflictMsg = `衝突警示：\n${uName} 在該日已有「${hasAllDay?'整天':'上午'}」行程。`;
                  } else if (selSlot === 'afternoon' && (hasAllDay || hasAfternoon)) {
                      conflictMsg = `衝突警示：\n${uName} 在該日已有「${hasAllDay?'整天':'下午'}」行程。`;
                  }
              }

              if (conflictMsg) { alert(conflictMsg); return; }
              setIsSubmitting(true);

              try {
                  if (editGroupId) await crud.deleteEventsByGroup(editGroupId);
                  const groupId = `g_${Date.now()}`; 
                  await crud.createEvent({ groupId, date: modalData.date, type: 'tag', itemId: modalData.workItem, item: modalData.workItem, area: selArea, slot: selSlot, note: modalData.note, timestamp: new Date() });
                  for(const uid of selUsers) {
                      const u = users.find(x=>x.uid === uid || x.docId === uid);
                      if(u) await crud.createEvent({ groupId, date: modalData.date, type: 'person', userId: u.uid || u.docId, userName: u.name, userAvatar: u.initials, userColor: u.color, slot: selSlot, timestamp: new Date() });
                  }
                  setModalOpen(false);
                  alert(editGroupId ? '行程修改完成' : '行程新增完成');
              } catch (e) {
                  alert('儲存失敗：' + e.message);
              } finally {
                  setIsSubmitting(false);
              }
          };

          const handleSaveAnnouncement = async () => {
              if(!announceData.title || !announceData.date) { alert("標題和日期必填！"); return; }
              try {
                  await crud.createAnnouncement({ ...announceData, creator: user.name, timestamp: new Date() });
                  setAnnouncementModalOpen(false);
                  setAnnounceData({ title: '', date: '', assignee: user.name, description: '' });
              } catch(e) { alert("發布失敗"); }
          };

          const renderGrid = () => {
              const cells = [];
              const isMonth = viewMode === 'month';
              if (isMonth) {
                  const startDay = getFirstDayOfMonth(date);
                  const totalDays = getDaysInMonth(date);
                  for(let i=0; i<startDay; i++) cells.push(<div key={`empty-${i}`} className="bg-gray-50/50 border-b border-r border-gray-100 min-h-[140px] md:min-h-[18vh]"></div>);
                  for(let i=1; i<=totalDays; i++) {
                      const d = new Date(date.getFullYear(), date.getMonth(), i);
                      cells.push(renderDayCell(d));
                  }
              } else {
                  const day = date.getDay();
                  const diff = date.getDate() - day + 1; 
                  const weekStart = new Date(date);
                  weekStart.setDate(diff);
                  for(let i=0; i<7; i++) {
                      const d = new Date(weekStart);
                      d.setDate(weekStart.getDate() + i);
                      cells.push(renderDayCell(d));
                  }
              }
              return cells;
          };

          const renderDayCell = (dObj) => {
              const dStr = (new Date(dObj - dObj.getTimezoneOffset() * 60000)).toISOString().slice(0, 10);
              const dayEvs = events.filter(e => e.date === dStr);
              const isToday = dStr === todayStr;
              
              // 🌟 整合自訂節假日 (全域設定)
              const override = globalSettings.calendarOverrides?.[dStr];
              let isHoliday = !!TAIWAN_HOLIDAYS_2026[dStr];
              let isWeekend = dObj.getDay() === 0 || dObj.getDay() === 6;
              let holidayName = TAIWAN_HOLIDAYS_2026[dStr] || '';
              
              if (override) {
                  if (override.type === 'holiday') {
                      isHoliday = true; isWeekend = true; holidayName = override.name;
                  } else if (override.type === 'workday') {
                      isHoliday = false; isWeekend = false; holidayName = override.name;
                  }
              }
              
              const slots = { morning: [], afternoon: [], all_day: [] };
              const groups = {};
              dayEvs.forEach(e => {
                  if (!groups[e.groupId]) groups[e.groupId] = { tag: null, people: [], slot: e.slot || 'all_day' };
                  if (e.type === 'tag') groups[e.groupId].tag = e;
                  if (e.type === 'person') groups[e.groupId].people.push(e);
              });
              Object.values(groups).forEach(g => { if (slots[g.slot]) slots[g.slot].push(g); });

              const renderGroup = (g) => {
                  const groupId = g.tag?.groupId || g.people[0]?.groupId;
                  const tagName = g.tag?.item || '未命名';
                  const areaName = g.tag?.area || '';
                  const note = g.tag?.note || '';
                  const areaColor = settings.areaColors[areaName] || "bg-gray-100 text-gray-800";
                  const groupEvents = [g.tag, ...g.people].filter(Boolean);

                  return (
                    <div key={groupId} onClick={(e) => handleEventClick(e, groupEvents)} className="flex flex-wrap items-center gap-1 bg-white border border-gray-200 rounded px-1.5 py-1 shadow-sm mb-1 cursor-pointer hover:bg-yellow-50 transition">
                        {areaName && <span className={`px-1.5 py-0.5 rounded text-[10px] md:text-xs font-bold ${areaColor}`}>{areaName}</span>}
                        <span className="text-xs md:text-sm text-blue-700 font-bold truncate">{tagName}</span>
                        {note && <span className="text-[10px] md:text-xs text-gray-500">({note})</span>}
                        {g.people.map(p => {
                            const userProfile = users.find(u => u.uid === p.userId || u.docId === p.userId || u.name === p.userName);
                            const displayUser = userProfile || { initials: p.userAvatar, color: p.userColor || 'bg-gray-200', usePhoto: false };
                            return <UserAvatar key={p.id} user={displayUser} size="w-5 h-5 md:w-6 md:h-6" textSize="text-[10px] md:text-xs" />;
                        })}
                        <button onClick={(e)=>{e.stopPropagation(); if(confirm('刪除?')) crud.deleteEventsByGroup(groupId)}} className="text-gray-300 hover:text-red-500"><X size={12}/></button>
                    </div>
                  );
              };

              const renderLeaves = () => {
                  const leavesOnDay = leaves.filter(l => l.status !== 'rejected' && dStr >= l.start.split('T')[0] && dStr <= l.end.split('T')[0]);
                  return leavesOnDay.map(l => {
                      return (
                          <div key={l.id} className="text-[10px] md:text-xs border border-pink-200 bg-pink-100 text-pink-700 shadow-sm rounded px-1 py-0.5 my-0.5 w-full select-none truncate font-bold text-center">
                              {l.requesterName} ({l.type})
                          </div>
                      );
                  });
              };

              return (
                  <div key={dStr} className={`border-b border-r border-gray-200 p-1 min-h-[140px] md:min-h-[18vh] relative transition-colors flex flex-col group hover:bg-gray-50`} onClick={() => handleDayClick(dObj)}>
                      <div className="w-full flex justify-between items-start mb-1">
                          <div className="flex flex-col items-center w-full">
                              <span className={`text-sm md:text-base font-bold px-3 py-0.5 w-full text-center ${isToday ? 'bg-yellow-300 text-black rounded-md shadow-sm' : (isWeekend || isHoliday ? 'text-red-500' : 'text-gray-700')}`}>
                                  {dObj.getDate()} 
                                  {isHoliday && <span className="ml-1 text-[10px] md:text-xs bg-red-500 text-white px-1 rounded align-middle">{holidayName}</span>}
                                  {override?.type === 'workday' && <span className="ml-1 text-[10px] md:text-xs bg-blue-500 text-white px-1 rounded align-middle">{holidayName}</span>}
                              </span>
                          </div>
                          <div className="absolute top-1 right-1"><Edit2 size={14} className="text-gray-300 group-hover:text-blue-500 opacity-0 group-hover:opacity-100 transition"/></div>
                      </div>
                      
                      <div className="flex-1 flex flex-col gap-1 overflow-hidden" onClick={e=>e.stopPropagation()}>
                          {slots.all_day.length > 0 && <div className="bg-sky-500/10 p-0.5 rounded border border-sky-200"><div className="text-[10px] md:text-xs text-sky-700 font-bold mb-0.5 px-1">整天</div>{slots.all_day.map(renderGroup)}</div>}
                          {slots.morning.length > 0 && <div className="bg-sky-100/30 p-0.5 rounded border border-sky-100"><div className="text-[10px] md:text-xs text-sky-600 font-bold mb-0.5 px-1">上午</div>{slots.morning.map(renderGroup)}</div>}
                          {slots.afternoon.length > 0 && <div className="bg-sky-300/20 p-0.5 rounded border border-sky-200"><div className="text-[10px] md:text-xs text-sky-800 font-bold mb-0.5 px-1">下午</div>{slots.afternoon.map(renderGroup)}</div>}
                          <div className="mt-auto flex flex-col-reverse gap-0.5 w-full">{renderLeaves()}</div>
                      </div>
                  </div>
              );
          };

          return (
            <div className="flex flex-col h-full gap-4">
               {/* 🌟 頂部：重大事項公告區 */}
               {upcomingAnnouncements.length > 0 && (
                   <div className="bg-amber-50 border border-amber-200 rounded-lg p-3 shadow-sm shrink-0">
                       <div className="flex justify-between items-center mb-2">
                           <h3 className="text-amber-800 font-bold flex items-center gap-2"><Megaphone size={18}/> 近期重大事項公告</h3>
                           <button onClick={()=>setAnnouncementModalOpen(true)} className="text-xs bg-amber-200 text-amber-800 px-3 py-1.5 font-bold rounded hover:bg-amber-300 transition shadow-sm">+ 新增公告</button>
                       </div>
                       <div className="flex gap-3 overflow-x-auto pb-2 scrollbar-hide">
                           {upcomingAnnouncements.map(a => {
                               const diffTime = Math.abs(new Date(a.date) - new Date(todayStr));
                               const daysLeft = Math.ceil(diffTime / (1000 * 60 * 60 * 24)); 
                               return (
                                  <div key={a.id} className="min-w-[260px] bg-white border border-amber-100 p-3 rounded-lg shadow-sm relative group">
                                      <div className="flex justify-between items-start mb-1">
                                          <span className="text-sm font-bold text-gray-800 flex-1 truncate pr-2">{a.title}</span>
                                          <span className={`text-[10px] font-bold px-2 py-1 rounded shrink-0 ${daysLeft===0 ? 'bg-red-100 text-red-600 animate-pulse' : 'bg-amber-100 text-amber-700'}`}>
                                              {daysLeft === 0 ? '🔥 就是今天' : `倒數 ${daysLeft} 天`}
                                          </span>
                                      </div>
                                      <div className="text-xs text-gray-500 font-medium">📅 {a.date} | 👤 主責: {a.assignee}</div>
                                      {a.description && <div className="text-xs text-gray-600 mt-2 bg-gray-50 p-2 rounded line-clamp-2" title={a.description}>{a.description}</div>}
                                      {(user.role === 'admin' || user.role === 'leader' || user.name === a.creator) && (
                                          <button onClick={()=>crud.deleteAnnouncement(a.id)} className="absolute top-2 right-2 opacity-0 group-hover:opacity-100 text-gray-400 hover:text-red-500 bg-white rounded-full p-1 shadow transition"><Trash2 size={14}/></button>
                                      )}
                                  </div>
                               )
                           })}
                       </div>
                   </div>
               )}
               {/* 當沒有公告時，顯示一個按鈕可以加 */}
               {upcomingAnnouncements.length === 0 && (
                    <div className="flex justify-end">
                        <button onClick={()=>setAnnouncementModalOpen(true)} className="text-xs bg-white border border-gray-300 text-gray-600 px-3 py-1.5 font-bold rounded hover:bg-gray-50 transition shadow-sm flex items-center gap-1"><Megaphone size={14}/> 發布新公告</button>
                    </div>
               )}

               <div className="flex-1 flex flex-col bg-white rounded-lg shadow-sm border h-full min-h-[500px]">
                  <div className="p-4 border-b flex justify-between items-center bg-gray-50">
                      <div className="flex items-center gap-2">
                        <span className="text-xl font-bold text-gray-700">{date.getFullYear()}年{date.getMonth()+1}月</span>
                        <div className="flex bg-white rounded border shadow-sm">
                          <button className="p-1.5 hover:bg-gray-100" onClick={()=>setDate(new Date(date.getFullYear(), date.getMonth()-1, 1))}><ChevronLeft size={16}/></button>
                          <button className="p-1.5 hover:bg-gray-100" onClick={()=>setDate(new Date(date.getFullYear(), date.getMonth()+1, 1))}><ChevronRight size={16}/></button>
                        </div>
                        <div className="flex bg-white rounded border shadow-sm ml-2 text-xs">
                            <button onClick={()=>setViewMode('month')} className={`px-3 py-1.5 ${viewMode==='month'?'bg-slate-800 text-white':'hover:bg-gray-50'}`}>月</button>
                            <button onClick={()=>setViewMode('week')} className={`px-3 py-1.5 ${viewMode==='week'?'bg-slate-800 text-white':'hover:bg-gray-50'}`}>週</button>
                        </div>
                      </div>
                      <button onClick={()=>setRotationModalOpen(true)} className="text-xs bg-white px-3 py-1.5 rounded border shadow-sm flex items-center gap-1 hover:bg-blue-50 text-blue-600 font-bold"><RefreshCw size={14}/> 輪序表</button>
                  </div>
                  
                  <div className="flex-1 overflow-auto">
                      <div className="min-w-[600px] h-full flex flex-col">
                         <div className="grid grid-cols-7 border-b bg-white text-center text-sm md:text-base font-bold text-gray-500 py-2 sticky top-0 z-10 shadow-sm">
                             {['日','一','二','三','四','五','六'].map((d,i)=><div key={i} className={i===0||i===6?'text-red-500':''}>{d}</div>)}
                         </div>
                         <div className="flex-1 grid grid-cols-7 auto-rows-fr bg-white">
                             {renderGrid()}
                         </div>
                      </div>
                  </div>
               </div>

               {/* 🌟 公告表單 Modal */}
               {announceModalOpen && (
                   <div className="fixed inset-0 bg-black/60 z-[60] flex items-center justify-center p-4 animate-in fade-in duration-200" onClick={()=>setAnnouncementModalOpen(false)}>
                       <div className="bg-white rounded-xl w-full max-w-md shadow-2xl flex flex-col" onClick={e=>e.stopPropagation()}>
                           <div className="p-4 border-b flex justify-between items-center bg-gray-50 rounded-t-xl">
                               <h3 className="font-bold text-lg text-gray-800 flex items-center gap-2"><Megaphone size={20}/> 新增重大事項公告</h3>
                               <button onClick={()=>setAnnouncementModalOpen(false)} className="text-gray-400 hover:text-gray-600"><X size={20}/></button>
                           </div>
                           <div className="p-4 space-y-4">
                               <div><label className="text-xs font-bold text-gray-700 block mb-1">事項標題 <span className="text-red-500">*</span></label><input className="w-full border p-2 rounded" placeholder="例如: 繳交期中成果報告" value={announceData.title} onChange={e=>setAnnounceData({...announceData, title:e.target.value})}/></div>
                               <div className="grid grid-cols-2 gap-4">
                                   <div><label className="text-xs font-bold text-gray-700 block mb-1">截止/發生日期 <span className="text-red-500">*</span></label><input type="date" className="w-full border p-2 rounded" value={announceData.date} onChange={e=>setAnnounceData({...announceData, date:e.target.value})}/></div>
                                   <div><label className="text-xs font-bold text-gray-700 block mb-1">主責人</label><select className="w-full border p-2 rounded bg-white text-sm" value={announceData.assignee} onChange={e=>setAnnounceData({...announceData, assignee:e.target.value})}><option value="">無</option>{users.map(u=><option key={u.docId} value={u.name}>{u.name}</option>)}</select></div>
                               </div>
                               <div><label className="text-xs font-bold text-gray-700 block mb-1">說明備註</label><textarea className="w-full border p-2 rounded h-20 resize-none" placeholder="補充細節..." value={announceData.description} onChange={e=>setAnnounceData({...announceData, description:e.target.value})}/></div>
                           </div>
                           <div className="p-4 border-t bg-gray-50 rounded-b-xl">
                               <button onClick={handleSaveAnnouncement} className="w-full bg-amber-600 text-white py-3 rounded-lg font-bold shadow hover:bg-amber-700 transition">發布公告</button>
                           </div>
                       </div>
                   </div>
               )}

               <RotationModal open={rotationModalOpen} onClose={()=>setRotationModalOpen(false)} rules={rotationRules} onUpdateRules={onUpdateRotationRules} rotationData={rotationData} rotationStats={rotationStats}/>

               {modalOpen && (
                   <div className="fixed inset-0 bg-black/60 z-[60] flex items-center justify-center p-4 animate-in fade-in duration-200" onClick={()=>setModalOpen(false)}>
                       <div className="bg-white rounded-xl w-full max-w-md shadow-2xl flex flex-col max-h-[90vh]" onClick={e=>e.stopPropagation()}>
                           <div className="p-4 border-b flex justify-between items-center bg-gray-50 rounded-t-xl">
                               <div>
                                   <h3 className="font-bold text-lg text-gray-800">{editGroupId ? '修改排班' : '新增排班'}</h3>
                                   <input type="date" className="mt-1 text-sm font-medium text-gray-700 border border-gray-300 rounded px-2 py-1 bg-white hover:border-blue-400 focus:border-blue-500 outline-none transition-colors" value={modalData.date} onChange={e=>setModalData({...modalData, date:e.target.value})} />
                               </div>
                               <button onClick={()=>setModalOpen(false)} className="text-gray-400 hover:text-gray-600"><X size={20}/></button>
                           </div>

                           <div className="p-4 overflow-y-auto space-y-5">
                               <div>
                                   <label className="text-xs font-bold text-gray-500 uppercase mb-2 block flex items-center gap-1"><RefreshCw size={12}/> 快速輪值 (自動帶入)</label>
                                   <div className="grid grid-cols-2 gap-2">
                                       {rotationRules.map(rule => (
                                           <button key={rule.id} onClick={() => handleRotationClick(rule)} className="text-xs py-2 px-3 bg-purple-50 text-purple-700 border border-purple-200 rounded-lg hover:bg-purple-100 transition text-left flex justify-between items-center group">
                                               <span>{rule.name}</span><span className="opacity-0 group-hover:opacity-100 text-[10px]">自動填入 →</span>
                                           </button>
                                       ))}
                                   </div>
                               </div>

                               <hr className="border-gray-100"/>

                               <div className="grid grid-cols-2 gap-4">
                                   <div>
                                       <label className="block text-xs font-bold text-gray-700 mb-1">工作項目</label>
                                       <select className="w-full border p-2 rounded bg-white text-sm" value={modalData.workItem} onChange={e=>setModalData({...modalData, workItem:e.target.value})}>
                                           <option value="">請選擇...</option>
                                           {tags.workTags.map(t=><option key={t} value={t}>{t}</option>)}
                                       </select>
                                   </div>
                                   <div>
                                       <label className="block text-xs font-bold text-gray-700 mb-1">選擇時段</label>
                                       <div className="flex bg-gray-100 rounded p-1">
                                           {TIME_SLOTS.map(s => (
                                               <button key={s.id} onClick={()=>setSelSlot(s.id)} className={`flex-1 py-1.5 text-xs rounded transition ${selSlot===s.id ? 'bg-white shadow text-black font-bold' : 'text-gray-500'}`}>{s.label}</button>
                                           ))}
                                       </div>
                                   </div>
                               </div>

                               <div>
                                   <label className="block text-xs font-bold text-gray-700 mb-1">選擇轄區 (選填)</label>
                                   <select className="w-full border p-2 rounded bg-white text-sm" value={selArea} onChange={e=>setSelArea(e.target.value)}>
                                           <option value="">-- 無 --</option>
                                           {tags.areaTags.map(a=><option key={a} value={a}>{a}</option>)}
                                   </select>
                               </div>

                               <div>
                                   <label className="block text-xs font-bold text-gray-700 mb-1">時間/備註 (選填)</label>
                                   <input className="w-full border p-2 rounded bg-white text-sm" placeholder="例如: 09:00 或 備註事項" value={modalData.note} onChange={e=>setModalData({...modalData, note:e.target.value})} />
                               </div>

                               <div>
                                   <label className="block text-xs font-bold text-gray-700 mb-2">參與人員</label>
                                   <div className="grid grid-cols-3 sm:grid-cols-4 gap-2">
                                       {users.map(u => {
                                           const active = selUsers.includes(u.uid || u.docId);
                                           return (
                                               <div key={u.docId} onClick={()=>setSelUsers(p=>active?p.filter(x=>x!==(u.uid || u.docId)):[...p,(u.uid || u.docId)])} className={`flex flex-col items-center p-2 rounded-lg border cursor-pointer transition select-none ${active?'bg-blue-50 border-blue-500 ring-1 ring-blue-500':'bg-white hover:bg-gray-50 border-gray-200'}`}>
                                                   <UserAvatar user={u} size="w-8 h-8" textSize="text-xs" />
                                                   <span className="text-[10px] mt-1 text-gray-700 font-medium">{u.name}</span>
                                               </div>
                                           );
                                       })}
                                   </div>
                               </div>
                           </div>
                           
                           <div className="p-4 border-t bg-gray-50 rounded-b-xl flex gap-3">
                               {editGroupId && <button onClick={handleDeleteGroup} disabled={isSubmitting} className={`flex-1 bg-red-100 text-red-700 py-3 rounded-lg font-bold hover:bg-red-200 transition ${isSubmitting?'opacity-50 cursor-not-allowed':''}`}>刪除行程</button>}
                               <button onClick={handleModalSave} disabled={isSubmitting} className={`flex-1 bg-slate-800 text-white py-3 rounded-lg font-bold shadow transition flex items-center justify-center gap-2 ${isSubmitting ? 'opacity-50 cursor-not-allowed' : 'hover:bg-slate-900'}`}>
                                   {isSubmitting ? <><RefreshCw className="animate-spin" size={18}/> 處理中...</> : <><CheckCircle size={18}/> {editGroupId ? '確認修改' : '儲存行程'}</>}
                               </button>
                           </div>
                       </div>
                   </div>
               )}
            </div>
          );
        }

        // --- 差勤一覽表與報表匯出 ---
        function AttendanceView({ user, users, events, leaves, settings, leaveTypes, clockIns, crud, globalSettings }) {
            const [month, setMonth] = useState(new Date().toISOString().slice(0, 7)); 
            const [leaveFilter, setLeaveFilter] = useState('all');
            const [viewUser, setViewUser] = useState(user.name); 
            const [selectedIds, setSelectedIds] = useState([]);

            const targetUsers = viewUser === 'all' ? users : users.filter(u => u.name === viewUser);
            if (targetUsers.length === 0 && viewUser === user.name) targetUsers.push(user); 

            const scheduleData = useMemo(() => {
                const parts = month.split('-');
                const y = parseInt(parts[0], 10);
                const m = parseInt(parts[1], 10);
                const daysInMonth = new Date(y, m, 0).getDate();
                const data = [];
                
                targetUsers.forEach(tu => {
                    for(let i=1; i<=daysInMonth; i++) {
                        const dateStr = `${month}-${String(i).padStart(2,'0')}`;
                        
                        const myWork = events.filter(e => e.date === dateStr && e.type === 'person' && e.userName === tu.name).map(p => {
                            const tag = events.find(t => t.groupId === p.groupId && t.type === 'tag');
                            return { ...p, tag };
                        });

                        const myLeave = leaves.find(l => l.start.startsWith(dateStr) && l.status !== 'rejected' && l.requesterName === tu.name); 
                        const myClock = clockIns.find(c => c.date === dateStr && c.userId === (tu.docId || tu.uid));

                        let status = '正常';
                        const isExternal = myWork.some(w => w.tag && EXTERNAL_WORK_TAGS.includes(w.tag.item));
                        
                        const officialLeaves = ["公出", "公假", "出差"];
                        const isOfficialLeave = myLeave && officialLeaves.includes(myLeave.type);
                        const isPersonalLeave = myLeave && !officialLeaves.includes(myLeave.type);

                        if (isExternal && !myLeave) status = '缺公務單';
                        else if (isExternal && isPersonalLeave) status = '假別不符';
                        else if (!myWork.length && isOfficialLeave) status = '異常公出';
                        else if (myLeave) {
                            if (myLeave.status === 'pending') status = '待職代審查中';
                            else if (myLeave.status === 'deputy_signed') status = '組長審查中';
                            else if (myLeave.status === 'approved') status = '已核准';
                            else if (myLeave.status === 'rejected') status = '已駁回';
                        }
                        else if (myWork.length > 0) status = '內勤';
                        else status = '無行程';

                        if (myWork.length > 0 || myLeave || myClock || viewUser !== 'all') { 
                            data.push({ name: tu.name, date: dateStr, work: myWork, leave: myLeave, clock: myClock, status });
                        }
                    }
                });
                return data.sort((a,b) => a.date.localeCompare(b.date)); 
            }, [events, leaves, clockIns, month, targetUsers, viewUser]);

            const flatRows = useMemo(() => {
                let rows = [];
                scheduleData.forEach((d, idx) => {
                    const renders = d.work.length > 0 ? d.work : [{ isLeaveOnly: true }];
                    renders.forEach((w, subIdx) => {
                        rows.push({
                            id: `${d.name}-${d.date}-${subIdx}`,
                            name: d.name,
                            date: d.date,
                            slot: w.isLeaveOnly ? 'all_day' : w.slot,
                            leaveType: d.leave?.type || '-',
                            leaveHours: d.leave?.hours || '-',
                            leaveId: d.leave?.id, 
                            content: w.isLeaveOnly ? '' : (w.tag?.item || ''),
                            area: w.isLeaveOnly ? '' : (w.tag?.area || ''),
                            reason: d.leave?.reason || '-',
                            note: w.isLeaveOnly ? '-' : (w.tag?.note || '-'),
                            status: d.status,
                            clockIn: d.clock?.clockIn || '',
                            clockOut: d.clock?.clockOut || ''
                        });
                    });
                });
                return rows;
            }, [scheduleData]);

            const filteredRows = useMemo(() => {
                let fr = flatRows;
                if (viewUser === 'all') fr = fr.filter(r => r.content !== '' || r.leaveType !== '-'); 
                if (leaveFilter !== 'all') fr = fr.filter(r => r.leaveType === leaveFilter);
                return fr;
            }, [flatRows, leaveFilter, viewUser]);

            const isAllSelected = filteredRows.length > 0 && selectedIds.length === filteredRows.length;
            const toggleAll = () => { if (isAllSelected) setSelectedIds([]); else setSelectedIds(filteredRows.map(r => r.id)); };
            const toggleOne = (id) => { setSelectedIds(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]); };

            const handleDeleteLeave = async (leaveId) => {
                if (confirm('確定要撤銷此假單嗎？撤銷後如果有排班，會重新提示您送差單。')) {
                    try {
                        await crud.deleteLeave(leaveId);
                        alert("假單已成功撤銷！");
                    } catch(e) { alert("撤銷失敗: " + e.message); }
                }
            };

            const downloadBatchICS = () => {
                const selectedRowsData = filteredRows.filter(r => selectedIds.includes(r.id) && (r.content || r.leaveType !== '-'));
                if (selectedRowsData.length === 0) { alert("請先勾選要加入行事曆的項目！"); return; }

                let icsContent = "BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Attendance System//TW\r\nCALSCALE:GREGORIAN\r\n";
                icsContent += "BEGIN:VTIMEZONE\r\nTZID:Asia/Taipei\r\nBEGIN:STANDARD\r\nTZOFFSETFROM:+0800\r\nTZOFFSETTO:+0800\r\nTZNAME:CST\r\nDTSTART:19700101T000000\r\nEND:STANDARD\r\nEND:VTIMEZONE\r\n";

                selectedRowsData.forEach((item, index) => {
                    const dStr = item.date.replace(/-/g, '');
                    let start = '', end = '';

                    if (item.slot === 'morning') { start = `${dStr}T080000`; end = `${dStr}T120000`; } 
                    else if (item.slot === 'afternoon') { start = `${dStr}T130000`; end = `${dStr}T170000`; } 
                    else { start = `${dStr}T080000`; end = `${dStr}T170000`; }

                    const title = item.content || item.leaveType || '排班';
                    let desc = item.note !== '-' ? item.note : '';
                    if (item.leaveType !== '-') desc += `\\n假別: ${item.leaveType} (${item.leaveHours}hr)`;
                    if (item.reason !== '-') desc += `\\n事由: ${item.reason}`;

                    icsContent += "BEGIN:VEVENT\r\n";
                    icsContent += `UID:event-${dStr}-${index}@attendancesystem.local\r\n`;
                    icsContent += `DTSTAMP:${new Date().toISOString().replace(/[-:]/g, '').split('.')[0]}Z\r\n`;
                    icsContent += `DTSTART;TZID=Asia/Taipei:${start}\r\n`;
                    icsContent += `DTEND;TZID=Asia/Taipei:${end}\r\n`;
                    icsContent += `SUMMARY:[出勤] ${title}\r\n`;
                    if (item.area) icsContent += `LOCATION:${item.area}\r\n`;
                    if (desc) icsContent += `DESCRIPTION:${desc}\r\n`;
                    icsContent += "END:VEVENT\r\n";
                });
                icsContent += "END:VCALENDAR";
                const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
                const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = `出勤行事曆_${month}.ics`; link.click();
            };

            const exportCSV = () => {
                let csv = "\uFEFF姓名,日期,時間,假別,時數,排班內容,事由,備註,狀態(同意)\n";
                filteredRows.forEach(r => {
                     const time = TIME_SLOTS.find(s=>s.id===r.slot)?.label||'整天';
                     const content = `${r.content}${r.area ? `(${r.area})` : ''}`;
                     csv += `${r.name},${r.date},${time},${r.leaveType},${r.leaveHours},${content},${r.reason},${r.note},${r.status}\n`;
                });
                const link = document.createElement("a");
                link.href = encodeURI("data:text/csv;charset=utf-8,"+csv);
                link.download = `差勤一覽表_${month}.csv`;
                link.click();
            };

            const exportOfficialDoc = () => {
                if (viewUser === 'all') { alert("請先從左上角選擇一位特定員工再匯出簽到表！"); return; }
                const tu = targetUsers[0];
                const parts = month.split('-');
                const twYear = parseInt(parts[0], 10) - 1911;
                const m = parseInt(parts[1], 10);
                const daysInMonth = new Date(parts[0], parts[1], 0).getDate();
                const fullName = tu.lastName ? tu.lastName + tu.name : tu.name;

                let tableRows = '';
                for(let i=1; i<=15; i++) {
                    const dayL = i; const dayR = i + 15;
                    const getCellData = (dayNum) => {
                        if (dayNum > daysInMonth) return { empty: true };
                        const dStr = `${month}-${String(dayNum).padStart(2,'0')}`;
                        const dObj = new Date(dStr);
                        
                        // 🌟 整合自訂節假日 (全域設定)
                        const override = globalSettings.calendarOverrides?.[dStr];
                        let isHoliday = !!TAIWAN_HOLIDAYS_2026[dStr];
                        let isWeekend = dObj.getDay() === 0 || dObj.getDay() === 6;
                        let holidayName = TAIWAN_HOLIDAYS_2026[dStr];

                        if (override) {
                            if (override.type === 'holiday') { isHoliday = true; isWeekend = true; holidayName = override.name; } 
                            else if (override.type === 'workday') { isHoliday = false; isWeekend = false; }
                        }
                        
                        const myLeave = leaves.find(l => l.start.startsWith(dStr) && l.status === 'approved' && l.requesterName === tu.name);
                        const myClock = clockIns.find(c => c.date === dStr && c.userId === (tu.docId || tu.uid));

                        if (isWeekend || isHoliday) return { type: 'holiday', text: holidayName || '例 假 日' };
                        if (myLeave) return { type: 'leave', text: myLeave.type };
                        
                        let amIn = '', amOut = '', pmIn = '', pmOut = '';
                        if (myClock) {
                            if (myClock.clockIn) {
                                const inTime = myClock.clockIn;
                                if (inTime < "12:00") { amIn = inTime; amOut = "12:00"; pmIn = "13:00"; }
                                else { pmIn = inTime; }
                            }
                            if (myClock.clockOut) {
                                const outTime = myClock.clockOut;
                                if (outTime > "13:00") { pmOut = outTime; }
                                else { amOut = outTime; pmIn = ""; }
                            }
                        }
                        return { type: 'work', amIn, amOut, pmIn, pmOut };
                    };

                    const lData = getCellData(dayL); const rData = getCellData(dayR);

                    let tr1 = `<tr><td rowspan="2" align="center">${String(dayL).padStart(2,'0')}</td>`;
                    if (lData.empty) tr1 += `<td colspan="2"></td>`;
                    else if (lData.type === 'holiday' || lData.type === 'leave') tr1 += `<td colspan="2" rowspan="2" align="center">${lData.text}</td>`;
                    else tr1 += `<td align="center">${lData.amIn}</td><td align="center">${lData.amOut}</td>`;

                    tr1 += `<td rowspan="2" align="center">${dayR > daysInMonth ? '' : dayR}</td>`;
                    if (rData.empty) tr1 += `<td colspan="2"></td>`;
                    else if (rData.type === 'holiday' || rData.type === 'leave') tr1 += `<td colspan="2" rowspan="2" align="center">${rData.text}</td>`;
                    else tr1 += `<td align="center">${rData.amIn}</td><td align="center">${rData.amOut}</td>`;
                    tr1 += `</tr>`;

                    let tr2 = `<tr>`;
                    if (!lData.empty && lData.type === 'work') tr2 += `<td align="center">${lData.pmIn}</td><td align="center">${lData.pmOut}</td>`;
                    if (!rData.empty && rData.type === 'work') tr2 += `<td align="center">${rData.pmIn}</td><td align="center">${rData.pmOut}</td>`;
                    tr2 += `</tr>`;

                    tableRows += tr1 + tr2;
                }

                // 處理第31天的備註格
                const override31 = globalSettings.calendarOverrides?.[`${month}-31`];
                let isHol31 = !!TAIWAN_HOLIDAYS_2026[`${month}-31`] || new Date(`${month}-31`).getDay() === 0 || new Date(`${month}-31`).getDay() === 6;
                let text31 = '例 假 日';
                if (override31) {
                    if (override31.type === 'workday') isHol31 = false;
                    else { isHol31 = true; text31 = override31.name; }
                }

                const footerRows = `
                <tr>
                    <td colspan="6" rowspan="4" style="text-align: left; font-size: 12px; padding: 10px; line-height: 1.5;">備註：<br>1.計畫人員請依照上、下班時間確實辦理簽到(退)，如有不實願依本校規定懲處，並與計畫主持人負一切法律責任。<br>2.本表請填列一式二份，請於申請次月薪資時併同檢附，由主計室及人事室各留存一份，俾利作為是否扣薪依據。<br>3.如當日因請假而未出勤，請於當日欄位填寫假別。相關請假及扣薪規定，請依勞動基準法、性別工作平等法及勞工請假規則辦理。<br>　□事假(含家庭照顧假)共_____時；扣薪：__________(月薪) ÷ 30天 ÷ 8 × _______ (事假時數) = _____________元。<br>　□病假(含生理假)共_____時；扣薪：__________ (月薪) ÷ 30天 ÷ 8 ÷ 2 × _______(病假時數) =____________元。</td>
                    <td align="center">31</td><td colspan="2" align="center">${daysInMonth === 31 ? (isHol31 ? text31 : '') : ''}</td>
                </tr>
                <tr><td colspan="3" align="left">本人簽章：</td></tr><tr><td colspan="3" align="left">計畫主持人簽章：</td></tr><tr><td colspan="3" align="left">單位主管簽章：</td></tr>`;

                const htmlContent = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><title>簽到表</title><style>body { font-family: '標楷體', 'DFKai-SB', serif; font-size: 14px; } h2 { text-align: center; margin: 5px 0; font-size: 18px; } p { text-align: center; margin: 5px 0 15px; font-size: 14px; } table { border-collapse: collapse; width: 100%; border: 1px solid black; } td, th { border: 1px solid black; padding: 4px; }</style></head><body><h2>國立高雄師範大學計畫專任人力簽到表</h2><p>年度及月份： ${twYear} 年 ${m} 月</p><table><tr><td width="10%">姓名</td><td width="15%" colspan="2">${fullName}</td><td width="10%" colspan="2">單位</td><td width="25%" colspan="2">校務研究中心<br>(高屏澎東區職務再設計專案單位)</td><td width="10%">經費來源</td><td width="30%">□教育部 □國科會 □產學合作<br>■其他，勞動部勞動力發展署高屏澎東分署</td></tr><tr><td>計畫編號</td><td colspan="2">A146226</td><td colspan="2">計畫名稱</td><td colspan="4">高屏澎東區職務再設計專案單位(高屏澎東分署)</td></tr><tr align="center" style="font-weight: bold;"><td>日期</td><td>上午上班時間<br>下午上班時間</td><td>上午下班時間<br>下午下班時間</td><td>日期</td><td>上午上班時間<br>下午上班時間</td><td>上午下班時間<br>下午下班時間</td></tr>${tableRows}${footerRows}</table></body></html>`;

                const blob = new Blob(['\ufeff', htmlContent], { type: 'application/msword' });
                const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = `簽到表_${fullName}_${twYear}年${m}月.doc`; link.click();
            };

            return (
                <div className="max-w-6xl mx-auto space-y-6">
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center bg-white p-4 rounded shadow-sm gap-4">
                        <h2 className="text-xl font-bold flex items-center gap-2"><FileText/> 差勤一覽表</h2>
                        <div className="flex flex-wrap gap-4 w-full md:w-auto">
                            <select value={viewUser} onChange={e => setViewUser(e.target.value)} className="border p-2 rounded text-sm font-bold text-indigo-700 bg-indigo-50 border-indigo-200">
                                <option value={user.name}>看我的出勤</option>
                                <option value="all">看全團隊出勤</option>
                                {users.filter(u => u.name !== user.name).map(u => <option key={u.docId} value={u.name}>{u.name}</option>)}
                            </select>
                            <input type="month" className="border p-2 rounded text-sm flex-1 md:flex-none" value={month} onChange={e=>setMonth(e.target.value)} />
