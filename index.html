<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>差勤排班系統</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Babel for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Import Map for ES Modules -->
    <script type="importmap">
        {
            "imports": {
                "react": "https://esm.sh/react@18.2.0",
                "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
                "lucide-react": "https://esm.sh/lucide-react@0.292.0?deps=react@18.2.0",
                "firebase/app": "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js",
                "firebase/analytics": "https://www.gstatic.com/firebasejs/11.6.1/firebase-analytics.js"
            }
        }
    </script>
</head>
<body class="bg-gray-50">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useMemo, useRef } from 'react';
        import { createRoot } from 'react-dom/client';
        import { initializeApp } from 'firebase/app';
        import { getAnalytics } from 'firebase/analytics';
        import { 
          getFirestore, collection, addDoc, query, where, onSnapshot, 
          updateDoc, doc, deleteDoc, orderBy, setDoc, getDoc 
        } from 'firebase/firestore';
        import { 
          getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, signInAnonymously, signInWithCustomToken, GoogleAuthProvider, signInWithPopup
        } from 'firebase/auth';
        import { 
          Calendar, User, Users, ClipboardList, LogOut, Plus, CheckCircle, XCircle, AlertCircle,
          Menu, Settings, Sun, CloudRain, Briefcase, LayoutDashboard,
          Sparkles, MapPin, Tag, WifiOff, FileSpreadsheet, Calculator, X, ChevronLeft, ChevronRight,
          Clock, RefreshCw, Trash2, List, AlertTriangle, ArrowRight, Lock, Palette, Edit, FileText, Info, Edit2, Play, Square,
          Image as ImageIcon, Camera, Moon, SidebarClose, SidebarOpen, Shield, UserCog, Mail, Loader2
        } from 'lucide-react';

        // --- Firebase 綁定設定 (已寫死) ---
        const MANUAL_CONFIG = {
            apiKey: "AIzaSyBQ6ttl2QlbQbM4lO_faSEyIK1EVZy5jH4",
            authDomain: "kpptjawork.firebaseapp.com",
            projectId: "kpptjawork",
            storageBucket: "kpptjawork.firebasestorage.app",
            messagingSenderId: "1082378001168",
            appId: "1:1082378001168:web:fc12acdeed9ebece762395",
            measurementId: "G-48TSVTHBDM"
        };
        const APP_ID = 'kpptjawork';
        // -----------------------------------------------------------

        // --- Global Constants ---
        const WEATHER_LOCATIONS = [
          { location: '高雄', icon: <Sun className="text-orange-500" />, temp: '29°C' },
          { location: '屏東', icon: <Sun className="text-yellow-500" />, temp: '30°C' },
          { location: '台東', icon: <CloudRain className="text-blue-400" />, temp: '26°C' },
          { location: '澎湖', icon: <Sun className="text-orange-400" />, temp: '27°C' },
        ];

        const TAIWAN_HOLIDAYS_2026 = {
            "2026-01-01": "元旦", "2026-02-17": "除夕", "2026-02-18": "春節",
            "2026-02-19": "春節", "2026-02-20": "春節", "2026-02-28": "二二八",
            "2026-04-04": "兒童節", "2026-04-05": "清明節", "2026-06-19": "端午節",
            "2026-09-26": "中秋節", "2026-10-10": "國慶日"
        };

        const DEFAULT_LEAVE_TYPES = [
          "公出", "事假", "公假", "病假", "休假", "補休", "出差", 
          "加班申請", "喪假", "生理假", "家庭照顧假", "婚假", "產假", "產前假", "陪產假", "榮譽假"
        ];

        const DEFAULT_ROLE_NAMES = {
            staff: '專員',
            leader: '組長',
            admin: '管理員'
        };

        const EXTERNAL_WORK_TAGS = ["訪視", "出差", "受訓", "開會", "公出"];
        const DEFAULT_WORK_TAGS = ["審查會", "訪視", "成效", "試用", "OFF", "專案報告", "大宗案件", "月報"];
        const DEFAULT_AREA_TAGS = ["高雄", "澎湖", "台東", "屏東", "就業通", "訓就", "分署"];

        const DEFAULT_ROTATION_RULES = [
          { id: 'visit', name: '澎東訪視', matchTag: '訪視', order: ['高湘怡', '黃國裕', '方姿云', '陳秋媚', '蔡凱宇', '盧怡倫'] },
          { id: 'project', name: '專案報告', matchTag: '專案報告', order: ['盧怡倫', '高湘怡', '黃國裕', '方姿云', '蔡凱宇', '陳秋媚'] },
          { id: 'large', name: '大宗案件', matchTag: '大宗案件', order: ['高湘怡', '黃國裕', '盧怡倫', '陳秋媚', '蔡凱宇', '方姿云'] },
          { id: 'monthly', name: '月報', matchTag: '月報', order: ['陳秋媚', '蔡凱宇', '方姿云', '盧怡倫', '高湘怡'] },
        ];

        const TIME_SLOTS = [
            { id: 'morning', label: '上午', color: 'bg-sky-100 text-sky-900 border-sky-200' },
            { id: 'afternoon', label: '下午', color: 'bg-sky-200 text-sky-950 border-sky-300' },
            { id: 'all_day', label: '整天', color: 'bg-sky-600 text-white border-sky-700' },
        ];

        const DEFAULT_AREA_COLORS = {
            "高雄": "bg-red-100 text-red-800",
            "澎湖": "bg-orange-100 text-orange-800",
            "台東": "bg-green-100 text-green-800",
            "屏東": "bg-yellow-100 text-yellow-800",
            "就業通": "bg-purple-100 text-purple-800",
            "訓就": "bg-pink-100 text-pink-800",
            "分署": "bg-gray-100 text-gray-800"
        };

        // 🌟 新增：預設名單與權限 (加上 Tony 測試帳號)
        const PREDEFINED_USERS = [
            { email: 'kaiyu097@gmail.com', name: '凱宇', role: 'admin', initials: '宇', color: 'bg-purple-200', borderColor: '#a855f7' },
            { email: 'n85551@gmail.com', name: '國裕', role: 'leader', initials: '裕', color: 'bg-blue-200', borderColor: '#3b82f6' },
            { email: 'hkkwork@gmail.com', name: '湘怡', role: 'staff', initials: '湘', color: 'bg-red-200', borderColor: '#ef4444' },
            { email: 'judyfang1226@gmail.com', name: '姿云', role: 'staff', initials: '姿', color: 'bg-green-200', borderColor: '#22c55e' },
            { email: 'kppt1110601@gmail.com', name: '秋媚', role: 'staff', initials: '媚', color: 'bg-yellow-200', borderColor: '#eab308' },
            { email: 'yilun1208@gmail.com', name: '怡倫', role: 'staff', initials: '倫', color: 'bg-pink-200', borderColor: '#ec4899' },
            { email: 'tony0972022@gmail.com', name: 'Tony測試', role: 'staff', initials: '測', color: 'bg-gray-200', borderColor: '#9ca3af' }
        ];

        // --- Helper: Send Mail ---
        const openMailClient = (to, subject, body) => {
            if (!to) {
                alert("未找到收件人的 Email，無法開啟郵件軟體。");
                return;
            }
            const link = `mailto:${to}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
            window.location.href = link;
        };

        // --- Helper Component: User Avatar ---
        const UserAvatar = ({ user, size = "w-8 h-8", textSize = "text-xs", className = "" }) => {
            if (!user) return <div className={`${size} rounded-full bg-gray-200 ${className}`}></div>;
            
            const showPhoto = user.usePhoto && user.avatarUrl;
            const borderColor = user.borderColor || 'transparent';
            
            if (showPhoto) {
                return (
                    <div 
                        className={`${size} rounded-full border-2 p-[1px] bg-white overflow-hidden relative ${className}`} 
                        style={{ borderColor: borderColor }}
                    >
                        <img src={user.avatarUrl} alt={user.name} className="w-full h-full rounded-full object-cover" />
                    </div>
                );
            }
            return (
                <div 
                    className={`${size} rounded-full flex items-center justify-center font-bold border-2 ${user.color || 'bg-gray-200'} ${textSize} text-gray-800 ${className}`}
                    style={{ borderColor: borderColor }}
                >
                    {user.initials || '?'}
                </div>
            );
        };

        // --- Main App Component ---
        function App() {
          const [user, setUser] = useState(null); 
          const [userData, setUserData] = useState(null);
          const [view, setView] = useState('dashboard');
          const [usersList, setUsersList] = useState([]);
          const [leaves, setLeaves] = useState([]);
          const [calendarEvents, setCalendarEvents] = useState([]);
          const [workTags, setWorkTags] = useState(DEFAULT_WORK_TAGS);
          const [areaTags, setAreaTags] = useState(DEFAULT_AREA_TAGS);
          const [leaveTypes, setLeaveTypes] = useState(DEFAULT_LEAVE_TYPES);
          const [rotationRules, setRotationRules] = useState(DEFAULT_ROTATION_RULES);
          const [roleNames, setRoleNames] = useState(DEFAULT_ROLE_NAMES);
          
          const [isSidebarOpen, setIsSidebarOpen] = useState(false); 
          const [isDesktopCollapsed, setIsDesktopCollapsed] = useState(false); 
          const [sidebarTheme, setSidebarTheme] = useState('light'); 

          const [settings, setSettings] = useState({
            areaColors: DEFAULT_AREA_COLORS
          });
          
          const [loading, setLoading] = useState(true);
          const [db, setDb] = useState(null);
          const [auth, setAuth] = useState(null);

          const handleUpdateRoleNames = (newNames) => {
              setRoleNames(newNames);
              localStorage.setItem('roleNames', JSON.stringify(newNames));
          };

          useEffect(() => {
            const savedTheme = localStorage.getItem('sidebarTheme');
            if (savedTheme) setSidebarTheme(savedTheme);
            const savedCollapsed = localStorage.getItem('isDesktopCollapsed');
            if (savedCollapsed) setIsDesktopCollapsed(JSON.parse(savedCollapsed));
            const savedRoleNames = localStorage.getItem('roleNames');
            if (savedRoleNames) setRoleNames(JSON.parse(savedRoleNames));
            const savedAreaColors = localStorage.getItem('areaColors');
            if(savedAreaColors) setSettings(prev => ({...prev, areaColors: JSON.parse(savedAreaColors)}));
            const savedLeaveTypes = localStorage.getItem('leaveTypes');
            if(savedLeaveTypes) setLeaveTypes(JSON.parse(savedLeaveTypes));
            const savedRotationRules = localStorage.getItem('rotationRules');
            if(savedRotationRules) setRotationRules(JSON.parse(savedRotationRules));
            const savedWT = localStorage.getItem('workTags');
            if (savedWT) setWorkTags(JSON.parse(savedWT));
            const savedAT = localStorage.getItem('areaTags');
            if (savedAT) setAreaTags(JSON.parse(savedAT));

            const init = async () => {
                try {
                    const app = initializeApp(MANUAL_CONFIG);
                    try { getAnalytics(app); } catch(err) { console.warn("Analytics loading skipped", err); }

                    const authInstance = getAuth(app);
                    const dbInstance = getFirestore(app);
                    setAuth(authInstance);
                    setDb(dbInstance);

                    onAuthStateChanged(authInstance, async (u) => {
                        if (u) {
                            setUser(u);
                            try {
                                // 🌟 核心修改：改用 email 當作唯一的資料庫文件 ID (預防建立重複帳號)
                                const docId = u.email ? u.email.toLowerCase() : u.uid;
                                const userRef = doc(dbInstance, 'artifacts', APP_ID, 'public', 'data', 'user_profiles', docId);
                                const snap = await getDoc(userRef);
                                
                                const matchedUser = PREDEFINED_USERS.find(p => p.email.toLowerCase() === (u.email || '').toLowerCase());

                                if (snap.exists()) {
                                    let currentData = snap.data();
                                    let needsUpdate = false;

                                    // 確保 uid 是最新的真實 Google UID (避免一鍵匯入時殘留舊設定)
                                    if (currentData.uid !== u.uid) {
                                        currentData.uid = u.uid;
                                        needsUpdate = true;
                                    }

                                    // 若在預設名單且與目前權限/名字不符，進行自動修復
                                    if (matchedUser && (currentData.role !== matchedUser.role || currentData.name !== matchedUser.name)) {
                                        currentData = { ...currentData, role: matchedUser.role, name: matchedUser.name, initials: matchedUser.initials, color: matchedUser.color, borderColor: matchedUser.borderColor };
                                        needsUpdate = true;
                                    }

                                    if (needsUpdate) await updateDoc(userRef, currentData);
                                    setUserData({ ...currentData, docId });
                                } else {
                                    const newP = { 
                                        uid: u.uid, 
                                        email: u.email || '', 
                                        name: matchedUser ? matchedUser.name : (u.displayName || '新成員'), 
                                        role: matchedUser ? matchedUser.role : 'staff', 
                                        initials: matchedUser ? matchedUser.initials : (u.displayName ? u.displayName.slice(0, 1) : '新'), 
                                        color: matchedUser ? matchedUser.color : 'bg-blue-200',
                                        usePhoto: !!u.photoURL,
                                        avatarUrl: u.photoURL || '',
                                        borderColor: matchedUser ? matchedUser.borderColor : '#3b82f6'
                                    };
                                    await setDoc(userRef, newP);
                                    setUserData({ ...newP, docId });
                                }
                            } catch(e) { 
                                console.error("Profile fetch error", e); 
                                alert("資料庫連線或權限設定錯誤！請檢查 Firestore Rules。\n錯誤訊息: " + e.message);
                                await signOut(authInstance); 
                            }
                        } else {
                            setUser(null);
                            setUserData(null);
                        }
                        setLoading(false);
                    });
                } catch (e) {
                    console.error("Firebase Init Error", e);
                    setLoading(false);
                }
            };
            init();
          }, []);

          // Data Synchronization
          useEffect(() => {
            if (!db || !user) return;

            const unsubLeaves = onSnapshot(query(collection(db, 'artifacts', APP_ID, 'public', 'data', 'leaves')), 
              (s) => setLeaves(s.docs.map(d => ({id:d.id, ...d.data()}))),
              (e) => console.error("Leaves sync error", e)
            );
              
            const unsubEvents = onSnapshot(query(collection(db, 'artifacts', APP_ID, 'public', 'data', 'calendar_events')), 
              (s) => setCalendarEvents(s.docs.map(d => ({id:d.id, ...d.data()}))),
              (e) => console.error("Events sync error", e)
            );

            // 確保有加上 docId 供前端對應
            const unsubUsers = onSnapshot(query(collection(db, 'artifacts', APP_ID, 'public', 'data', 'user_profiles')),
              (s) => setUsersList(s.docs.map(d => ({ docId: d.id, ...d.data() }))),
              (e) => console.error("Users sync error", e)
            );

            return () => { unsubLeaves(); unsubEvents(); unsubUsers(); };
          }, [db, user]);

          const handleLogout = async () => {
              if(auth) await signOut(auth);
          };

          const handleUpdateSettings = (s) => {
              setSettings(s);
              if(s.areaColors) localStorage.setItem('areaColors', JSON.stringify(s.areaColors));
          };
          
          const handleUpdateProfile = async (newProfile) => {
              try {
                  const docId = userData.email ? userData.email.toLowerCase() : user.uid;
                  await updateDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'user_profiles', docId), newProfile);
                  setUserData(prev => ({...prev, ...newProfile}));
                  alert("個人設定已更新");
              } catch(e) {
                  alert("更新失敗: " + e.message);
              }
          };

          const handleUpdateRotationRules = (newRules) => {
              setRotationRules(newRules);
              localStorage.setItem('rotationRules', JSON.stringify(newRules));
          };

          const handleAddTag = (type, val) => {
              if(!val) return;
              if(type==='work') {
                  const t = [...workTags, val];
                  setWorkTags(t);
                  localStorage.setItem('workTags', JSON.stringify(t));
              } else {
                  const t = [...areaTags, val];
                  setAreaTags(t);
                  localStorage.setItem('areaTags', JSON.stringify(t));
              }
          };

          const handleDeleteTag = (type, val) => {
              if(!confirm("確定要刪除此項目嗎？")) return;
              if(type==='work') {
                  const t = workTags.filter(item => item !== val);
                  setWorkTags(t);
                  localStorage.setItem('workTags', JSON.stringify(t));
              } else {
                  const t = areaTags.filter(item => item !== val);
                  setAreaTags(t);
                  localStorage.setItem('areaTags', JSON.stringify(t));
              }
          };

          const handleManageLeaveTypes = (action, val) => {
              if(action === 'add' && val) {
                  const newTypes = [...leaveTypes, val];
                  setLeaveTypes(newTypes);
                  localStorage.setItem('leaveTypes', JSON.stringify(newTypes));
              } else if (action === 'delete') {
                  if(!confirm("確定要刪除此假別嗎？")) return;
                  const newTypes = leaveTypes.filter(t => t !== val);
                  setLeaveTypes(newTypes);
                  localStorage.setItem('leaveTypes', JSON.stringify(newTypes));
              }
          }

          const toggleSidebarTheme = () => {
              const newTheme = sidebarTheme === 'light' ? 'dark' : 'light';
              setSidebarTheme(newTheme);
              localStorage.setItem('sidebarTheme', newTheme);
          }

          const toggleDesktopSidebar = () => {
              const newState = !isDesktopCollapsed;
              setIsDesktopCollapsed(newState);
              localStorage.setItem('isDesktopCollapsed', JSON.stringify(newState));
          }

          const crud = {
              createEvent: async (d) => addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'calendar_events'), d),
              deleteEvent: async (id) => deleteDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'calendar_events', id)),
              deleteEventsByGroup: async (gid) => {
                  const toDel = calendarEvents.filter(e=>e.groupId===gid);
                  toDel.forEach(e => deleteDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'calendar_events', e.id)));
              },
              createLeave: async (d) => addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'leaves'), d),
              updateLeave: async (id, data) => updateDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'leaves', id), { ...data, approvalDate: new Date() })
          };

          if (loading) return (
              <div className="h-screen flex flex-col items-center justify-center bg-gray-50 text-gray-600 gap-4">
                  <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
                  <div className="text-lg font-medium">連線至雲端資料庫...</div>
              </div>
          );

          if (!user || !userData) return <LoginScreen auth={auth} />;

          const pendingApprovalCount = (userData.role === 'leader' || userData.role === 'admin') 
            ? leaves.filter(l => l.status === 'deputy_signed').length
            : 0;
          const myPendingDeputy = leaves.filter(l => l.deputyId === userData.uid || l.deputyId === (userData.email || '').toLowerCase()).filter(l => l.status === 'pending').length;
          const totalAlert = pendingApprovalCount + myPendingDeputy;

          const isLight = sidebarTheme === 'light';
          const sidebarBg = isLight ? 'bg-white border-r border-gray-200 text-gray-800' : 'bg-slate-800 text-gray-100 border-r border-slate-700';
          const sidebarHover = isLight ? 'hover:bg-gray-100' : 'hover:bg-slate-700';
          const sidebarActive = isLight ? 'bg-blue-600 text-white shadow-md' : 'bg-blue-600 text-white shadow-lg';
          const sidebarTextSec = isLight ? 'text-gray-500' : 'text-slate-400';
          const sidebarProfileBg = isLight ? 'bg-gray-50' : 'bg-slate-900/50';
          const iconColor = isLight ? 'text-blue-600' : 'text-blue-400';
          const userDisplayRole = userData.role === 'admin' ? roleNames['staff'] : roleNames[userData.role];

          return (
            <div className="flex h-screen bg-gray-50 overflow-hidden font-sans text-gray-800 relative">
              
              {isSidebarOpen && (
                <div className="fixed inset-0 bg-black/50 z-40 md:hidden" onClick={() => setIsSidebarOpen(false)}></div>
              )}

              <div className={`
                fixed md:relative inset-y-0 left-0 z-50 flex flex-col shadow-lg transition-all duration-300 ${sidebarBg}
                ${isSidebarOpen ? 'translate-x-0 w-64' : '-translate-x-full md:translate-x-0'}
                ${isDesktopCollapsed ? 'md:w-20' : 'md:w-64'}
              `}>
                <div className={`p-4 border-b flex items-center ${isLight ? 'border-gray-200' : 'border-slate-700'} ${isDesktopCollapsed ? 'justify-center' : 'justify-between'}`}>
                  {!isDesktopCollapsed && (
                      <div className="flex items-center gap-2">
                        <Calendar className={iconColor}/> 
                        <span className="font-bold text-lg">差勤排班</span>
                      </div>
                  )}
                  {isDesktopCollapsed && <Calendar className={iconColor}/>}
                  
                  <button className="md:hidden" onClick={()=>setIsSidebarOpen(false)}><X size={20}/></button>
                  <button 
                    className={`hidden md:flex p-1 rounded hover:bg-opacity-20 ${isLight?'hover:bg-gray-300':'hover:bg-slate-600'}`} 
                    onClick={toggleDesktopSidebar}
                    title={isDesktopCollapsed ? "展開選單" : "收合選單"}
                  >
                    {isDesktopCollapsed ? <ChevronRight size={18}/> : <ChevronLeft size={18}/>}
                  </button>
                </div>
                
                <div 
                    className={`p-4 flex items-center gap-3 border-b cursor-pointer transition ${sidebarProfileBg} ${isLight ? 'border-gray-200' : 'border-slate-700'} ${sidebarHover} ${isDesktopCollapsed ? 'justify-center' : ''}`} 
                    onClick={()=>setView('profile')}
                    title="個人設定"
                >
                  <UserAvatar user={userData} size="w-10 h-10" textSize="text-sm" className="shrink-0" />
                  {!isDesktopCollapsed && (
                      <div className="overflow-hidden">
                        <p className="font-medium truncate">{userData.name}</p>
                        <span className={`text-xs px-2 py-0.5 rounded-full font-medium ${isLight ? 'bg-gray-200 text-gray-700' : 'bg-slate-700 text-gray-300'}`}>
                            {userDisplayRole}
                        </span>
                      </div>
                  )}
                </div>

                <nav className="flex-1 overflow-y-auto py-2 overflow-x-hidden">
                  {[
                    {id:'dashboard', icon:<LayoutDashboard size={20}/>, label:'儀表板'},
                    {id:'calendar', icon:<Calendar size={20}/>, label:'排班日曆'},
                    {id:'leave', icon:<ClipboardList size={20}/>, label:'差勤填寫'},
                    ...(userData.role !== 'staff' ? [{id:'approval', icon:<CheckCircle size={20}/>, label:'差單審核', count: totalAlert}] : []),
                    {id:'personal', icon:<FileText size={20}/>, label:'個人班表'},
                    {id:'profile', icon:<UserCog size={20}/>, label:'個人設定'},
                    ...(userData.role === 'admin' ? [{id:'management', icon:<List size={20}/>, label:'項目管理'}] : []),
                    ...(userData.role === 'admin' ? [{id:'members', icon:<Users size={20}/>, label:'成員管理'}] : []),
                    ...(userData.role === 'admin' ? [{id:'settings', icon:<Settings size={20}/>, label:'系統設定'}] : [])
                  ].map(item => (
                    <button 
                      key={item.id}
                      onClick={() => { setView(item.id); setIsSidebarOpen(false); }}
                      className={`w-full flex items-center px-4 py-3 transition mb-1
                        ${isDesktopCollapsed ? 'justify-center' : 'justify-between'}
                        ${view===item.id ? sidebarActive : `text-gray-500 ${sidebarHover} ${!isLight && 'text-slate-400 hover:text-white'}`}
                      `}
                      title={isDesktopCollapsed ? item.label : ""}
                    >
                      <div className={`flex items-center gap-3 ${isDesktopCollapsed ? '' : 'w-full'}`}>
                          <div className="shrink-0">{item.icon}</div>
                          {!isDesktopCollapsed && <span>{item.label}</span>}
                      </div>
                      {!isDesktopCollapsed && item.count > 0 && <span className={`${view===item.id ? 'bg-white text-blue-600' : 'bg-red-500 text-white'} text-[10px] px-1.5 py-0.5 rounded-full font-bold ml-auto`}>{item.count}</span>}
                      {isDesktopCollapsed && item.count > 0 && <div className="absolute top-1 right-2 w-2.5 h-2.5 bg-red-500 rounded-full border-2 border-white"></div>}
                    </button>
                  ))}
                </nav>
                
                <div className={`p-4 border-t space-y-2 ${isLight ? 'border-gray-200' : 'border-slate-700'}`}>
                   <button 
                     onClick={toggleSidebarTheme}
                     className={`flex items-center gap-3 w-full px-2 py-2 rounded transition ${sidebarTextSec} ${sidebarHover} ${isDesktopCollapsed ? 'justify-center' : ''}`}
                     title={isLight ? "切換至深色模式" : "切換至淺色模式"}
                   >
                     {isLight ? <Moon size={18} /> : <Sun size={18} />}
                     {!isDesktopCollapsed && <span>{isLight ? "深色模式" : "淺色模式"}</span>}
                   </button>
                   <button 
                     onClick={handleLogout} 
                     className={`flex items-center gap-3 w-full px-2 py-2 rounded transition ${sidebarTextSec} hover:bg-red-50 hover:text-red-600 ${!isLight && 'hover:bg-red-900/30 hover:text-red-400'} ${isDesktopCollapsed ? 'justify-center' : ''}`}
                     title="登出"
                   >
                     <LogOut size={18} /> 
                     {!isDesktopCollapsed && <span>登出</span>}
                   </button>
                </div>
              </div>

              <div className="flex-1 flex flex-col overflow-hidden w-full">
                <div className="md:hidden bg-white p-4 shadow-sm flex items-center justify-between border-b">
                   <button onClick={()=>setIsSidebarOpen(true)} className="text-gray-600"><Menu size={24}/></button>
                   <span className="font-bold text-gray-800">差勤排班系統</span>
                   <UserAvatar user={userData} size="w-8 h-8" textSize="text-xs" />
                </div>

                <main className="flex-1 overflow-y-auto p-2 md:p-4 bg-gray-100 transition-all">
                  {view === 'dashboard' && <Dashboard user={userData} leaves={leaves} calendarEvents={calendarEvents} setView={setView} />}
                  {view === 'calendar' && <CalendarView user={userData} users={usersList} events={calendarEvents} leaves={leaves} crud={crud} tags={{workTags, areaTags}} settings={settings} rotationRules={rotationRules} onUpdateRotationRules={handleUpdateRotationRules} />}
                  {view === 'leave' && <LeaveForm user={userData} users={usersList} leaves={leaves} events={calendarEvents} crud={crud} settings={settings} leaveTypes={leaveTypes} />}
                  {view === 'approval' && <ApprovalView currentUser={userData} leaves={leaves} crud={crud} users={usersList} />}
                  {view === 'management' && <ManagementView tags={{workTags, areaTags, handleAddTag, handleDeleteTag}} />}
                  {view === 'personal' && <PersonalScheduleView user={userData} events={calendarEvents} leaves={leaves} settings={settings} />}
                  {view === 'members' && <MembersView db={db} users={usersList} currentUser={userData} roleNames={roleNames} />}
                  {view === 'settings' && <SettingsView settings={settings} user={userData} tags={{workTags, areaTags, handleAddTag, handleDeleteTag}} leaveTypes={leaveTypes} handleManageLeaveTypes={handleManageLeaveTypes} onSave={handleUpdateSettings} onProfileSave={handleUpdateProfile} roleNames={roleNames} onUpdateRoleNames={handleUpdateRoleNames} />}
                  {view === 'profile' && <ProfileView user={userData} onSave={handleUpdateProfile} roleNames={roleNames} />}
                </main>
              </div>
            </div>
          );
        }

        // --- Sub-Components ---

        function Dashboard({ user, leaves, calendarEvents, setView }) {
          const today = new Date();
          const weekDays = ['週日', '週一', '週二', '週三', '週四', '週五', '週六'];
          
          const pendingCount = leaves.filter(l => l.status !== 'approved' && l.status !== 'rejected').length;
          
          const todayStr = today.toISOString().split('T')[0];
          const todayLeaves = leaves.filter(l => l.start.startsWith(todayStr) && l.status === 'approved').length;
          const todayExternal = new Set(
              calendarEvents.filter(e => e.date === todayStr && e.type === 'person')
              .filter(p => {
                  const tagEv = calendarEvents.find(t => t.groupId === p.groupId && t.type === 'tag');
                  return tagEv && EXTERNAL_WORK_TAGS.includes(tagEv.item);
              })
              .map(p => p.userName)
          ).size;

          const getWeekData = () => {
              const start = new Date(today);
              start.setDate(today.getDate() - today.getDay() + 1); 
              const week = [];
              for(let i=0; i<5; i++) {
                  const d = new Date(start);
                  d.setDate(start.getDate() + i);
                  const dStr = d.toISOString().split('T')[0];
                  
                  const externalPeople = { morning: [], afternoon: [], all_day: [] };
                  calendarEvents.filter(e => e.date === dStr && e.type === 'person').forEach(p => {
                      const tagEv = calendarEvents.find(t => t.groupId === p.groupId && t.type === 'tag');
                      if (tagEv && EXTERNAL_WORK_TAGS.includes(tagEv.item)) {
                          const s = p.slot || 'all_day';
                          if(externalPeople[s]) externalPeople[s].push(p.userAvatar); 
                      }
                  });
                  
                  week.push({ day: weekDays[i+1], date: dStr, external: externalPeople });
              }
              return week;
          };
          const weekData = getWeekData();

          return (
            <div className="space-y-6 max-w-5xl mx-auto">
              <div className="bg-white p-6 rounded-lg shadow-sm flex flex-col md:flex-row justify-between items-center gap-4">
                <div>
                  <h2 className="text-2xl font-bold text-gray-800">早安，{user.name} 👋</h2>
                  <p className="text-sm text-gray-500 font-medium">
                    {today.getFullYear()}/{today.getMonth()+1}/{today.getDate()} ({weekDays[today.getDay()]})
                  </p>
                </div>
                <div className="flex gap-2 overflow-x-auto w-full md:w-auto pb-1">
                  {WEATHER_LOCATIONS.map((w,i)=>(
                    <div key={i} className="min-w-[70px] bg-gray-50 p-2 rounded flex flex-col items-center border border-gray-100">
                      <span className="text-xs text-gray-500">{w.location}</span>
                      <div className="my-1">{w.icon}</div>
                      <span className="text-xs font-bold">{w.temp}</span>
                    </div>
                  ))}
                </div>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  <div className="bg-white p-5 rounded-lg shadow-sm border-l-4 border-blue-500">
                    <h3 className="text-gray-500 text-sm font-medium">今日外勤</h3>
                    <span className="text-2xl font-bold text-blue-700 block mt-1">{todayExternal} 人</span>
                  </div>
                  <div className="bg-white p-5 rounded-lg shadow-sm border-l-4 border-green-500">
                    <h3 className="text-gray-500 text-sm font-medium">今日請假</h3>
                    <span className="text-2xl font-bold text-green-700 block mt-1">{todayLeaves} 人</span>
                  </div>
                  <div 
                    onClick={() => setView('approval')}
                    className="bg-white p-5 rounded-lg shadow-sm border-l-4 border-orange-500 cursor-pointer hover:bg-orange-50 transition"
                  >
                    <h3 className="text-gray-500 text-sm font-medium flex items-center justify-between">
                        待審核 <ArrowRight size={16}/>
                    </h3>
                    <span className="text-2xl font-bold text-orange-600 block mt-1">{pendingCount} 筆</span>
                  </div>
              </div>

              <div className="bg-white rounded-lg shadow-sm border p-4">
                  <h3 className="font-bold text-gray-700 mb-4 flex items-center gap-2"><Briefcase size={18}/> 本週外勤概況</h3>
                  <div className="overflow-x-auto">
                      <table className="w-full text-xs text-left">
                          <thead>
                              <tr className="bg-gray-50 border-b text-gray-500">
                                  <th className="p-2 w-16">日期</th>
                                  <th className="p-2">上午</th>
                                  <th className="p-2">下午</th>
                                  <th className="p-2">整天</th>
                              </tr>
                          </thead>
                          <tbody>
                              {weekData.map((d, idx) => (
                                  <tr key={idx} className="border-b last:border-0">
                                      <td className="p-2 font-bold text-gray-600">{d.day} <span className="text-[10px] block font-normal">{d.date.slice(5)}</span></td>
                                      <td className="p-2">
                                          <div className="flex gap-1 flex-wrap">{d.external.morning.length > 0 ? d.external.morning.map((n,i)=><span key={i} className="bg-yellow-100 text-yellow-800 px-1.5 rounded">{n}</span>) : '-'}</div>
                                      </td>
                                      <td className="p-2">
                                          <div className="flex gap-1 flex-wrap">{d.external.afternoon.length > 0 ? d.external.afternoon.map((n,i)=><span key={i} className="bg-orange-100 text-orange-800 px-1.5 rounded">{n}</span>) : '-'}</div>
                                      </td>
                                      <td className="p-2">
                                          <div className="flex gap-1 flex-wrap">{d.external.all_day.length > 0 ? d.external.all_day.map((n,i)=><span key={i} className="bg-blue-100 text-blue-800 px-1.5 rounded">{n}</span>) : '-'}</div>
                                      </td>
                                  </tr>
                              ))}
                          </tbody>
                      </table>
                  </div>
              </div>
            </div>
          );
        }

        function CalendarView({ users, events, leaves, crud, tags, settings, rotationRules, onUpdateRotationRules }) {
          const [date, setDate] = useState(new Date());
          const [viewMode, setViewMode] = useState('month');
          const [modalOpen, setModalOpen] = useState(false);
          const [rotationModalOpen, setRotationModalOpen] = useState(false);
          const [modalData, setModalData] = useState({ date: '', workItem: '', note: '' });
          const [selSlot, setSelSlot] = useState('morning'); 
          const [selArea, setSelArea] = useState('');
          const [selUsers, setSelUsers] = useState([]);
          const [editGroupId, setEditGroupId] = useState(null);
          const [isSubmitting, setIsSubmitting] = useState(false);

          const getDaysInMonth = (d) => new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
          const getFirstDayOfMonth = (d) => new Date(d.getFullYear(), d.getMonth(), 1).getDay();
          
          const rotationStats = useMemo(() => {
              const currentYear = new Date().getFullYear();
              const stats = {}; 
              rotationRules.forEach(rule => {
                  stats[rule.id] = {};
                  rule.order.forEach(name => stats[rule.id][name] = 0);
              });
              events.forEach(e => {
                  if (e.type === 'person' && new Date(e.date).getFullYear() === currentYear) {
                      const tagEv = events.find(t => t.groupId === e.groupId && t.type === 'tag');
                      if (tagEv) {
                          const rule = rotationRules.find(r => r.matchTag === tagEv.item);
                          if (rule && stats[rule.id][e.userName] !== undefined) {
                              stats[rule.id][e.userName]++;
                          }
                      }
                  }
              });
              return stats;
          }, [events, rotationRules]);

          const getNextRotationPerson = (matchTag) => {
              const rule = rotationRules.find(r => r.matchTag === matchTag);
              if (!rule) return null;

              const sortedEvents = [...events]
                .filter(e => e.type === 'tag' && e.item === matchTag)
                .sort((a,b) => new Date(b.date) - new Date(a.date));

              let next = rule.order[0];
              let lastDate = null;
              
              if (sortedEvents.length > 0) {
                  lastDate = sortedEvents[0].date;
                  const lastGroup = sortedEvents[0].groupId;
                  const pplInGroup = events.filter(e => e.groupId === lastGroup && e.type === 'person').map(e=>e.userName);
                  
                  const presentIndexes = pplInGroup.map(p => rule.order.indexOf(p)).filter(i => i !== -1);
                  if (presentIndexes.length > 0) {
                      const maxIndex = Math.max(...presentIndexes);
                      next = rule.order[(maxIndex + 1) % rule.order.length];
                  }
              }
              
              return { user: users.find(u => u.name === next), lastDate };
          };

          const rotationData = rotationRules.map(rule => {
              const info = getNextRotationPerson(rule.matchTag);
              return { ...rule, nextPerson: info?.user?.name || rule.order[0], lastDate: info?.lastDate };
          });

          const handleDayClick = (dObj) => {
              const dStr = dObj.toISOString().split('T')[0];
              setModalData({ date: dStr, workItem: '', note: '' });
              setSelSlot('morning');
              setSelArea('');
              setSelUsers([]);
              setEditGroupId(null);
              setModalOpen(true);
          };

          const handleEventClick = (e, groupEvents) => {
              e.stopPropagation();
              const tagEv = groupEvents.find(ev => ev.type === 'tag');
              const personEvs = groupEvents.filter(ev => ev.type === 'person');
              
              if (tagEv) {
                  setModalData({ date: tagEv.date, workItem: tagEv.item, note: tagEv.note || '' });
                  setSelSlot(tagEv.slot || 'all_day');
                  setSelArea(tagEv.area || '');
                  setSelUsers(personEvs.map(p => p.userId));
                  setEditGroupId(tagEv.groupId);
                  setModalOpen(true);
              }
          };

          const handleRotationClick = (rule) => {
              setModalData(prev => ({...prev, workItem: rule.matchTag}));
              const info = getNextRotationPerson(rule.matchTag);
              if (info?.user) setSelUsers([info.user.uid || info.user.docId]);
              else setSelUsers([]);
          };

          const handleDeleteGroup = async () => {
              if(!editGroupId) return;
              if(confirm('確定要刪除此行程嗎？')) {
                  await crud.deleteEventsByGroup(editGroupId);
                  setModalOpen(false);
              }
          }

          const handleModalSave = async () => {
              if(!modalData.workItem) { alert("請選擇工作項目"); return; }
              
              let conflictMsg = "";
              for(const uid of selUsers) {
                  const userEvents = events.filter(e => e.date === modalData.date && e.type === 'person' && e.userId === uid && e.groupId !== editGroupId);
                  
                  const hasAllDay = userEvents.find(e => e.slot === 'all_day');
                  const hasMorning = userEvents.find(e => e.slot === 'morning');
                  const hasAfternoon = userEvents.find(e => e.slot === 'afternoon');
                  
                  const uName = users.find(u=>u.uid === uid || u.docId === uid)?.name;

                  if (selSlot === 'all_day' && (hasMorning || hasAfternoon || hasAllDay)) {
                      conflictMsg = `衝突警示：\n${uName} 在該日已有「${hasMorning?'上午':(hasAfternoon?'下午':'整天')}」行程，無法再排整天。`;
                  } else if (selSlot === 'morning' && (hasAllDay || hasMorning)) {
                      conflictMsg = `衝突警示：\n${uName} 在該日已有「${hasAllDay?'整天':'上午'}」行程。`;
                  } else if (selSlot === 'afternoon' && (hasAllDay || hasAfternoon)) {
                      conflictMsg = `衝突警示：\n${uName} 在該日已有「${hasAllDay?'整天':'下午'}」行程。`;
                  }
              }

              if (conflictMsg) {
                  alert(conflictMsg);
                  return;
              }

              setIsSubmitting(true);

              try {
                  if (editGroupId) {
                      await crud.deleteEventsByGroup(editGroupId);
                  }

                  const groupId = `g_${Date.now()}`; 
                  
                  await crud.createEvent({ 
                      groupId, date: modalData.date, type: 'tag', itemId: modalData.workItem, item: modalData.workItem, 
                      area: selArea, slot: selSlot, note: modalData.note, timestamp: new Date() 
                  });
                  
                  for(const uid of selUsers) {
                      const u = users.find(x=>x.uid === uid || x.docId === uid);
                      if(u) await crud.createEvent({ 
                          groupId, date: modalData.date, type: 'person', userId: u.uid || u.docId, userName: u.name, 
                          userAvatar: u.initials, userColor: u.color, slot: selSlot, timestamp: new Date() 
                      });
                  }
                  setModalOpen(false);
                  alert(editGroupId ? '行程修改完成' : '行程新增完成');
              } catch (e) {
                  alert('儲存失敗：' + e.message);
              } finally {
                  setIsSubmitting(false);
              }
          };

          const renderGrid = () => {
              const cells = [];
              const isMonth = viewMode === 'month';
              
              if (isMonth) {
                  const startDay = getFirstDayOfMonth(date);
                  const totalDays = getDaysInMonth(date);
                  for(let i=0; i<startDay; i++) cells.push(<div key={`empty-${i}`} className="bg-gray-50/50 border-b border-r border-gray-100 min-h-[140px] md:min-h-[18vh]"></div>);
                  for(let i=1; i<=totalDays; i++) {
                      const d = new Date(date.getFullYear(), date.getMonth(), i);
                      cells.push(renderDayCell(d));
                  }
              } else {
                  const day = date.getDay();
                  const diff = date.getDate() - day + 1; 
                  const weekStart = new Date(date);
                  weekStart.setDate(diff);
                  
                  for(let i=0; i<7; i++) {
                      const d = new Date(weekStart);
                      d.setDate(weekStart.getDate() + i);
                      cells.push(renderDayCell(d));
                  }
              }
              return cells;
          };

          const renderDayCell = (dObj) => {
              const dStr = dObj.toISOString().split('T')[0];
              const dayEvs = events.filter(e => e.date === dStr);
              const isToday = dStr === new Date().toISOString().split('T')[0];
              
              const dayOfWeek = dObj.getDay();
              const isWeekend = dayOfWeek === 0 || dayOfWeek === 6;
              const holidayName = TAIWAN_HOLIDAYS_2026[dStr];
              const isHoliday = !!holidayName;
              
              const slots = { morning: [], afternoon: [], all_day: [] };
              const groups = {};
              dayEvs.forEach(e => {
                  if (!groups[e.groupId]) groups[e.groupId] = { tag: null, people: [], slot: e.slot || 'all_day' };
                  if (e.type === 'tag') groups[e.groupId].tag = e;
                  if (e.type === 'person') groups[e.groupId].people.push(e);
              });
              Object.values(groups).forEach(g => { if (slots[g.slot]) slots[g.slot].push(g); });

              const renderGroup = (g) => {
                  const groupId = g.tag?.groupId || g.people[0]?.groupId;
                  const tagName = g.tag?.item || '未命名';
                  const areaName = g.tag?.area || '';
                  const note = g.tag?.note || '';
                  const areaColor = settings.areaColors[areaName] || "bg-gray-100 text-gray-800";
                  
                  const groupEvents = [g.tag, ...g.people].filter(Boolean);

                  return (
                    <div 
                        key={groupId} 
                        onClick={(e) => handleEventClick(e, groupEvents)}
                        className="flex flex-wrap items-center gap-1 bg-white border border-gray-200 rounded px-1.5 py-1 shadow-sm mb-1 cursor-pointer hover:bg-yellow-50 transition"
                    >
                        {areaName && <span className={`px-1.5 py-0.5 rounded text-[10px] md:text-xs font-bold ${areaColor}`}>{areaName}</span>}
                        <span className="text-xs md:text-sm text-blue-700 font-bold truncate">{tagName}</span>
                        {note && <span className="text-[10px] md:text-xs text-gray-500">({note})</span>}
                        {g.people.map(p => {
                            const userProfile = users.find(u => u.uid === p.userId || u.docId === p.userId || u.name === p.userName);
                            const displayUser = userProfile || { 
                                initials: p.userAvatar, 
                                color: p.userColor || 'bg-gray-200', 
                                usePhoto: false 
                            };
                            
                            return (
                                <UserAvatar 
                                    key={p.id} 
                                    user={displayUser} 
                                    size="w-5 h-5 md:w-6 md:h-6" 
                                    textSize="text-[10px] md:text-xs" 
                                />
                            );
                        })}
                        <button onClick={(e)=>{e.stopPropagation(); if(confirm('刪除?')) crud.deleteEventsByGroup(groupId)}} className="text-gray-300 hover:text-red-500"><X size={12}/></button>
                    </div>
                  );
              };

              const renderLeaves = () => {
                  const leavesOnDay = leaves.filter(l => l.status === 'approved' && dStr >= l.start.split('T')[0] && dStr <= l.end.split('T')[0]);
                  return leavesOnDay.map(l => {
                      return (
                          <div key={l.id} className="text-[10px] md:text-xs text-pink-700 bg-pink-100 border border-pink-200 rounded px-1 py-0.5 my-0.5 w-full select-none truncate font-bold text-center shadow-sm">
                              {l.requesterName} ({l.type})
                          </div>
                      );
                  });
              };

              return (
                  <div 
                    key={dStr} 
                    className={`border-b border-r border-gray-200 p-1 min-h-[140px] md:min-h-[18vh] relative transition-colors flex flex-col group hover:bg-gray-50`}
                    onClick={() => handleDayClick(dObj)}
                  >
                      <div className="w-full flex justify-between items-start mb-1">
                          <div className="flex flex-col items-center w-full">
                              <span className={`text-sm md:text-base font-bold px-3 py-0.5 w-full text-center ${isToday ? 'bg-yellow-300 text-black rounded-md shadow-sm' : (isWeekend || isHoliday ? 'text-red-500' : 'text-gray-700')}`}>
                                  {dObj.getDate()} {isHoliday && <span className="ml-1 text-[10px] md:text-xs bg-red-500 text-white px-1 rounded align-middle">{holidayName}</span>}
                              </span>
                          </div>
                          <div className="absolute top-1 right-1">
                              <Edit2 size={14} className="text-gray-300 group-hover:text-blue-500 opacity-0 group-hover:opacity-100 transition"/>
                          </div>
                      </div>
                      
                      <div className="flex-1 flex flex-col gap-1 overflow-hidden" onClick={e=>e.stopPropagation()}>
                          {slots.all_day.length > 0 && <div className="bg-sky-500/10 p-0.5 rounded border border-sky-200"><div className="text-[10px] md:text-xs text-sky-700 font-bold mb-0.5 px-1">整天</div>{slots.all_day.map(renderGroup)}</div>}
                          {slots.morning.length > 0 && <div className="bg-sky-100/30 p-0.5 rounded border border-sky-100"><div className="text-[10px] md:text-xs text-sky-600 font-bold mb-0.5 px-1">上午</div>{slots.morning.map(renderGroup)}</div>}
                          {slots.afternoon.length > 0 && <div className="bg-sky-300/20 p-0.5 rounded border border-sky-200"><div className="text-[10px] md:text-xs text-sky-800 font-bold mb-0.5 px-1">下午</div>{slots.afternoon.map(renderGroup)}</div>}
                          
                          <div className="mt-auto flex flex-col-reverse gap-0.5 w-full">
                              {renderLeaves()}
                          </div>
                      </div>
                  </div>
              );
          };

          return (
            <div className="flex flex-col h-full gap-4">
               <div className="flex-1 flex flex-col bg-white rounded-lg shadow-sm border h-full">
                  <div className="p-4 border-b flex justify-between items-center bg-gray-50">
                      <div className="flex items-center gap-2">
                        <span className="text-xl font-bold text-gray-700">{date.getFullYear()}年{date.getMonth()+1}月</span>
                        <div className="flex bg-white rounded border shadow-sm">

        function RotationModal({ open, onClose, rules, onUpdateRules, rotationData, rotationStats }) {
            const [editMode, setEditMode] = useState(null);
            const [tempOrder, setTempOrder] = useState([]);
            const [password, setPassword] = useState('');
            const [showPass, setShowPass] = useState(false);

            if(!open) return null;

            const startEdit = (rule) => {
                setEditMode(rule.id);
                setTempOrder([...rule.order]);
                setPassword('');
                setShowPass(false);
            }

            const moveItem = (index, direction) => {
                const newOrder = [...tempOrder];
                const targetIndex = index + direction;
                if(targetIndex >= 0 && targetIndex < newOrder.length) {
                    [newOrder[index], newOrder[targetIndex]] = [newOrder[targetIndex], newOrder[index]];
                    setTempOrder(newOrder);
                }
            }

            const saveOrder = () => {
                if(!showPass) { setShowPass(true); return; }
                if(password !== '0000') { alert('密碼錯誤'); return; }
                
                const newRules = rules.map(r => r.id === editMode ? {...r, order: tempOrder} : r);
                onUpdateRules(newRules);
                setEditMode(null);
                alert('順序已更新');
            }

            return (
                <div className="fixed inset-0 bg-black/60 z-[70] flex items-center justify-center p-4 animate-in fade-in" onClick={onClose}>
                    <div className="bg-white rounded-xl w-full max-w-lg shadow-2xl p-6" onClick={e=>e.stopPropagation()}>
                        <div className="flex justify-between items-center mb-4">
                            <h3 className="font-bold text-lg flex items-center gap-2"><RefreshCw/> 智慧輪序參考表</h3>
                            <button onClick={onClose}><X/></button>
                        </div>
                        
                        <div className="space-y-4 max-h-[60vh] overflow-y-auto pr-2">
                            {rotationData.map(r => (
                                <div key={r.id} className="bg-gray-50 p-3 rounded-lg border">
                                    <div className="flex justify-between font-bold mb-2 items-center">
                                        <div className="flex flex-col">
                                            <span>{r.name}</span>
                                            <span className="text-[10px] font-normal text-gray-500">上次: {r.lastDate || '無'}</span>
                                        </div>
                                        {editMode !== r.id ? (
                                            <button onClick={()=>startEdit(r)} className="text-gray-400 hover:text-blue-600"><Edit2 size={14}/></button>
                                        ) : (
                                            <div className="flex gap-2">
                                                {showPass ? (
                                                    <input autoFocus className="w-16 text-xs border rounded p-1" placeholder="密碼" type="password" value={password} onChange={e=>setPassword(e.target.value)} />
                                                ) : null}
                                                <button onClick={saveOrder} className="text-green-600 text-xs font-bold">儲存</button>
                                                <button onClick={()=>setEditMode(null)} className="text-gray-400 text-xs">取消</button>
                                            </div>
                                        )}

                                    <div className="flex flex-wrap gap-1">
                                        {(editMode === r.id ? tempOrder : r.order).map((p, idx) => {
                                            const count = rotationStats[r.id] && rotationStats[r.id][p] ? rotationStats[r.id][p] : 0;
                                            return (
                                                <div key={p} className={`px-2 py-1 text-xs rounded text-center relative group ${p===r.nextPerson && editMode !== r.id ? 'bg-orange-100 text-orange-700 font-bold ring-2 ring-orange-200' : 'bg-white border text-gray-500'}`}>
                                                    {p}
                                                    <div className="text-[9px] text-gray-400 mt-0.5">(本年: {count})</div>
                                                    {editMode === r.id && (
                                                        <div className="absolute -top-2 -right-1 hidden group-hover:flex bg-white shadow border rounded">
                                                            <button onClick={()=>moveItem(idx, -1)} className="p-0.5 hover:text-blue-500"><ChevronLeft size={10}/></button>
                                                            <button onClick={()=>moveItem(idx, 1)} className="p-0.5 hover:text-blue-500"><ChevronRight size={10}/></button>
                                                        </div>
                                                    )}
                                                </div>
